<script>
  // Autopilot Map API Demo with Dynamic Tile Loading
// Display lane-level navigation data with multiple layers

// Use secret token with tilesets:read scope for Autopilot API
const AUTOPILOT_TOKEN = 'sk.REDACTED-autopilot-secret-TOKEN';

// Initialize map centered on Tokyo
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/dark-v11',
  center: [139.7670, 35.6812],
  zoom: 16,
  pitch: 0,
  bearing: 0
});

// Add navigation controls
map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');

// Tile cache to avoid re-fetching (with success/error status)
const tileCache = {
  lanes: new Map(),
  groups: new Map(),
  coverage: new Map(),
  'markup-lines': new Map(),
  'markup-points': new Map(),
  'markup-polygons': new Map(),
  'road-islands': new Map()
};

// Track which tiles have been loaded to the map (to avoid duplicate rendering)
const loadedTiles = {
  lanes: new Set(),
  groups: new Set(),
  coverage: new Set(),
  'markup-lines': new Set(),
  'markup-points': new Set(),
  'markup-polygons': new Set(),
  'road-islands': new Set()
};

// Track failed tiles (with retry capability)
const failedTiles = {
  lanes: new Map(),
  groups: new Map(),
  coverage: new Map(),
  'markup-lines': new Map(),
  'markup-points': new Map(),
  'markup-polygons': new Map(),
  'road-islands': new Map()
};

// Auto-load state
let autoLoadEnabled = true;

// Loading state
let isLoading = false;

// Get tile coordinates for a given point and zoom
function pointToTile(lng, lat, zoom) {
  const z = Math.floor(zoom);
  const x = Math.floor((lng + 180) / 360 * Math.pow(2, z));
  const y = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z));
  return { z, x, y };
}

// Get all tiles in current viewport
function getVisibleTiles(bounds, zoom) {
  const z = Math.floor(zoom);
  const nw = pointToTile(bounds.getWest(), bounds.getNorth(), z);
  const se = pointToTile(bounds.getEast(), bounds.getSouth(), z);

  const tiles = [];
  for (let x = Math.max(0, nw.x); x <= se.x; x++) {
    for (let y = Math.max(0, nw.y); y <= se.y; y++) {
      tiles.push({ z, x, y });
    }
  }
  return tiles;
}

// Fetch Autopilot data for a tile with retry support
async function fetchTileData(layer, tile, forceRetry = false) {
  const tileKey = `${tile.z}/${tile.x}/${tile.y}`;

  // Check cache (unless force retry)
  if (!forceRetry && tileCache[layer].has(tileKey)) {
    return tileCache[layer].get(tileKey);
  }

  // Check if this tile has failed before (unless force retry)
  if (!forceRetry && failedTiles[layer].has(tileKey)) {
    const failInfo = failedTiles[layer].get(tileKey);
    // Don't retry failed tiles immediately (wait at least 30 seconds)
    if (Date.now() - failInfo.timestamp < 30000) {
      return { type: 'FeatureCollection', features: [] };
    }
  }

  // Convert hyphenated layer names to underscored for API endpoint
  const apiLayer = layer.replace(/-/g, '_');
  const url = `https://api.mapbox.com/dataservices-tiles/v1/autopilot/${apiLayer}/${tile.z}/${tile.x}/${tile.y}.geojson?access_token=${AUTOPILOT_TOKEN}`;

  try {
    const response = await fetch(url);
    if (!response.ok) {
      if (response.status === 404) {
        // 404s are expected - not all tiles have data for all layers
        // Silently cache as empty and return
        const empty = { type: 'FeatureCollection', features: [] };
        tileCache[layer].set(tileKey, empty);
        // Remove from failed tiles if it was there
        failedTiles[layer].delete(tileKey);
        return empty;
      }
      throw new Error(`HTTP ${response.status}`);
    }
    const data = await response.json();
    tileCache[layer].set(tileKey, data);
    // Remove from failed tiles on success
    failedTiles[layer].delete(tileKey);
    return data;
  } catch (error) {
    // Log non-404 errors
    console.error(`Error fetching ${layer} tile ${tileKey}:`, error);

    // Track failed tile
    failedTiles[layer].set(tileKey, {
      error: error.message,
      timestamp: Date.now()
    });

    const empty = { type: 'FeatureCollection', features: [] };
    return empty;
  }
}

// Update status display
function updateStatus(message, type = 'normal') {
  const statusEl = document.getElementById('status-text');
  if (statusEl) {
    statusEl.textContent = message;
    statusEl.className = 'status-text';
    if (type === 'loading') statusEl.classList.add('loading');
    if (type === 'error') statusEl.classList.add('error');
    if (type === 'success') statusEl.classList.add('success');
  }
}

// Load tiles for all layers
async function loadVisibleTiles(forceRetry = false) {
  if (isLoading) {
    updateStatus('Already loading...', 'loading');
    return;
  }

  const bounds = map.getBounds();
  const zoom = map.getZoom();

  // Only load at zoom 14+
  if (zoom < 14) {
    updateStatus('Zoom in to level 14+', 'normal');
    return;
  }

  isLoading = true;
  updateStatus('Loading tiles...', 'loading');

  // Always fetch tiles at zoom 14 (where Autopilot data is available)
  const tileZoom = 14;
  const tiles = getVisibleTiles(bounds, tileZoom);
  const layers = ['lanes', 'groups', 'coverage', 'markup-lines', 'markup-points', 'markup-polygons', 'road-islands'];

  let totalLoaded = 0;
  let totalFailed = 0;

  try {
    for (const layer of layers) {
      const source = map.getSource(`${layer}-source`);
      if (!source) continue;

      // Get current features from source
      const currentData = source._data || { type: 'FeatureCollection', features: [] };
      const newFeatures = [...currentData.features];

      // Only fetch tiles that haven't been loaded yet (or force retry)
      for (const tile of tiles) {
        const tileKey = `${tile.z}/${tile.x}/${tile.y}`;

        // Skip if already loaded to map (unless force retry)
        if (!forceRetry && loadedTiles[layer].has(tileKey)) continue;

        const data = await fetchTileData(layer, tile, forceRetry);
        if (data.features && data.features.length > 0) {
          // Remove old features from this tile if retrying
          if (forceRetry && loadedTiles[layer].has(tileKey)) {
            // Filter out features from this tile (can't easily identify, so keep all)
          }
          newFeatures.push(...data.features);
          loadedTiles[layer].add(tileKey);
          totalLoaded++;
        } else {
          // Mark empty tiles as loaded too to avoid re-checking
          loadedTiles[layer].add(tileKey);
          if (failedTiles[layer].has(tileKey)) {
            totalFailed++;
          }
        }
      }

      // Update source with accumulated features
      source.setData({
        type: 'FeatureCollection',
        features: newFeatures
      });
    }

    // Count total loaded tiles across all layers
    const totalTileCount = Object.values(loadedTiles).reduce((sum, set) => sum + set.size, 0);

    if (totalFailed > 0) {
      updateStatus(`Loaded ${totalTileCount} tiles (${totalFailed} errors)`, 'error');
    } else {
      updateStatus(`Loaded ${totalTileCount} tiles`, 'success');
    }
  } catch (error) {
    console.error('Error loading tiles:', error);
    updateStatus('Error loading tiles', 'error');
  } finally {
    isLoading = false;
  }
}

// Load just the center tile
async function loadCenterTile() {
  if (isLoading) {
    updateStatus('Already loading...', 'loading');
    return;
  }

  const zoom = map.getZoom();

  // Only load at zoom 14+
  if (zoom < 14) {
    updateStatus('Zoom in to level 14+', 'normal');
    return;
  }

  isLoading = true;
  updateStatus('Loading center tile...', 'loading');

  const center = map.getCenter();
  const tileZoom = 14;
  const tile = pointToTile(center.lng, center.lat, tileZoom);
  const layers = ['lanes', 'groups', 'coverage', 'markup-lines', 'markup-points', 'markup-polygons', 'road-islands'];

  let totalLoaded = 0;
  let totalFailed = 0;

  try {
    for (const layer of layers) {
      const source = map.getSource(`${layer}-source`);
      if (!source) continue;

      const currentData = source._data || { type: 'FeatureCollection', features: [] };
      const newFeatures = [...currentData.features];

      const tileKey = `${tile.z}/${tile.x}/${tile.y}`;

      // Always load center tile (force retry)
      const data = await fetchTileData(layer, tile, true);
      if (data.features && data.features.length > 0) {
        newFeatures.push(...data.features);
        loadedTiles[layer].add(tileKey);
        totalLoaded++;
      } else {
        loadedTiles[layer].add(tileKey);
        if (failedTiles[layer].has(tileKey)) {
          totalFailed++;
        }
      }

      source.setData({
        type: 'FeatureCollection',
        features: newFeatures
      });
    }

    const totalTileCount = Object.values(loadedTiles).reduce((sum, set) => sum + set.size, 0);

    if (totalFailed > 0) {
      updateStatus(`Loaded ${totalTileCount} tiles (${totalFailed} errors)`, 'error');
    } else {
      updateStatus(`Loaded ${totalTileCount} tiles`, 'success');
    }
  } catch (error) {
    console.error('Error loading center tile:', error);
    updateStatus('Error loading tile', 'error');
  } finally {
    isLoading = false;
  }
}

// Clear all loaded data and caches
function clearAllData() {
  if (isLoading) {
    updateStatus('Cannot clear while loading', 'error');
    return;
  }

  const layers = ['lanes', 'groups', 'coverage', 'markup-lines', 'markup-points', 'markup-polygons', 'road-islands'];

  // Clear all caches
  layers.forEach(layer => {
    tileCache[layer].clear();
    loadedTiles[layer].clear();
    failedTiles[layer].clear();

    // Clear map source
    const source = map.getSource(`${layer}-source`);
    if (source) {
      source.setData({ type: 'FeatureCollection', features: [] });
    }
  });

  updateStatus('Cleared all data', 'success');
  console.log('All data cleared. You can now reload tiles.');
}

// Add layers to map
map.on('load', async () => {
  // Initialize empty sources for all layers
  const layers = ['lanes', 'groups', 'coverage', 'markup-lines', 'markup-points', 'markup-polygons', 'road-islands'];
  layers.forEach(layer => {
    map.addSource(`${layer}-source`, {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });
  });

  // Add lanes layer with markup color
  map.addLayer({
    id: 'lanes',
    type: 'line',
    source: 'lanes-source',
    layout: {
      'line-join': 'round',
      'line-cap': 'round'
    },
    paint: {
      // Color by markup color (white/yellow lane markings)
      'line-color': [
        'match',
        ['get', 'markupColor'],
        'white', '#FFFFFF',
        'yellow', '#FFD700',
        '#888888'
      ],
      'line-width': 2,
      'line-opacity': 0.9
    }
  });

  // Add lane groups layer
  map.addLayer({
    id: 'groups',
    type: 'line',
    source: 'groups-source',
    layout: {
      'line-join': 'round',
      'line-cap': 'round'
    },
    paint: {
      'line-color': '#7B68EE',
      'line-width': 3,
      'line-opacity': 0.7
    }
  });

  // Add coverage layer (polygon)
  map.addLayer({
    id: 'coverage',
    type: 'fill',
    source: 'coverage-source',
    paint: {
      'fill-color': '#4A90E2',
      'fill-opacity': 0.2,
      'fill-outline-color': '#4A90E2'
    }
  });

  // Add markup lines layer (stoplines, crossings)
  map.addLayer({
    id: 'markup-lines',
    type: 'line',
    source: 'markup-lines-source',
    layout: {
      'line-join': 'round',
      'line-cap': 'butt'
    },
    paint: {
      'line-color': '#FF6B6B',
      'line-width': 3,
      'line-opacity': 0.9
    }
  });

  // Add markup points layer
  map.addLayer({
    id: 'markup-points',
    type: 'circle',
    source: 'markup-points-source',
    paint: {
      'circle-radius': 6,
      'circle-color': '#FF8C00',
      'circle-stroke-width': 2,
      'circle-stroke-color': '#FFFFFF',
      'circle-opacity': 0.9
    }
  });

  // Add markup polygons layer
  map.addLayer({
    id: 'markup-polygons',
    type: 'fill',
    source: 'markup-polygons-source',
    paint: {
      'fill-color': '#FF6B6B',
      'fill-opacity': 0.4,
      'fill-outline-color': '#FF6B6B'
    }
  });

  // Add road islands layer (plural - polygon)
  map.addLayer({
    id: 'road-islands',
    type: 'fill',
    source: 'road-islands-source',
    paint: {
      'fill-color': '#50C878',
      'fill-opacity': 0.4,
      'fill-outline-color': '#50C878'
    }
  });

  // Add click handlers for feature inspection
  const clickableLayers = ['lanes', 'groups', 'coverage', 'markup-lines', 'markup-points', 'markup-polygons', 'road-islands'];

  clickableLayers.forEach(layerId => {
    map.on('click', layerId, (e) => {
      const features = e.features;
      if (features.length > 0) {
        const feature = features[0];
        const properties = feature.properties;

        let html = `<strong>Layer:</strong> ${layerId}<br>`;

        // Display relevant properties
        Object.keys(properties).forEach(key => {
          if (key !== 'layer' && properties[key] !== null && properties[key] !== undefined) {
            html += `<strong>${key}:</strong> ${properties[key]}<br>`;
          }
        });

        new mapboxgl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(html)
          .addTo(map);
      }
    });

    // Change cursor on hover
    map.on('mouseenter', layerId, () => {
      map.getCanvas().style.cursor = 'pointer';
    });

    map.on('mouseleave', layerId, () => {
      map.getCanvas().style.cursor = '';
    });
  });

  // Setup layer toggle controls
  setupLayerToggles();

  // Setup load controls
  setupLoadControls();

  // Load initial tiles
  loadVisibleTiles();
});

// Reload tiles when map moves or zooms (only if auto-load is enabled)
map.on('moveend', () => {
  if (autoLoadEnabled) {
    loadVisibleTiles();
  }
});

map.on('zoomend', () => {
  if (autoLoadEnabled) {
    loadVisibleTiles();
  }
});

// Update zoom indicator and warning
function updateZoomIndicator() {
  const zoom = map.getZoom();
  const zoomIndicator = document.getElementById('zoom-indicator');
  const zoomWarning = document.getElementById('zoom-warning');

  if (zoomIndicator) {
    zoomIndicator.textContent = `Zoom: ${zoom.toFixed(1)}`;
  }

  if (zoomWarning) {
    if (zoom < 14) {
      zoomWarning.classList.add('visible');
    } else {
      zoomWarning.classList.remove('visible');
    }
  }
}

// Update on zoom changes
map.on('zoom', updateZoomIndicator);

// Initialize zoom indicator
map.on('load', () => {
  updateZoomIndicator();
});

// Function to setup layer toggle controls
function setupLayerToggles() {
  const toggles = {
    'toggle-lanes': 'lanes',
    'toggle-groups': 'groups',
    'toggle-coverage': 'coverage',
    'toggle-markup-lines': 'markup-lines',
    'toggle-markup-points': 'markup-points',
    'toggle-markup-polygons': 'markup-polygons',
    'toggle-road-islands': 'road-islands'
  };

  Object.keys(toggles).forEach(toggleId => {
    const checkbox = document.getElementById(toggleId);
    const layerId = toggles[toggleId];

    checkbox.addEventListener('change', function() {
      const visibility = this.checked ? 'visible' : 'none';
      map.setLayoutProperty(layerId, 'visibility', visibility);
    });
  });
}

// Function to setup load controls
function setupLoadControls() {
  const loadCenterBtn = document.getElementById('load-center');
  const loadVisibleBtn = document.getElementById('load-visible');
  const clearAllBtn = document.getElementById('clear-all');
  const toggleAutoLoadBtn = document.getElementById('toggle-auto-load');

  // Load center tile button
  if (loadCenterBtn) {
    loadCenterBtn.addEventListener('click', () => {
      loadCenterTile();
    });
  }

  // Load visible tiles button
  if (loadVisibleBtn) {
    loadVisibleBtn.addEventListener('click', () => {
      loadVisibleTiles(true); // Force retry
    });
  }

  // Clear all data button
  if (clearAllBtn) {
    clearAllBtn.addEventListener('click', () => {
      if (confirm('Clear all loaded data? This will remove all features from the map.')) {
        clearAllData();
      }
    });
  }

  // Toggle auto-load button
  if (toggleAutoLoadBtn) {
    toggleAutoLoadBtn.addEventListener('click', function() {
      autoLoadEnabled = !autoLoadEnabled;
      this.textContent = autoLoadEnabled ? 'Auto-Load: ON' : 'Auto-Load: OFF';
      this.classList.toggle('active', autoLoadEnabled);

      if (autoLoadEnabled) {
        updateStatus('Auto-load enabled', 'success');
        // Immediately load visible tiles
        loadVisibleTiles();
      } else {
        updateStatus('Auto-load disabled', 'normal');
      }
    });
  }

  // Disable buttons while loading
  const updateButtonStates = () => {
    if (loadCenterBtn) loadCenterBtn.disabled = isLoading;
    if (loadVisibleBtn) loadVisibleBtn.disabled = isLoading;
    if (clearAllBtn) clearAllBtn.disabled = isLoading;
  };

  // Update button states periodically
  setInterval(updateButtonStates, 100);
}

// Add map error handling (only log critical errors)
map.on('error', (e) => {
  // Ignore style validation errors which are common during layer initialization
  if (e.error && e.error.message && !e.error.message.includes('layer')) {
    console.error('Map error:', e);
  }
});

</script>
