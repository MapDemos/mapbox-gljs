<!--
  Japan Weather Layers explorer: all of Mapbox's mapbox.weather-jp-* tilesets
  (nowcast, rain forecasts, JMA alert / landslide / river-flood danger maps,
  snow depth, temperature, wind) in one viewer, built on the Weather Console
  style pack (shared/templates/weather-console.css) -- see
  shared/templates/weather-console-template.html for the pattern.

  - Each tileset keeps the basemap it always had: the Blackprint style
    (which replaced the old precipitation style) for rain, snow and
    temperature, light-v11 for alert / landslide / flood, satellite-v9 for
    wind. Data layers sit just under the labels, wind particles on top.
  - Each tileset opens on its own color scale (Rain, Snow, the Kikikuru risk
    scales, Turbo); the Color scale / steps controls only show for rasters.
  - alert / landslide / flood show the JMA danger-level legend; the other
    rasters show a legend that follows the color scale.
  - Tilesets with several frames get Play + a scrubber; single-frame and
    vector tilesets show a clock only.
  - EN / 日本語 / 한국어 for the UI and the basemap labels (Japanese by default).
-->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Japan Weather Layers</title>
<link rel="icon" href="data:;base64,iVBORw0KGgo=" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.18.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.18.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>
<link href="shared/templates/weather-console.css" rel="stylesheet" />
<script src="shared/demo-kit.js"></script>
<style>
  /* Demo-owned: every demo positions its own #map, offset to sit beside
     #wc-panel. On mobile the panel becomes a bottom sheet, so the map must
     stop above it -- that keeps the Mapbox logo and attribution visible. */
  #map {
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--wc-panel-w);
    right: 0;
  }
  @media (max-width: 768px) {
    #map { left: 0; bottom: var(--wc-sheet-h); }
  }
</style>
</head>
<body>
<div id="map"></div>

<!-- autocomplete="off" on every control: otherwise the browser restores old values (slider position,

    <div class="wc-lang" role="radiogroup" aria-label="Language" id="lang-switch">

      <button type="button" role="radio" aria-checked="true" data-lang="ja">日本語</button>
      <button type="button" role="radio" aria-checked="false" data-lang="ko">한국어</button>
    </div>
  </header>

  <div class="wc-body">
    <section class="wc-section">
      <h2 class="wc-section-label" data-i18n="secData">Data</h2>
      <div class="wc-field">
        <label for="tileset-select" data-i18n="tileset">Tileset</label>
        <select autocomplete="off" id="tileset-select"></select>
      </div>
    </section>

    <!-- Raster tilesets only -->
    <section class="wc-section" id="color-section">
      <h2 class="wc-section-label" data-i18n="secColor">Color</h2>
      <div class="wc-field">
        <label for="scale-select" data-i18n="colorScale">Color scale</label>
        <select autocomplete="off" id="scale-select"></select>
      </div>
      <div class="wc-field">
        <label for="steps-select" data-i18n="colorSteps">Color steps</label>
        <select autocomplete="off" id="steps-select">
          <option value="256" selected>256</option>
          <option value="128">128</option>
          <option value="64">64</option>
          <option value="32">32</option>
          <option value="16">16</option>
          <option value="8">8</option>
        </select>
      </div>
    </section>

    <!-- Particle (wind) tilesets only -->
    <section class="wc-section hidden" id="particle-section">
      <h2 class="wc-section-label" data-i18n="secParticles">Wind particles</h2>

      <label class="wc-toggle">
        <span data-i18n="showParticles">Show particles</span>
        <span class="wc-switch">
          <input autocomplete="off" type="checkbox" id="show-particles" checked />
          <span class="wc-switch-track"></span>

      </label>

      <div class="wc-range-row">
        <div class="wc-range-head">

          <span class="wc-range-value" id="particle-count-value">1000</span>
        </div>
        <input autocomplete="off" type="range" class="wc-range" id="particle-count" min="1" max="30000" step="1" value="1000" />
      </div>

      <div class="wc-range-row">
        <div class="wc-range-head">
          <label for="particle-speed" data-i18n="particleSpeed">Speed</label>
          <span class="wc-range-value" id="particle-speed-value">0.08</span>
        </div>
        <input autocomplete="off" type="range" class="wc-range" id="particle-speed" min="0.01" max="1" step="0.01" value="0.08" />
      </div>

      <div class="wc-field">
        <label for="particle-color" data-i18n="particleColor">Particle color</label>
        <input autocomplete="off" type="color" class="wc-color" id="particle-color" value="#123461" />
      </div>
    </section>

    <section class="wc-section">
      <h2 class="wc-section-label" data-i18n="secDisplay">Display</h2>

      <div class="wc-field">

          <option value="albers">Albers</option>

          <option value="equirectangular">Equirectangular</option>
          <option value="naturalEarth">Natural Earth</option>
          <option value="lambertConformalConic">Lambert Conformal Conic</option>
          <option value="winkelTripel">Winkel Tripel</option>

      <div class="wc-field">
        <label for="zoom-select" data-i18n="zoomLevel">Zoom level</label>
        <select autocomplete="off" id="zoom-select"></select>
      </div>

      <div class="wc-status loading" id="status">

        <span class="wc-status-text" id="status-text" data-i18n="statusLoading">Loading data&hellip;</span>
      </div>
    </section>
  </div>
</aside>

<!-- One dock for everything floating at the bottom of the map. -->
<div class="wc-dock">
  <div class="wc-dock-top">
    <div class="wc-badge">
      <div class="wc-badge-item">
        <span class="wc-badge-label" data-i18n="zoom">Zoom</span>
        <span class="wc-badge-value" id="zoom-value">--</span>
      </div>
      <div class="wc-badge-item">
        <span class="wc-badge-label" data-i18n="loadTime">Load time</span>
        <span class="wc-badge-value" id="load-value">--</span>
      </div>
    </div>

    <div class="wc-dock-legends">

        <div class="wc-legend-bar" id="legend-bar"></div>
        <div class="wc-legend-ticks" id="legend-ticks"></div>
      </div>

        <div class="wc-risk-body">

            <div class="wc-meter-level l3"></div>
            <div class="wc-meter-level l2"></div>
            <div class="wc-meter-level l1" data-i18n="low">Low</div>
            <div class="wc-meter-axis" data-i18n="axis">Danger</div>

            <div class="wc-risk-row"><span class="wc-swatch l2"></span><span data-i18n="lvl2">Caution (Level 2)</span></div>
            <div class="wc-risk-row"><span class="wc-swatch l1"></span><span data-i18n="lvl1">Stay informed</span></div>

  </div>

      [12, 'rgba(51, 102, 255, 0.8)'], [16, 'rgba(51, 255, 0, 0.8)'], [24, 'rgba(51, 204, 0, 0.8)'], [32, 'rgba(25, 153, 0, 0.8)'],
      [40, 'rgba(255, 255, 0, 0.8)'], [48, 'rgba(255, 204, 0, 0.8)'], [56, 'rgba(255, 153, 0, 0.8)'], [64, 'rgba(255, 80, 102, 0.8)'],
      [80, 'rgba(255, 0, 0, 0.8)'], [200, 'rgba(183, 0, 16, 0.8)']
  ] },
  KikikuruShinsui: { steps: [
      [1.5, 'rgba(242, 231, 0, 1)'], [2.5, 'rgba(255, 40, 0, 1)'], [3.5, 'rgba(170, 0, 170, 1)'], [4.5, 'rgba(12, 0, 12, 1)']
  ] },
  KikikuruDosha: { steps: [
      [3.5, 'rgba(242, 231, 0, 1)'], [4.5, 'rgba(255, 40, 0, 1)'], [5.5, 'rgba(170, 0, 170, 1)'], [6.5, 'rgba(12, 0, 12, 1)']
  ] }
};
let scaleName = 'Turbo';
let colorSteps = 256;
let dataRange = [0, 1];   // the loaded tileset's own value range (set once its source has loaded)

const scaleSelect = document.getElementById('scale-select');
Object.keys(SCALES).forEach(name => {
  const o = document.createElement('option');
  o.value = name;
  o.textContent = name;
  scaleSelect.appendChild(o);
});

const rgbOpaque = (c) => c.replace(/rgba\((\d+),\s*(\d+),\s*(\d+),\s*[\d.]+\)/, 'rgb($1,$2,$3)');

// A flat range (alert is [0, 0], landslide [-2, 0]) would give a zero-width
// legend, duplicate color stops (which Mapbox rejects) and a 1-2-5 tick step of
// 0 -- so everything but the layer's own raster-color-range uses a widened one.
function safeRange([lo, hi]) { return hi > lo ? [lo, hi] : [lo, lo + 1]; }

function pct(v, domain) { return ((v - domain[0]) / (domain[1] - domain[0]) * 100).toFixed(2) + '%'; }

// Returns the mapbox raster-color expression, the matching CSS gradient and
// the value domain the legend bar spans
function buildColor() {
  const sc = SCALES[scaleName];
  if (sc.steps) {
    // The last color holds past its stop; give it one more interval on the legend
    const first = sc.steps[0][0], last = sc.steps[sc.steps.length - 1][0];
    const end = last + (last - sc.steps[sc.steps.length - 2][0]);
    const domain = [first, end];
    const bounds = sc.steps.map(([v]) => v).concat(end);
    return {
      expr: ['step', ['raster-value'], 'rgba(0, 0, 0, 0)'].concat(sc.steps.flat()),
      css: 'linear-gradient(to right, ' + sc.steps.map(([, c], i) =>
        rgbOpaque(c) + ' ' + pct(bounds[i], domain) + ', ' + rgbOpaque(c) + ' ' + pct(bounds[i + 1], domain)).join(', ') + ')',
      domain
    };
  }
  const [lo, hi] = safeRange(dataRange);
  const n = colorSteps;
  const colors = d3.quantize(sc.fn, n);
  // As the original: a transparent base, then color i from lo + range * i / n
  const expr = ['step', ['raster-value'], 'rgba(0, 0, 0, 0)'];
  colors.forEach((c, i) => expr.push(lo + (hi - lo) * i / n, c));
  const css = 'linear-gradient(to right, ' + colors.map((c, i) =>
    c + ' ' + (i / n * 100).toFixed(2) + '%, ' + c + ' ' + ((i + 1) / n * 100).toFixed(2) + '%').join(', ') + ')';
  return { expr, css, domain: [lo, hi] };
}

// 1-2-5 tick values across a domain, at most `max` of them
function niceTicks(lo, hi, max) {
  const raw = (hi - lo) / max;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(x => x >= raw);
  const ticks = [];
  for (let k = Math.ceil(lo / step); k * step <= hi + 1e-9; k++) ticks.push(+(k * step).toFixed(6));
  return ticks;
}

let rasterReady = false;   // the layer has its real range, colors and band

function applyColor() {
  const { expr, css, domain } = buildColor();
  const sc = SCALES[scaleName];
  document.getElementById('legend-bar').style.setProperty('--wc-gradient', css);
  document.getElementById('legend-ticks').innerHTML = niceTicks(domain[0], domain[1], 6)
    .map(v => '<span style="--pos:' + pct(v, domain) + '">' + v + '</span>').join('');
  document.getElementById('legend-title').textContent = scaleName;
  document.getElementById('steps-select').disabled = !sc.fn;  // steps only apply to the d3 ramps
  if (rasterReady && map.getLayer('wx') && current.kind === 'raster') {
    map.setPaintProperty('wx', 'raster-color', expr);
  }
}

const els = {

  play: document.getElementById('play-btn'),
  timebar: document.getElementById('timebar'),

  time: document.getElementById('clock-time'),

};

let playTimer = null;
let statusKey = 'statusLoading';

/* -------------------------------------------------------------- time -- */
// Show times in JST, in the UI language's own date/time conventions.
function formatJST(d) {
  const tz = 'Asia/Tokyo';
  return {
    date: new Intl.DateTimeFormat(LOCALES[lang], { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d),
    time: new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(d)
  };
}

// Bands are Unix-seconds strings, but a tileset may name a band something else
function formatBand(band) {
  if (isNaN(Number(band))) return { date: '', time: '' };
  return formatJST(new Date(Number(band) * 1000));
}

function renderClock() {
  let f = null;
  if (staticTime) f = formatJST(staticTime);
  else if (bands.length) f = formatBand(bands[Number(els.slider.value)]);
  if (!f) { els.date.textContent = '--'; els.time.textContent = '--:--'; return; }
  els.date.textContent = f.date;
  els.time.textContent = f.time;
  if (bands.length > 1) {
    const first = formatBand(bands[0]), last = formatBand(bands[bands.length - 1]);
    els.tickStart.textContent = first.date + ' ' + first.time;
    els.tickEnd.textContent = last.date + ' ' + last.time;
  }
}

function setBand(i) {
  els.slider.value = i;
  renderClock();
  if (!map.getLayer('wx')) return;
  // The particle layer has its own band property
  map.setPaintProperty('wx', current.kind === 'particle' ? 'raster-particle-array-band' : 'raster-array-band', bands[i]);
}

els.slider.addEventListener('input', () => setBand(Number(els.slider.value)));

// Vector tilesets carry their data time in the TileJSON description ("... :: yyyyMMddHHmmss", UTC)
async function fetchDescriptionTime(tilesetId) {
  const r = await fetch('https://api.mapbox.com/v4/' + tilesetId + '.json?access_token=' + mapboxgl.accessToken);
  if (!r.ok) return null;
  const m = /::\s*(\d{14})/.exec((await r.json()).description || '');
  if (!m) return null;
  const s = m[1];
  return new Date(Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8), +s.slice(8, 10), +s.slice(10, 12), +s.slice(12, 14)));
}

/* -------------------------------------------------------------- play -- */
function renderPlay() {
  els.play.textContent = playing ? t('stop') : t('play');
  els.play.classList.toggle('is-active', playing);
}
function tick() {
  playTimer = null;
  if (!playing) return;
  setBand((Number(els.slider.value) + 1) % bands.length);
  playTimer = setTimeout(tick, 800);
}
function stopPlay() {
  playing = false;
  clearTimeout(playTimer);   // never leave a pending tick: Stop then Play would start two loops
  playTimer = null;
  renderPlay();
}
els.play.addEventListener('click', () => {
  if (playing) { stopPlay(); return; }
  playing = true;
  renderPlay();
  tick();
});

function setStatus(key) {
  statusKey = key;
  const cls = key === 'statusReady' ? 'success' : key === 'statusError' ? 'error' : 'loading';
  els.status.className = 'wc-status ' + cls;
  els.statusIcon.className = 'wc-status-icon' + (cls === 'loading' ? ' spinning' : '');
  els.statusIcon.innerHTML = cls === 'loading' ? '&#8635;' : cls === 'success' ? '&#10003;' : '&#9888;';
  els.statusText.textContent = t(key);
}

// A tileset with a `risk` shows the JMA danger-level card (flood: its lowest
// level is cyan); other rasters show the gradient; particles have no legend.

  const card = document.getElementById('legend-levels');
  card.classList.toggle('is-flood', current.risk === 'Flood');
  if (current.risk) {
    const title = document.getElementById('risk-title');
    title.dataset.i18n = 'riskTitle' + current.risk;
    title.textContent = t(title.dataset.i18n);

/* --------------------------------------------------------------- map -- */
const map = new mapboxgl.Map({
  container: 'map',
  style: TILESETS[firstTileset].style,
  projection: 'mercator',
  center: [139.767125, 35.681236],
  zoom: 4,
  customAttribution: '<a href="https://www.jma.go.jp/jma/indexe.html" target="_blank" rel="noopener">Japan Meteorological Agency</a>'
});
map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');

/* ----------------------------------------------- basemap label language -- */
// Snapshot each label layer's original text-field once, then rewrite every
// ['get', 'name_xx'] lookup in it for the chosen language, falling back to
// name_en (and, as the style already does, to plain name) when a place has
// no name in that language. (map.setLanguage() does nothing on this style:
// it has name_ja / name_en baked into its label expressions.)
const NAME_KEY = /^name_[a-z]{2}(_[A-Za-z]+)?$/;
let originalLabels = null;

function rewriteNames(expr, code) {
  if (!Array.isArray(expr)) return expr;
  if (expr[0] === 'get' && typeof expr[1] === 'string' && NAME_KEY.test(expr[1])) {
    return code === 'en' ? ['get', 'name_en'] : ['coalesce', ['get', 'name_' + code], ['get', 'name_en']];
  }
  return expr.map(e => rewriteNames(e, code));
}

function setLabelLanguage(code) {
  if (!originalLabels) {   // first call after a style load
    originalLabels = {};
    map.getStyle().layers.forEach(l => {
      const tf = l.type === 'symbol' && l.layout && l.layout['text-field'];
      if (Array.isArray(tf) && JSON.stringify(tf).includes('"name_')) originalLabels[l.id] = tf;
    });
  }
  Object.entries(originalLabels).forEach(([id, tf]) => {
    if (map.getLayer(id)) map.setLayoutProperty(id, 'text-field', rewriteNames(tf, code));
  });
}

// These styles have no slots, so data layers go under a label layer (the
// first one, unless the style has a known anchor) and the labels stay on top.
// On light-v11 the original inserted data before 'admin-0-boundary-disputed'.
const ANCHORS = { [LIGHT]: 'admin-0-boundary-disputed' };
function labelAnchor() {
  const named = ANCHORS[currentStyle];
  if (named && map.getLayer(named)) return named;
  const l = map.getStyle().layers.find(layer => layer.type === 'symbol');
  return l && l.id;
}

const popup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false, className: 'wc-popup' });
let onData = null;
let currentStyle = TILESETS[firstTileset].style;
let styleReady = false;       // false while a (new) style is loading: layers can't be added yet
let chosenProjection = 'mercator';  // the original default; whatever the user picks replaces it, and it survives basemap changes

// Picking a tileset: swap the basemap first when it uses a different one (the
// style.load handler then loads the tileset), otherwise load it straight away.
function selectTileset(key) {
  const cfg = TILESETS[key];
  if (cfg.style === currentStyle) { loadTileset(key); return; }
  stopPlay();
  popup.remove();
  if (onData) { map.off('sourcedata', onData); onData = null; }
  currentStyle = cfg.style;
  styleReady = false;
  map.setStyle(cfg.style);
}

function loadTileset(key) {
  if (!styleReady) return;   // style.load will load the selected tileset
  stopPlay();
  current = TILESETS[key];
  const cfg = current;
  els.slider.disabled = true;
  els.play.disabled = true;
  bands = [];
  staticTime = null;
  rasterReady = false;
  renderClock();
  setStatus('statusLoading');
  popup.remove();
  if (onData) { map.off('sourcedata', onData); onData = null; }  // a switch before the last load finished
  if (map.getLayer('wx')) map.removeLayer('wx');
  if (map.getSource('wx')) map.removeSource('wx');

  // Each tileset opens on its own color scale
  if (cfg.kind === 'raster') {
    scaleName = cfg.scale;
    scaleSelect.value = scaleName;
  }

  // Show only the controls that apply to this tileset type
  document.getElementById('color-section').classList.toggle('hidden', cfg.kind !== 'raster');
  document.getElementById('particle-section').classList.toggle('hidden', cfg.kind !== 'particle');
  if (cfg.particleColor) document.getElementById('particle-color').value = cfg.particleColor;   // white reads on the satellite basemap
  els.timebar.classList.toggle('is-clock', cfg.kind === 'vector');   // refined once the band count is known
  updateLegend();
  applyColor();

  loadStart = performance.now();
  const isVector = cfg.kind === 'vector';
  map.addSource('wx', isVector
    ? { type: 'vector', url: 'mapbox://' + cfg.id }
    : { type: 'raster-array', url: 'mapbox://' + cfg.id, ...(cfg.kind === 'particle' ? { maxzoom: 16 } : {}) });

  if (cfg.kind === 'particle') {
    map.addLayer({
      id: 'wx',
      type: 'raster-particle',
      source: 'wx',
      'source-layer': cfg.layer,
      layout: { visibility: document.getElementById('show-particles').checked ? 'visible' : 'none' },
      minzoom: 0,
      maxzoom: 22,
      paint: {
        'raster-particle-count': Number(document.getElementById('particle-count').value),
        'raster-particle-speed-factor': Number(document.getElementById('particle-speed').value),
        'raster-particle-max-speed': 10,
        'raster-particle-fade-opacity-factor': 0.9,
        'raster-particle-reset-rate-factor': 0.4,
        'raster-particle-color': document.getElementById('particle-color').value
      }
    });   // no beforeId: particles sit on top of everything
  } else if (isVector) {
    // Colored by risk level; TYPE 1 and 2 are the two JMA flood products
    map.addLayer({
      id: 'wx',
      type: 'line',
      source: 'wx',
      'source-layer': cfg.layer,
      paint: {
        'line-color': ['case',
          ['==', ['get', 'TYPE'], '1'],
          ['interpolate', ['linear'], ['to-number', ['get', 'FLOODRISK']], 1, '#cccc00', 2, '#ff0000', 3, '#800080', 4, '#000000'],
          ['==', ['get', 'TYPE'], '2'],
          ['interpolate', ['linear'], ['to-number', ['get', 'FLOODFCST']], 2, '#cccc00', 3, '#ff0000', 4, '#800080', 5, '#000000'],
          '#ADD8E6'],
        'line-width': ['interpolate', ['linear'], ['zoom'],
          0, ['case', ['==', ['get', 'TYPE'], '1'], 1, ['==', ['get', 'TYPE'], '2'], 2, 1],
          10, ['case', ['==', ['get', 'TYPE'], '1'], 4, ['==', ['get', 'TYPE'], '2'], 6, 4],
          15, ['case', ['==', ['get', 'TYPE'], '1'], 8, ['==', ['get', 'TYPE'], '2'], 12, 8]],
        'line-opacity': 1.0
      }
    }, labelAnchor());
  } else {
    // Same paint as the original. Added with a transparent placeholder color: the
    // real value range, colors and band come from the source once it has loaded (below)
    map.addLayer({
      id: 'wx',
      type: 'raster',
      source: 'wx',
      'source-layer': cfg.layer,
      paint: {
        'raster-color-range': [0, 1],
        'raster-color': ['interpolate', ['linear'], ['raster-value'], 0, 'rgba(0, 0, 0, 0)', 1, 'rgba(0, 0, 0, 0)'],
        'raster-resampling': 'nearest',
        'raster-color-range-transition': { duration: 0 },
        'raster-opacity': 1.0,
        'raster-emissive-strength': 1.0,
        'raster-fade-duration': 0
      }
    }, labelAnchor());
  }

  // Take the bands and value range from the source itself once it has loaded,
  // not from a separate TileJSON fetch: a tileset can publish a new frame
  // between the two, leaving the page asking for a band the source doesn't have.
  onData = (e) => {
    if (e.sourceId !== 'wx' || !e.isSourceLoaded) return;
    map.off('sourcedata', onData);
    onData = null;
    els.load.textContent = Math.round(performance.now() - loadStart) + ' ms';

    if (isVector) {   // no bands: show when the data is from instead
      setStatus('statusReady');
      fetchDescriptionTime(cfg.id).then(d => { if (current === cfg && d) { staticTime = d; renderClock(); } }).catch(() => {});
      return;
    }
    const rl = (map.getSource('wx').rasterLayers || []).find(l => l.fields.name === cfg.layer);
    bands = (rl && rl.fields.bands) || [];
    if (!bands.length) { setStatus('statusError'); return; }

    if (cfg.kind === 'raster') {
      const range = (rl.fields.range && rl.fields.range.length === 2) ? rl.fields.range : [0, 1];
      dataRange = safeRange(range);
      map.setPaintProperty('wx', 'raster-color-range', range);   // the layer's own range, as published
      rasterReady = true;
      applyColor();
    }
    els.slider.max = bands.length - 1;
    els.slider.disabled = bands.length < 2;
    els.play.disabled = bands.length < 2;
    els.timebar.classList.toggle('is-clock', bands.length < 2);   // one frame: clock only
    setBand(0);
    setStatus('statusReady');
  };
  map.on('sourcedata', onData);
}

map.on('error', (e) => {
  if (e && e.sourceId === 'wx') setStatus('statusError');
});
map.on('zoom', () => { els.zoom.textContent = map.getZoom().toFixed(1); syncZoomSelect(); });

map.on('style.load', () => {
  styleReady = true;
  els.zoom.textContent = map.getZoom().toFixed(1);
  syncZoomSelect();
  // Every basemap opens on the chosen projection (Mercator unless the user picked another),
  // overriding the projection some styles define for themselves
  map.setProjection(chosenProjection);
  document.getElementById('projection-select').value = chosenProjection;
  originalLabels = null;
  setLabelLanguage(lang);
  loadTileset(tilesetSelect.value);
});

/* ------------------------------------------------- hover value popup -- */
let hoverBusy = false;   // one query in flight at a time
map.on('mousemove', async (e) => {
  if (current.kind !== 'raster' || !rasterReady || !map.getLayer('wx') || !bands.length || hoverBusy) return;
  hoverBusy = true;
  try {
    const band = bands[Number(els.slider.value)];
    const r = await map.queryRasterValue('wx', e.lngLat, { layerName: current.layer, bands: [band] });
    const v = r && r[current.layer] && r[current.layer][band];
    if (v && Number.isFinite(v[0])) {
      // Unitless: the tilesets' docs don't state units for every layer
      popup.setLngLat(e.lngLat).setHTML(String(+v[0].toFixed(2))).addTo(map);
    } else {
      popup.remove();
    }
  } catch (err) {
    popup.remove();
  } finally {
    hoverBusy = false;
  }
});
map.getCanvas().addEventListener('mouseleave', () => popup.remove());

/* ---------------------------------------------------------- controls -- */
tilesetSelect.addEventListener('change', (e) => selectTileset(e.target.value));

scaleSelect.addEventListener('change', (e) => { scaleName = e.target.value; applyColor(); });
document.getElementById('steps-select').addEventListener('change', (e) => { colorSteps = Number(e.target.value); applyColor(); });

document.getElementById('projection-select').addEventListener('change', (e) => { chosenProjection = e.target.value; map.setProjection(chosenProjection); });

// Zoom selector: sets an exact whole-number zoom. It follows the map back when
// the user zooms by hand and shows a dash while the zoom isn't a whole number.
const zoomSelect = document.getElementById('zoom-select');
zoomSelect.innerHTML = '<option value="" disabled hidden>&ndash;</option>' +
  Array.from({ length: 12 }, (_, z) => '<option value="' + z + '">' + z + '</option>').join('');
zoomSelect.addEventListener('change', (e) => map.setZoom(Number(e.target.value)));
function syncZoomSelect() {
  const z = map.getZoom();
  zoomSelect.value = Math.abs(z - Math.round(z)) < 0.05 && Math.round(z) <= 11 ? String(Math.round(z)) : '';
}

document.getElementById('show-particles').addEventListener('change', (e) => {
  if (map.getLayer('wx') && current.kind === 'particle') {
    map.setLayoutProperty('wx', 'visibility', e.target.checked ? 'visible' : 'none');
  }
});
document.getElementById('particle-count').addEventListener('input', (e) => {
  document.getElementById('particle-count-value').textContent = e.target.value;
  if (map.getLayer('wx') && current.kind === 'particle') map.setPaintProperty('wx', 'raster-particle-count', Number(e.target.value));
});
document.getElementById('particle-speed').addEventListener('input', (e) => {
  document.getElementById('particle-speed-value').textContent = e.target.value;
  if (map.getLayer('wx') && current.kind === 'particle') map.setPaintProperty('wx', 'raster-particle-speed-factor', Number(e.target.value));
});
document.getElementById('particle-color').addEventListener('input', (e) => {
  if (map.getLayer('wx') && current.kind === 'particle') map.setPaintProperty('wx', 'raster-particle-color', e.target.value);
});

/* -------------------------------------------------------- language -- */
function applyLang(code) {
  lang = code;
  document.documentElement.lang = code;
  try { localStorage.setItem('wc-lang', code); } catch (e) {}

  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('#lang-switch button').forEach(b =>
    b.setAttribute('aria-checked', String(b.dataset.lang === code)));
  document.title = t('title');

  renderPlay();
  renderClock();
  setStatus(statusKey);
  if (map.isStyleLoaded()) setLabelLanguage(code);
}

document.getElementById('lang-switch').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-lang]');
  if (b) applyLang(b.dataset.lang);
});

scaleSelect.value = scaleName;
applyLang(lang);
applyColor();
updateLegend();
</script>
</body>
</html>
