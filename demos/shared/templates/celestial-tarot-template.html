<!--
  Working EXAMPLE of the Celestial Tarot style pack (celestial-tarot.css, in
  this same folder). Open this file directly to see the pattern working with
  seven original tarot-style cards for a night walk through Prague on
  dark-v11 recoloured to indigo and gold. Click a face-down card in the
  spread: it flips in CSS 3D, the map flies to that place and drops a glowing
  gold star Marker, and a thin dashed gold "constellation" line joins the
  places in the order you reveal them. Hover a revealed card to pulse its
  star; "Shuffle" resets, riffles the cards and re-deals them in a new order.
  Copy the markup below into your own demo and link celestial-tarot.css from
  its <head> -- see the class/id contract documented at the top of that CSS
  file, including the hidden SVG sprite (#ct-gold, #ct-corner, #ct-star,
  #ct-back and one #sym-* symbol per card) the markup relies on.

  This is a brand-new style, not extracted from an existing demo -- built
  from a design brief (gold foil on midnight, playful tarot-style cards) at
  the user's request for something distinct from every other pack in this
  folder. The places are real Prague landmarks; "Madame Vesper's Night
  Atlas", the card numbers, titles and meanings are fictional, original
  placeholders (no published tarot deck art is reproduced) -- swap in your own.

  What's NOT included: real fortune-telling logic, search/geocoding, routing,
  popups, 3D terrain, or a hard-coded access token (demo-kit.js sets that).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Celestial Tarot</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" rel="stylesheet" />
<link href="celestial-tarot.css" rel="stylesheet" />
<script src="../demo-kit.js"></script>
<style>
  /* Demo-owned: every demo positions its own #map. */
  #map {
    position: absolute;
    inset: 0;
  }
</style>
</head>
<body>
<!-- Hidden SVG sprite: gold gradient, ornaments, card back and card symbols -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ct-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5D27A"/><stop offset=".48" stop-color="#B8862B"/><stop offset="1" stop-color="#F7E3A3"/>
    </linearGradient>
    <symbol id="ct-corner" viewBox="0 0 20 20">
      <path d="M6 0l1.4 4.6L12 6 7.4 7.4 6 12 4.6 7.4 0 6l4.6-1.4z" fill="url(#ct-gold)"/>
      <path d="M12 6h8M6 12v8" stroke="#D9B25A" stroke-width="1" fill="none"/>
    </symbol>
    <symbol id="ct-star" viewBox="0 0 24 24">
      <path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z" fill="url(#ct-gold)" stroke="#0E1033" stroke-width=".8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ct-back" viewBox="0 0 100 160">
      <g fill="none" stroke="#0E1033" stroke-width="1.4" stroke-linecap="round">
        <rect x="3" y="3" width="94" height="154" rx="6" stroke-width="1"/>
        <g transform="translate(50 80)">
          <circle r="11"/><circle r="17" stroke-dasharray="1 3.2"/><circle r="4" fill="#0E1033"/>
          <path d="M0-21V-35M0 21V35M-21 0H-35M21 0H35M15-15L23-23M-15-15L-23-23M15 15L23 23M-15 15L-23 23"/>
        </g>
        <path d="M58 20a13 13 0 1 0 0 24a10 10 0 1 1 0-24z" fill="#0E1033"/>
        <path d="M58 20a13 13 0 1 0 0 24a10 10 0 1 1 0-24z" fill="#0E1033" transform="rotate(180 50 80)"/>
        <path d="M22 80l2 5 5 2-5 2-2 5-2-5-5-2 5-2zM78 80l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#0E1033" stroke-width=".6"/>
      </g>
    </symbol>
    <symbol id="sym-clock" viewBox="0 0 64 64">
      <circle cx="32" cy="36" r="22"/><circle cx="32" cy="36" r="17" stroke-dasharray="1.2 7.7"/>
      <path d="M32 36V24M32 36l8 5"/><circle cx="32" cy="36" r="2" fill="#9E1B32" stroke="#C9344F"/>
      <path d="M32 3l1.6 3.4L37 8l-3.4 1.6L32 13l-1.6-3.4L27 8l3.4-1.6z" fill="#9E1B32" stroke="#C9344F"/>
    </symbol>
    <symbol id="sym-bridge" viewBox="0 0 64 64">
      <path d="M2 30H62M8 30a8 11 0 0 0 16 0M24 30a8 11 0 0 0 16 0M40 30a8 11 0 0 0 16 0M6 30V16h8v14M5 16l5-8 5 8"/>
      <path d="M22 30v-5M32 30v-5M42 30v-5M52 30v-5" stroke="#C9344F"/>
      <path d="M4 54q4-4 8 0t8 0t8 0t8 0t8 0t8 0t8 0"/>
    </symbol>
    <symbol id="sym-castle" viewBox="0 0 64 64">
      <path d="M8 54H56M12 54V30l5-14 5 14v24M26 54V22l6-18 6 18v32M42 54V32l5-12 5 12v22"/>
      <path d="M32 30v8M17 40v6M47 42v6" stroke="#C9344F"/>
    </symbol>
    <symbol id="sym-lane" viewBox="0 0 64 64">
      <path d="M2 54H62M4 54V36l9-9 9 9v18M22 54V32l10-10 10 10v22M42 54V36l9-9 9 9v18"/>
      <path d="M10 54v-8h6v8M29 54v-9h6v9M48 54v-8h6v8" stroke="#C9344F"/>
      <path d="M32 4l1.6 3.4L37 9l-3.4 1.6L32 14l-1.6-3.4L27 9l3.4-1.6z" fill="#9E1B32" stroke="#C9344F"/>
    </symbol>
    <symbol id="sym-tower" viewBox="0 0 64 64">
      <path d="M32 6L21 56M32 6L43 56M25 36H39M23 46H41M28 24H36M18 56H46"/>
      <path d="M25 36L41 46M39 36L23 46" stroke-width="1.2"/>
      <circle cx="32" cy="4" r="2.2" fill="#9E1B32" stroke="#C9344F"/>
    </symbol>
    <symbol id="sym-rock" viewBox="0 0 64 64">
      <path d="M2 56Q18 34 32 40T62 56Z"/><path d="M24 42V22l3-10 3 10v22M34 40V22l3-10 3 10v20"/>
      <circle cx="27" cy="9" r="1.8" fill="#9E1B32" stroke="#C9344F"/><circle cx="37" cy="9" r="1.8" fill="#9E1B32" stroke="#C9344F"/>
    </symbol>
    <symbol id="sym-dance" viewBox="0 0 64 64">
      <path d="M10 56V16h16v40"/><path d="M14 24h8M14 32h8M14 40h8M14 48h8"/>
      <path d="M32 56Q27 44 36 36Q44 28 40 14H56Q54 28 48 36Q42 44 52 56Z"/>
      <circle cx="48" cy="9" r="3" stroke="#C9344F"/>
    </symbol>
  </defs>
</svg>

<div class="app">
  <div class="stage">
    <div id="map"></div>

    <div class="title-plate gilt">
      <svg class="corner tl"><use href="#ct-corner"/></svg><svg class="corner tr"><use href="#ct-corner"/></svg>
      <svg class="corner bl"><use href="#ct-corner"/></svg><svg class="corner br"><use href="#ct-corner"/></svg>
      <h1 class="foil">The City of a Hundred Spires</h1>
      <p class="tagline">Madame Vesper's Night Atlas &middot; seven cards, one walk through Prague</p>
      <div class="progress" id="progress">0 of 7 drawn</div>
      <p class="reading" id="reading">Turn a card below to begin the reading.</p>
      <div class="status-note error hidden" id="status-note"></div>
    </div>
  </div>

  <section class="spread-wrap" aria-label="The spread">
    <div class="spread-bar">
      <span class="spread-label">The Spread</span>
      <span class="spread-hint">Turn a card to fly there</span>
      <button class="btn" id="shuffle-btn" type="button">Shuffle</button>
    </div>
    <div class="spread" id="spread"></div>
  </section>
</div>

<script>
// Original card copy for real Prague places. coord = [lng, lat].
const PLACES = [
  { id: 'lookout', num: 'I',    title: 'The Iron Lookout',       name: 'Petřín Tower',       sym: 'tower',  zoom: 15.4,
    meaning: 'Climb high, and the city becomes a map.',            coord: [14.39530, 50.08350] },
  { id: 'crown',   num: 'III',  title: 'The Hilltop Crown',      name: 'Prague Castle',      sym: 'castle', zoom: 15.6,
    meaning: 'A thousand years of roofs answer to this hill.',     coord: [14.39990, 50.09060] },
  { id: 'lane',    num: 'IV',   title: "The Alchemist's Lane",   name: 'Golden Lane',        sym: 'lane',   zoom: 16.6,
    meaning: 'Tiny doors, big tales: gold is made of patience.',   coord: [14.40363, 50.09064] },
  { id: 'bridge',  num: 'VI',   title: "The Lovers' Crossing",   name: 'Charles Bridge',     sym: 'bridge', zoom: 16,
    meaning: 'Cross slowly; the statues keep every secret.',       coord: [14.41120, 50.08650] },
  { id: 'dance',   num: 'VII',  title: 'The Dancing Pair',       name: 'Dancing House',      sym: 'dance',  zoom: 16.4,
    meaning: 'Even glass and concrete can learn to waltz.',        coord: [14.41410, 50.07552] },
  { id: 'rock',    num: 'IX',   title: 'The Rock of Legends',    name: 'Vyšehrad',           sym: 'rock',   zoom: 15.6,
    meaning: 'Legends settle where the river bends.',              coord: [14.41890, 50.06450] },
  { id: 'clock',   num: 'XII',  title: 'The Astronomical Clock', name: 'Astronomical Clock', sym: 'clock',  zoom: 16.8,
    meaning: 'Time bows to those who stop and look up.',           coord: [14.42059, 50.08700] },
];

const $ = (id) => document.getElementById(id);
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isPhone = () => window.matchMedia('(max-width: 640px)').matches;
// Padding keeps the camera clear of the title plate and the logo/attribution corners.
const pad = () => (isPhone()
  ? { top: 92, bottom: 66, left: 24, right: 24 }
  : { top: 56, bottom: 72, left: 360, right: 56 });

const bounds = PLACES.reduce((b, p) => b.extend(p.coord), new mapboxgl.LngLatBounds(PLACES[0].coord, PLACES[0].coord));

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/dark-v11',
  bounds,
  fitBoundsOptions: { padding: pad(), maxZoom: 14 },
  attributionControl: true,
});

let revealed = [];          // places in reveal order
const markers = {};         // id -> { marker, el }
let busy = false;

/* ---- Cards ---- */
const CORNERS = ['tl', 'tr', 'bl', 'br'].map((c) => `<svg class="corner ${c}"><use href="#ct-corner"/></svg>`).join('');

function shuffled(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function deal() {
  const spread = $('spread');
  spread.innerHTML = '';
  shuffled(PLACES).forEach((p, i) => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card deal';
    card.dataset.id = p.id;
    card.style.cssText = `--i:${i};--rot:${(i - 3) * 4}deg;--dy:${(i - 3) ** 2 * 2.5}px`;
    card.setAttribute('aria-label', `Face-down card ${i + 1} of 7. Turn it over.`);
    card.innerHTML =
      `<span class="card-inner">` +
        `<span class="face face-back gilt" aria-hidden="true">${CORNERS}` +
          `<svg class="back-art" viewBox="0 0 100 160"><use href="#ct-back"/></svg></span>` +
        `<span class="face face-front gilt" aria-hidden="true">${CORNERS}` +
          `<span class="card-num">${p.num}</span>` +
          `<svg class="card-symbol" viewBox="0 0 64 64"><use href="#sym-${p.sym}"/></svg>` +
          `<span class="card-title">${p.title}</span>` +
          `<span class="card-meaning">${p.meaning}</span></span>` +
      `</span>`;
    spread.appendChild(card);
  });
  spread.scrollLeft = 0;
  busy = false;
  $('shuffle-btn').disabled = false;
}

function reveal(card) {
  const p = PLACES.find((x) => x.id === card.dataset.id);
  if (!card.classList.contains('flipped')) {
    card.classList.add('flipped');
    card.setAttribute('aria-label', `${p.num}, ${p.title}. ${p.meaning}`);
    card.querySelector('.face-front').removeAttribute('aria-hidden');
    revealed.push(p);
    addStar(p);
    syncMap();
    updatePlate(p);
  }
  const opts = { center: p.coord, zoom: p.zoom - 1.6, padding: pad(), pitch: 30, bearing: 0 };
  if (reduce) map.jumpTo(opts); else map.flyTo({ ...opts, duration: 2400 });
}

function updatePlate(last) {
  $('progress').textContent = `${revealed.length} of 7 drawn`;
  const reading = $('reading');
  if (!last) { reading.textContent = 'Turn a card below to begin the reading.'; return; }
  reading.innerHTML = '';
  const t = document.createElement('span');
  t.className = 'reading-title';
  t.textContent = `${last.num} · ${last.title}`;
  reading.append(t, revealed.length === 7 ? `${last.meaning} The whole sky is drawn.` : last.meaning);
}

/* ---- Star markers: the Marker root is untouched, only the inner child is styled ---- */
function addStar(p) {
  const root = document.createElement('div');
  root.innerHTML = '<div class="star-marker"><span class="star-glow"></span><svg viewBox="0 0 24 24"><use href="#ct-star"/></svg></div>';
  const el = root.firstElementChild;
  el.addEventListener('animationend', (e) => { if (e.animationName === 'ct-pulse') el.classList.remove('pulse'); });
  const marker = new mapboxgl.Marker({ element: root }).setLngLat(p.coord).addTo(map);
  markers[p.id] = { marker, el };
}

function pulse(id) {
  const m = markers[id];
  if (!m) return;
  m.el.classList.remove('pulse');
  void m.el.offsetWidth; // restart the animation
  m.el.classList.add('pulse');
}

$('spread').addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (card && !busy) reveal(card);
});
$('spread').addEventListener('mouseover', (e) => {
  const card = e.target.closest('.card.flipped');
  if (card && !card.contains(e.relatedTarget)) pulse(card.dataset.id);
});
$('spread').addEventListener('focusin', (e) => {
  const card = e.target.closest('.card.flipped');
  if (card) pulse(card.dataset.id);
});

/* ---- Shuffle: unflip, gather and riffle, re-deal in a new order ---- */
$('shuffle-btn').addEventListener('click', () => {
  if (busy) return;
  busy = true;
  $('shuffle-btn').disabled = true;
  revealed = [];
  Object.values(markers).forEach((m) => m.marker.remove());
  Object.keys(markers).forEach((k) => delete markers[k]);
  syncMap();
  updatePlate(null);
  home();

  const spread = $('spread');
  if (reduce) { deal(); return; }
  spread.querySelectorAll('.card').forEach((c, i) => {
    c.classList.remove('flipped', 'deal');
    c.style.setProperty('--shift', `${(3 - i) * (c.offsetWidth + 10)}px`);
    c.style.setProperty('--jit', `${14 + Math.random() * 18}px`);
    c.style.setProperty('--jr', `${(Math.random() * 8 + 3).toFixed(1)}deg`);
  });
  spread.classList.add('shuffling');
  setTimeout(() => { spread.classList.remove('shuffling'); deal(); }, 1050);
});

function home() {
  const opts = { padding: pad(), maxZoom: 14, pitch: 0, bearing: 0 };
  if (reduce) map.fitBounds(bounds, { ...opts, duration: 0 }); else map.fitBounds(bounds, { ...opts, duration: 1600 });
}

/* ---- Map: indigo and gold recolour, unrevealed points, constellation ---- */
function tint() {
  // Guarded per layer: a classic style's layer shape may differ from what we expect.
  map.getStyle().layers.forEach((l) => {
    const id = l.id;
    try {
      if (l.type === 'background') {
        map.setPaintProperty(id, 'background-color', '#14173F');
      } else if (l.type === 'fill') {
        const c = /water/.test(id) ? '#0A0C2A' : /building/.test(id) ? '#232873' : '#171B4C';
        map.setPaintProperty(id, 'fill-color', c);
      } else if (l.type === 'fill-extrusion') {
        map.setPaintProperty(id, 'fill-extrusion-color', '#262C7A');
      } else if (l.type === 'line') {
        if (/water/.test(id)) map.setPaintProperty(id, 'line-color', '#0A0C2A');
        else if (/admin/.test(id)) map.setPaintProperty(id, 'line-color', '#8F7A3D');
        else if (/road|bridge|tunnel|street|path|ferry|turn/.test(id)) {
          if (/case/.test(id)) map.setPaintProperty(id, 'line-opacity', 0);
          else {
            map.setPaintProperty(id, 'line-color', '#D9B25A');
            map.setPaintProperty(id, 'line-opacity', 0.34);
          }
        }
      } else if (l.type === 'symbol') {
        map.setPaintProperty(id, 'text-color', '#DDE3F0');
        map.setPaintProperty(id, 'text-halo-color', '#0E1033');
      }
    } catch (err) { /* layer shape differs; skip */ }
  });
}

const features = () => PLACES.map((p) => ({
  type: 'Feature',
  properties: { id: p.id, name: p.name, revealed: revealed.includes(p) ? 1 : 0 },
  geometry: { type: 'Point', coordinates: p.coord },
}));

function syncMap() {
  const places = map.getSource('places');
  if (places) places.setData({ type: 'FeatureCollection', features: features() });
  const line = map.getSource('constellation');
  if (line) {
    line.setData(revealed.length > 1
      ? { type: 'Feature', geometry: { type: 'LineString', coordinates: revealed.map((p) => p.coord) } }
      : { type: 'FeatureCollection', features: [] });
  }
}

map.on('style.load', () => {
  tint();
  map.addSource('places', { type: 'geojson', data: { type: 'FeatureCollection', features: features() } });
  map.addSource('constellation', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

  // Constellation: soft glow underneath, thin dashed gold line on top.
  map.addLayer({ id: 'constellation-glow', type: 'line', source: 'constellation', slot: 'top',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#F5D27A', 'line-width': 7, 'line-opacity': 0.2, 'line-blur': 4 } });
  map.addLayer({ id: 'constellation-line', type: 'line', source: 'constellation', slot: 'top',
    layout: { 'line-join': 'round' },
    paint: { 'line-color': '#F5D27A', 'line-width': 2, 'line-dasharray': [2, 2] } });

  // Not-yet-drawn places: pale rings so the player can see where the cards lead.
  map.addLayer({ id: 'places-dim', type: 'circle', source: 'places', slot: 'top',
    filter: ['==', ['get', 'revealed'], 0],
    paint: { 'circle-radius': 7.5, 'circle-color': '#1B1F5E', 'circle-stroke-color': '#DDE3F0', 'circle-stroke-width': 2 } });
  map.addLayer({ id: 'places-label', type: 'symbol', source: 'places', slot: 'top',
    filter: ['==', ['get', 'revealed'], 1],
    layout: {
      'text-field': ['get', 'name'],
      'text-font': ['DIN Pro Medium', 'Arial Unicode MS Regular'],
      'text-size': 13,
      'text-variable-anchor': ['top', 'bottom', 'left', 'right'],
      'text-radial-offset': 1.9,
      'text-max-width': 8,
    },
    paint: { 'text-color': '#F7E3A3', 'text-halo-color': '#0E1033', 'text-halo-width': 1.8 } });
  syncMap();
  startDash();
});

// Gentle marching-dash animation for the constellation (static under reduced motion).
const DASHES = [[0, 4, 3], [0.5, 4, 2.5], [1, 4, 2], [1.5, 4, 1.5], [2, 4, 1], [2.5, 4, 0.5], [3, 4, 0],
  [0, 0.5, 3, 3.5], [0, 1, 3, 3], [0, 1.5, 3, 2.5], [0, 2, 3, 2], [0, 2.5, 3, 1.5], [0, 3, 3, 1], [0, 3.5, 3, 0.5]];
function startDash() {
  if (reduce) return;
  let step = 0, last = 0;
  const tick = (t) => {
    if (t - last > 90 && revealed.length > 1 && map.getLayer('constellation-line')) {
      step = (step + 1) % DASHES.length;
      map.setPaintProperty('constellation-line', 'line-dasharray', DASHES[step]);
      last = t;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

map.on('error', (e) => {
  const n = $('status-note');
  n.textContent = 'Map error: ' + ((e.error && e.error.message) || 'unknown');
  n.classList.remove('hidden');
});

deal();
</script>
</body>
</html>
