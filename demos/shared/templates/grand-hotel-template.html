<!--
  Working EXAMPLE of the Grand Hotel style pack (grand-hotel.css, in this
  same folder). Open this file directly to see the pattern working with
  seven illustrative places in Karlovy Vary, Czechia, then copy the markup
  below into your own demo and link grand-hotel.css from its <head> -- see
  the class/id contract documented at the top of that CSS file for what to
  build.

  This is a brand-new style, not extracted from an existing demo. The hotel
  name ("Hotel Marzipan"), room numbers and card copy are illustrative
  placeholders -- swap in your own.

  What's NOT included: any real data source, search, routing or booking
  logic. The facade windows are generated by script purely to keep the
  elevation exactly mirrored; the "ding" is visual only (no audio).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hotel Marzipan - Karlovy Vary</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" rel="stylesheet" />
<link href="grand-hotel.css" rel="stylesheet" />
<script src="../demo-kit.js"></script>
<style>
  /* Demo-owned: #map fills the proscenium's inner window. */
  #map { position: absolute; inset: 0; }
</style>
</head>
<body>

<header class="facade">
  <div class="facade-title">
    <h1>Hotel Marzipan</h1>
    <div class="facade-sub">Karlovy Vary &middot; Spa &amp; Confectionery</div>
  </div>
  <!-- Elevation drawn about the centre axis x=400; windows are added by script -->
  <svg viewBox="0 0 800 200" role="img" aria-label="Pastel hotel facade with a funicular on the left and a tower on the right">
    <!-- wings -->
    <rect x="52" y="116" width="248" height="76" fill="#F2B5C2"/>
    <rect x="500" y="116" width="248" height="76" fill="#F2B5C2"/>
    <rect x="52" y="116" width="248" height="8" fill="#B07BA1"/>
    <rect x="500" y="116" width="248" height="8" fill="#B07BA1"/>
    <rect x="52" y="152" width="248" height="5" fill="#D9C6E8"/>
    <rect x="500" y="152" width="248" height="5" fill="#D9C6E8"/>
    <rect x="52" y="124" width="248" height="2" fill="#C8A15A"/>
    <rect x="500" y="124" width="248" height="2" fill="#C8A15A"/>
    <!-- centre block + pediment -->
    <rect x="310" y="90" width="180" height="102" fill="#D9C6E8"/>
    <rect x="310" y="90" width="12" height="102" fill="#F2B5C2"/>
    <rect x="478" y="90" width="12" height="102" fill="#F2B5C2"/>
    <polygon points="300,90 400,64 500,90" fill="#B07BA1"/>
    <polygon points="318,88 400,70 482,88" fill="none" stroke="#C8A15A" stroke-width="2.5"/>
    <!-- entrance: canopy, arch, steps -->
    <polygon points="372,150 428,150 436,158 364,158" fill="#A6192E"/>
    <rect x="364" y="157" width="72" height="3" fill="#C8A15A"/>
    <path d="M380 192 V176 A20 20 0 0 1 420 176 V192 Z" fill="#7F1223" stroke="#C8A15A" stroke-width="2.5"/>
    <line x1="400" y1="157" x2="400" y2="192" stroke="#C8A15A" stroke-width="1.5"/>
    <rect x="368" y="188" width="64" height="4" fill="#FFF4EA"/>
    <!-- funicular (left flank): track, car, cable -->
    <line x1="6" y1="192" x2="46" y2="104" stroke="#6E4A66" stroke-width="3"/>
    <line x1="14" y1="192" x2="54" y2="104" stroke="#6E4A66" stroke-width="3"/>
    <g transform="rotate(-24 30 140)">
      <rect x="14" y="128" width="32" height="20" rx="3" fill="#A6192E" stroke="#C8A15A" stroke-width="1.5"/>
      <rect x="18" y="132" width="7" height="8" fill="#FFF4EA"/>
      <rect x="28" y="132" width="7" height="8" fill="#FFF4EA"/>
    </g>
    <!-- tower (right flank) -->
    <rect x="754" y="96" width="32" height="96" fill="#D9C6E8"/>
    <rect x="754" y="96" width="32" height="6" fill="#B07BA1"/>
    <polygon points="750,96 770,64 790,96" fill="#A6192E"/>
    <circle cx="770" cy="60" r="3.5" fill="#C8A15A"/>
    <circle cx="770" cy="114" r="6" fill="#FFF4EA" stroke="#C8A15A" stroke-width="1.5"/>
    <!-- ground -->
    <rect x="0" y="192" width="800" height="8" fill="#B07BA1"/>
    <rect x="0" y="192" width="800" height="2" fill="#C8A15A"/>
    <g id="windows"></g>
  </svg>
</header>

<main class="stage">
  <section class="proscenium" aria-label="Map of Karlovy Vary">
    <div class="proscenium-window"><div id="map"></div></div>
  </section>

  <div class="concierge">
    <div class="switch-row">
      <span id="turn-label">Turn-down</span>
      <button class="switch" id="turn-down" role="switch" aria-checked="false" aria-labelledby="turn-label"></button>
    </div>
    <div class="status-note loading" id="status-note" aria-live="polite">
      <span class="status-icon" id="status-icon">&#9788;</span>
      <span id="status-text">Preparing the rooms&hellip;</span>
    </div>
    <div><button type="button" class="btn btn-secondary" id="overview">All keys</button></div>
  </div>

  <div class="col col-left">
    <h2 class="col-head">Departures<div class="col-sub">Spa &amp; sights</div></h2>
    <!-- cards are built by script -->
  </div>
  <div class="col col-right">
    <h2 class="col-head">Excursions<div class="col-sub">Further trips</div></h2>
  </div>
</main>

<script>
// Places: side L = Departures, R = Excursions. "win" picks the facade window
// that lights up (offset from the centre axis, row 0/1). "off" nudges bunched
// key tags apart (pixels) at the overview zoom.
const PLACES = [
  { side: 'L', room: 11, name: 'Mill Colonnade', note: 'Long neo-Renaissance arcade over the spring taps.', coord: [12.8819, 50.2253], win: [130, 0], off: [0, 0] },
  { side: 'L', room: 12, name: 'Hot Spring Colonnade', note: 'Glass hall around the geyser-like Vřídlo spring.', coord: [12.8832, 50.2226], win: [230, 0], off: [-4, 14] },
  { side: 'L', room: 13, name: 'Market Colonnade', note: 'Carved timber pavilion with a gentle drinking spring.', coord: [12.8832, 50.2235], win: [180, 1], off: [-30, -16] },
  { side: 'L', room: 14, name: 'Park Colonnade', note: 'Cast-iron promenade tucked among the garden trees.', coord: [12.8789, 50.2274], win: [280, 1], off: [0, 0] },
  { side: 'R', room: 21, name: 'Diana Observation Tower', note: 'Hilltop lookout, reached by the funicular.', coord: [12.8722, 50.2190], win: [130, 0], off: [0, 0] },
  { side: 'R', room: 22, name: 'Karlovy Vary Municipal Theatre', note: 'Ornate stage house on the riverbank.', coord: [12.8817, 50.2210], win: [230, 0], off: [-10, 10] },
  { side: 'R', room: 23, name: 'Church of St Mary Magdalene', note: 'Baroque twin-towered church above the spa quarter.', coord: [12.8843, 50.2227], win: [180, 1], off: [34, 0] },
];

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);

/* ---------- Facade windows, mirrored about x = 400 ---------- */
const winLayer = $('windows');
const winFor = {};          // 'side|offset|row' -> rect
function addWindow(x, y, key) {
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('class', 'win');
  r.setAttribute('x', x); r.setAttribute('y', y);
  r.setAttribute('width', 16); r.setAttribute('height', 18);
  r.setAttribute('rx', 3);
  winLayer.appendChild(r);
  const bar = document.createElementNS(NS, 'line');
  bar.setAttribute('class', 'win-bar');
  bar.setAttribute('x1', x + 8); bar.setAttribute('x2', x + 8);
  bar.setAttribute('y1', y); bar.setAttribute('y2', y + 18);
  winLayer.appendChild(bar);
  if (key) winFor[key] = r;
}
const WING_ROWS = [130, 158];
[130, 180, 230, 280, 330].forEach((off) => {
  WING_ROWS.forEach((y, row) => {
    addWindow(400 - off - 8, y, 'L|' + off + '|' + row);
    addWindow(400 + off - 8, y, 'R|' + off + '|' + row);
  });
});
[-40, 0, 40].forEach((dx) => { [100, 124].forEach((y) => addWindow(392 + dx, y)); });
PLACES.forEach((p) => { p.winEl = winFor[p.side + '|' + p.win[0] + '|' + p.win[1]]; });

/* ---------- Map ---------- */
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  center: [12.879, 50.223],
  zoom: 14,
  config: {
    basemap: {
      lightPreset: 'dawn',
      theme: 'faded',
      showPointOfInterestLabels: false,
      colorWater: '#BFD9EA',
      colorLand: '#F7ECE6',
      colorGreenspace: '#CFE3C8',
      colorBuildings: '#EBC3CE',
      colorRoads: '#FFF9F2',
      colorMotorways: '#F5DDB0',
    },
  },
});
map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');

const BOUNDS = new mapboxgl.LngLatBounds();
PLACES.forEach((p) => BOUNDS.extend(p.coord));
function framePadding() {
  const small = window.innerWidth < 760;
  return small
    ? { top: 44, bottom: 70, left: 54, right: 54 }
    : { top: 56, bottom: 70, left: 60, right: 60 };
}
function showOverview(instant) {
  userMoved = false;
  const opts = { padding: framePadding(), maxZoom: 15.5, pitch: 0, bearing: 0 };
  if (instant || reduceMotion.matches) map.fitBounds(BOUNDS, { ...opts, duration: 0 });
  else map.fitBounds(BOUNDS, { ...opts, duration: 1400 });
  clearSelection();
}
// Keep the canvas in step with its container (fonts/layout settle after first paint)
let userMoved = false;
const refit = () => { map.resize(); if (!userMoved) map.fitBounds(BOUNDS, { padding: framePadding(), maxZoom: 15.5, duration: 0 }); };
map.once('style.load', refit);
map.once('load', refit);
if (window.ResizeObserver) new ResizeObserver(() => refit()).observe($('map'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);

/* ---------- Cards + key tags ---------- */
const BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21a2 2 0 0 0 4 0"/><path d="M12 3v2"/></svg>';
const cols = { L: document.querySelector('.col-left'), R: document.querySelector('.col-right') };
const rowOf = { L: 2, R: 2 };
let selected = -1;
let dingTimer = 0;

PLACES.forEach((p, i) => {
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'room-card';
  card.style.setProperty('--r', rowOf[p.side]++);
  card.setAttribute('aria-pressed', 'false');
  card.innerHTML = '<span class="tag">' + p.room + '</span>' +
    '<span class="card-text"><span class="card-name"></span><span class="card-note"></span></span>' +
    '<span class="ding">' + BELL + '</span>';
  card.querySelector('.card-name').textContent = p.name;
  card.querySelector('.card-note').textContent = p.note;
  card.addEventListener('click', () => select(i));
  cols[p.side].appendChild(card);
  p.card = card;

  // Marker: root element is left untouched; the inner child is styled.
  const root = document.createElement('div');
  root.className = 'key-marker';
  const tag = document.createElement('button');
  tag.type = 'button';
  tag.className = 'key-tag';
  tag.textContent = p.room;
  tag.setAttribute('aria-label', 'Room ' + p.room + ': ' + p.name);
  tag.addEventListener('click', () => select(i));
  root.appendChild(tag);
  p.tag = tag;
  new mapboxgl.Marker({ element: root, offset: p.off.map((v) => v * (window.innerWidth < 760 ? 0.7 : 1)) }).setLngLat(p.coord).addTo(map);
});

/* ---------- Selection ---------- */
function setStatus(kind, icon, text) {
  const n = $('status-note');
  n.classList.remove('loading', 'success', 'error');
  if (kind) n.classList.add(kind);
  $('status-icon').textContent = icon;
  $('status-text').textContent = text;
}

function clearSelection() {
  selected = -1;
  PLACES.forEach((p) => {
    p.card.classList.remove('active', 'dinging');
    p.card.setAttribute('aria-pressed', 'false');
    p.tag.classList.remove('active');
    p.winEl.classList.remove('lit');
  });
  setStatus('', '★', 'All keys at the front desk.');
}

function select(i) {
  const p = PLACES[i];
  PLACES.forEach((q, j) => {
    const on = j === i;
    q.card.classList.toggle('active', on);
    q.card.setAttribute('aria-pressed', String(on));
    q.tag.classList.toggle('active', on);
    q.winEl.classList.toggle('lit', on);
  });
  selected = i;
  userMoved = true;

  // one-shot bell (CSS disables it for reduced motion)
  p.card.classList.remove('dinging');
  void p.card.offsetWidth;
  p.card.classList.add('dinging');
  clearTimeout(dingTimer);
  dingTimer = setTimeout(() => p.card.classList.remove('dinging'), 1000);

  setStatus('success', '✓', 'Room ' + p.room + ' — ' + p.name);
  const cam = { center: p.coord, zoom: 16, pitch: 40, padding: { top: 40, bottom: 70, left: 30, right: 30 } };
  if (reduceMotion.matches) map.jumpTo(cam);
  else map.flyTo({ ...cam, duration: 1800, essential: false });
}

/* ---------- Turn-down: dawn <-> night, all windows lit ---------- */
let night = false;
let styleReady = false;
map.on('style.load', () => { styleReady = true; applyPreset(); });
function applyPreset() {
  if (!styleReady) return;
  try { map.setConfigProperty('basemap', 'lightPreset', night ? 'night' : 'dawn'); } catch (e) { /* ignore */ }
}
$('turn-down').addEventListener('click', (e) => {
  night = !night;
  e.currentTarget.setAttribute('aria-checked', String(night));
  document.body.classList.toggle('is-night', night);
  applyPreset();
  setStatus('success', night ? '☾' : '☀', night ? 'Turn-down service: the lamps are lit.' : 'Good morning from the front desk.');
});

$('overview').addEventListener('click', () => showOverview(false));
setStatus('', '★', 'Choose a key to visit.');
</script>
</body>
</html>
