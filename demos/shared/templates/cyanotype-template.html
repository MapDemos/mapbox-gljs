<!--
  Working EXAMPLE of the Cyanotype style pack (cyanotype.css, in this same
  folder). Open this file directly to see the pattern working with a real
  coastal walk on the Lizard peninsula, Cornwall: the South West Coast Path
  from Mullion Cove to Lizard Point and on to Cadgwith, as a contact sheet of
  prints. The map (classic light-v11, recoloured into a cyanotype with
  guarded setPaintProperty calls) is the big print; five small square prints
  with white photogram silhouettes are the five coastal stations. Press
  the page opens fully developed; "Re-expose" replays the development from pale to full Prussian blue
  over about three seconds, then the path is drawn in as a white dashed line.
  Click a small print (or a station on the map) to fly there and read its
  caption. Reduced motion: instant final state, jumpTo.
  Copy the markup below into your own demo and link cyanotype.css from its
  <head> -- see the class/id contract documented at the top of that CSS file.

  This is a brand-new style, not extracted from an existing demo -- built
  from a design brief (19th-century sun prints: Prussian blue, white
  photograms, brushed emulsion edge, pencilled captions) at the user's
  request for something distinct from every other pack in this folder. The
  path geometry comes from the Mapbox Directions API (walking profile),
  simplified; stations are real public places, the captions are illustrative
  placeholders -- swap in your own.

  What's NOT included: search/geocoding, live routing, popups, or a
  hard-coded access token (demo-kit.js sets that).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sun Prints of the Lizard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Petrona:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" rel="stylesheet" />
<link href="cyanotype.css" rel="stylesheet" />
<script src="../demo-kit.js"></script>
<style>
  /* Demo-owned: every demo positions its own #map (inside the print well). */
  #map {
    position: absolute;
    inset: 0;
  }
</style>
</head>
<body>
<!-- Brushed emulsion edge: displaces the frame's blue layer (.print-frame::before). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="cy-brush" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.05" numOctaves="3" seed="4" result="n" />
    <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

<main class="sheet">
  <header class="sheet-head">
    <h1 class="sheet-title">Sun Prints of the Lizard</h1>
    <p class="sheet-sub">Contact sheet &middot; South West Coast Path, Mullion Cove to Cadgwith</p>
  </header>

  <section class="print-main" aria-label="Map print">
    <div class="print-frame">
      <div class="print-well"><div id="map"></div></div>
    </div>
    <p class="print-legend" id="legend">Fig. 1 &mdash; the developed print: Mullion Cove to Cadgwith.</p>
  </section>

  <aside class="side">
    <div class="controls">
      <button class="btn btn-primary" id="expose" type="button">Re-expose</button>
      <button class="btn btn-secondary" id="overview" type="button">Overview</button>
    </div>
    <div class="meter">
      <span class="meter-label" id="meter-label">Exposure 0%</span>
      <div class="meter-bar"><div class="meter-fill" id="meter-fill"></div></div>
    </div>
    <ul class="contact" id="contact" aria-label="Five stations"></ul>
    <article class="caption-card" aria-live="polite">
      <p class="cap-no" id="cap-no"></p>
      <h2 class="cap-title" id="cap-title"></h2>
      <p class="cap-place" id="cap-place"></p>
      <p class="cap-text" id="cap-text"></p>
    </article>
    <p class="status-note loading" id="status-note">Sensitising the plate</p>
  </aside>
</main>

const INTRO = {
  no: 'Contact sheet',
  title: 'Five prints, one walk',
  place: 'Mullion Cove → Lizard Point → Cadgwith, about 16 km',
  text: 'Press “Re-expose” to watch the map develop from the pale plate, then choose a small print to visit its station on the coast path.',
};

/* ---- Cyanotype palette: [pale (unexposed), full (developed)] ---- */
const C = {
  land:   ['#D6E3F3', '#1D3F73'],
  green:  ['#C9DAEE', '#244A82'],
  built:  ['#C3D6EC', '#2A5388'],
  road:   ['#BCD0EA', '#3C6296'],
  water:  ['#A6C0E2', '#12294D'],
  line:   ['#5E86B8', '#F1F5FA'],
  text:   ['#3A5F96', '#F1F5FA'],
  halo:   ['#E4ECF7', '#12294D'],
  admin:  ['#8FB3DD', '#8FB3DD'],
};

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (id) => document.getElementById(id);
const phone = () => window.matchMedia('(max-width: 720px)').matches;

const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function mix(pair, t) {
  const a = hex(pair[0]), b = hex(pair[1]);
  return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',') + ')';
}

let exposure = 0;        // 0 = pale plate, 1 = fully developed
let routeShown = 0;      // 0..1 portion of the path drawn
let current = -1;        // selected station, -1 = overview
let rules = [];          // [layerId, (t) => [[kind, prop, value]...]]
let raf = 0;

const bounds = ROUTE.reduce((b, c) => b.extend(c), new mapboxgl.LngLatBounds(ROUTE[0], ROUTE[0]));
const fitPad = () => phone() ? { top: 40, bottom: 72, left: 64, right: 64 } : { top: 28, bottom: 64, left: 48, right: 48 };

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/light-v11',
  bounds,
  fitBoundsOptions: { padding: fitPad() },
  attributionControl: true,
});
map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');
new ResizeObserver(() => map.resize()).observe($('map'));

/* ---- Recolour the basemap (all calls guarded) ---- */
function buildRules() {
  rules = [];
  for (const l of map.getStyle().layers) {
    const id = l.id;
    const water = /water/.test(id);
    if (l.type === 'background') {
      rules.push([id, (t) => [['paint', 'background-color', mix(C.land, t)]]]);
    } else if (l.type === 'fill') {
      const pair = water ? C.water : /building/.test(id) ? C.built : /park|landuse|landcover|wood|grass|scrub|national/.test(id) ? C.green : /road|bridge|tunnel|aeroway|pedestrian|path/.test(id) ? C.road : C.land;
      rules.push([id, (t) => [['paint', 'fill-color', mix(pair, t)], ['paint', 'fill-outline-color', mix(pair, t)]]]);
    } else if (l.type === 'fill-extrusion') {
      rules.push([id, (t) => [['paint', 'fill-extrusion-color', mix(C.built, t)]]]);
    } else if (l.type === 'hillshade') {
      rules.push([id, () => [['layout', 'visibility', 'none']]]);
    } else if (l.type === 'line') {
      if (/admin|boundary/.test(id)) {
        rules.push([id, () => [['paint', 'line-color', C.admin[1]], ['paint', 'line-opacity', 0.5]]]);
      } else if (water) {
        rules.push([id, (t) => [['paint', 'line-color', mix(C.water, t)]]]);
      } else if (/case/.test(id)) {
        rules.push([id, () => [['paint', 'line-opacity', 0]]]);
      } else {
        // Thin white roads and paths.
        rules.push([id, (t) => [
          ['paint', 'line-color', mix(C.line, t)],
          ['paint', 'line-opacity', 0.35 + 0.35 * t],
          ['paint', 'line-width', ['interpolate', ['linear'], ['zoom'], 8, 0.3, 13, 0.7, 17, 1.8]],
        ]]);
      }
    } else if (l.type === 'symbol') {
      if (/poi|transit|airport|natural-point|settlement-subdivision|state|country|continent/.test(id)) {
        rules.push([id, () => [['layout', 'visibility', 'none']]]);
      } else {
        rules.push([id, (t) => [
          ['paint', 'text-color', mix(C.text, t)],
          ['paint', 'text-halo-color', mix(C.halo, t)],
          ['paint', 'text-halo-width', 1.3],
          ['paint', 'icon-opacity', 0.0],
        ]]);
      }
    }
  }
}

const lastVal = new Map();   // skip setPaintProperty calls whose value did not change
function applyRule(id, items) {
  if (!map.getLayer(id)) return;
  for (const [kind, prop, val] of items) {
    const key = id + '|' + prop, sv = JSON.stringify(val);
    if (lastVal.get(key) === sv) continue;
    lastVal.set(key, sv);
    try {
      if (kind === 'layout') map.setLayoutProperty(id, prop, val);
      else map.setPaintProperty(id, prop, val);
    } catch (e) { /* property not valid for this layer: skip */ }
  }
}

function setExposure(t) {
  exposure = t;
  for (const [id, fn] of rules) applyRule(id, fn(t));
  // Own layers.
  if (map.getLayer('station-label')) {
    map.setPaintProperty('station-label', 'text-color', mix(C.text, t));
    map.setPaintProperty('station-label', 'text-halo-color', mix(C.halo, t));
  }
  if (map.getLayer('station-dot')) map.setPaintProperty('station-dot', 'circle-stroke-color', mix(['#3A5F96', '#1D3F73'], t));
  const pct = Math.round(t * 100);
  $('meter-fill').style.width = pct + '%';
  $('meter-label').textContent = 'Exposure ' + pct + '%';
}

function setRoute(p) {
  routeShown = p;
  const src = map.getSource('route');
  if (!src) return;
  const f = p * (ROUTE.length - 1);
  const n = Math.floor(f);
  const coords = ROUTE.slice(0, n + 1);
  if (n < ROUTE.length - 1) {
    const a = ROUTE[n], b = ROUTE[n + 1], k = f - n;
    coords.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]);
  }
  src.setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords.length > 1 ? coords : [ROUTE[0], ROUTE[0]] } });
}

/* ---- Expose animation: develop over ~3 s, then draw the path ---- */
const ease = (x) => x * x * (3 - 2 * x);
function expose() {
  cancelAnimationFrame(raf);
  $('expose').disabled = true;
  if (reduce) {
    setExposure(1); setRoute(1);
    finishExpose();
    return;
  }
  setRoute(0);
  const DEV = 3000, DRAW = 2600, t0 = performance.now();
  const start = 0;   // replay the development from the pale plate
  (function step(now) {
    const e = now - t0;
    if (e < DEV) {
      setExposure(start + (1 - start) * ease(e / DEV));
    } else {
      setExposure(1);
      setRoute(ease(Math.min(1, (e - DEV) / DRAW)));
    }
    if (e < DEV + DRAW) raf = requestAnimationFrame(step);
    else { setRoute(1); finishExpose(); }
  })(t0);
  $('legend').textContent = 'Developing in the sun…';
}

function finishExpose() {
  $('expose').disabled = false;
  $('expose').textContent = 'Re-expose';
  $('legend').textContent = current < 0 ? 'Fig. 1 — the developed print: Mullion Cove to Cadgwith.' : legendFor(current);
}

const legendFor = (i) => 'Fig. ' + (i + 2) + ' — ' + STATIONS[i].name + ', ' + STATIONS[i].place.toLowerCase() + '.';

/* ---- Stations ---- */
function select(i, noMove) {
  current = i;
  const s = i < 0 ? null : STATIONS[i];
  $('cap-no').textContent = s ? 'Print ' + s.no + ' of V' : INTRO.no;
  $('cap-title').textContent = s ? s.name : INTRO.title;
  $('cap-place').textContent = s ? s.place : INTRO.place;
  $('cap-text').textContent = s ? s.text : INTRO.text;
  document.querySelectorAll('.tile').forEach((t, k) => {
    t.classList.toggle('active', k === i);
    if (k === i) t.setAttribute('aria-current', 'true'); else t.removeAttribute('aria-current');
  });
  if (map.getLayer('station-active')) map.setFilter('station-active', ['==', ['get', 'i'], i]);
  if (!$('expose').disabled || reduce) $('legend').textContent = s ? legendFor(i) : (exposure >= 1 ? 'Fig. 1 — the developed print: Mullion Cove to Cadgwith.' : 'Fig. 0 — the unexposed plate.');
  if (noMove) return;
  const pad = phone() ? { top: 30, bottom: 80, left: 30, right: 30 } : { top: 40, bottom: 80, left: 40, right: 40 };
  if (s) {
    const o = { center: s.coord, zoom: 14.2, padding: pad };
    if (reduce) map.jumpTo(o); else map.flyTo({ ...o, duration: 2600, curve: 1.4 });
  } else {
    const o = { padding: fitPad() };
    if (reduce) map.fitBounds(bounds, { ...o, duration: 0 }); else map.fitBounds(bounds, { ...o, duration: 2000 });
  }
}

STATIONS.forEach((s, i) => {
  const li = document.createElement('li');
  li.innerHTML = '<button class="tile" type="button" aria-label="' + s.name + '">' +
    '<span class="tile-img">' + SVGS[s.svg] + '</span>' +
    '<span class="tile-cap"><span class="tile-no">Print ' + s.no + '</span><span class="tile-name">' + s.name + '</span></span></button>';
  li.firstChild.addEventListener('click', () => select(i));
  $('contact').appendChild(li);
});

$('expose').addEventListener('click', expose);
$('overview').addEventListener('click', () => select(-1));

/* ---- Map layers ---- */
map.on('load', () => {
  buildRules();

  map.addSource('route', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [ROUTE[0], ROUTE[0]] } } });
  map.addSource('stations', {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: STATIONS.map((s, i) => ({ type: 'Feature', properties: { i, name: s.name, no: s.no }, geometry: { type: 'Point', coordinates: s.coord } })) },
  });

  map.addLayer({ id: 'route-glow', type: 'line', source: 'route',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#F1F5FA', 'line-width': 7, 'line-blur': 5, 'line-opacity': 0.28, 'line-emissive-strength': 1 } });
  map.addLayer({ id: 'route', type: 'line', source: 'route',
    layout: { 'line-join': 'round' },
    paint: { 'line-color': '#F1F5FA', 'line-width': ['interpolate', ['linear'], ['zoom'], 9, 1.6, 15, 3], 'line-dasharray': [1.6, 1.4], 'line-emissive-strength': 1 } });

  map.addLayer({ id: 'station-active', type: 'circle', source: 'stations', filter: ['==', ['get', 'i'], -1],
    paint: { 'circle-radius': 15, 'circle-color': 'rgba(241,245,250,0.25)', 'circle-stroke-color': '#8FB3DD', 'circle-stroke-width': 1.5, 'circle-emissive-strength': 1 } });
  map.addLayer({ id: 'station-dot', type: 'circle', source: 'stations',
    paint: { 'circle-radius': 8, 'circle-color': '#F1F5FA', 'circle-stroke-color': '#3A5F96', 'circle-stroke-width': 2.5, 'circle-emissive-strength': 1 } });
  map.addLayer({ id: 'station-label', type: 'symbol', source: 'stations',
    layout: {
      'text-field': ['concat', ['get', 'no'], '  ', ['get', 'name']],
      'text-font': ['DIN Pro Medium', 'Arial Unicode MS Regular'],
      'text-size': 13,
      'text-letter-spacing': 0.04,
      'text-variable-anchor': ['left', 'right', 'top', 'bottom'],
      'text-radial-offset': 1.2,
    },
    paint: { 'text-color': '#3A5F96', 'text-halo-color': '#E4ECF7', 'text-halo-width': 1.5, 'text-emissive-strength': 1 } });

  map.on('click', 'station-dot', (e) => select(e.features[0].properties.i));
  map.on('mouseenter', 'station-dot', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'station-dot', () => { map.getCanvas().style.cursor = ''; });

  setExposure(1);
  setRoute(1);
  select(-1, true);
  const n = $('status-note');
  n.classList.remove('loading');
  n.textContent = 'Plate ready.';
  setTimeout(() => n.classList.add('hidden'), 2500);
});

map.on('error', (e) => {
  const n = $('status-note');
  n.classList.remove('hidden', 'loading');
  n.classList.add('error');
  n.textContent = 'Map error: ' + ((e.error && e.error.message) || 'unknown');
});

window.addEventListener('resize', () => { if (current < 0) map.fitBounds(bounds, { padding: fitPad(), duration: 0 }); });
</script>
</body>
</html>
