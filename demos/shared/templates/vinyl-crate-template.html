<!--
  Working EXAMPLE of the Vinyl Crate style pack (vinyl-crate.css, in this
  same folder). Open this file directly to see the pattern working with a
  seven-stop Nashville, Tennessee music crawl on Mapbox Standard (dusk
  light, faded theme). A turntable (inline SVG: grooved platter, centre
  label, tonearm) and cream liner notes sit on the left; the map sits on
  the right with a wooden crate of square LP sleeves BELOW it, one per
  stop. Pick a sleeve (or a vinyl-record marker on the map): the sleeve
  slides up, the platter label updates, the tonearm swings onto the
  record, the platter spins and the map flies there. Copy the markup below
  into your own demo and link vinyl-crate.css from its <head> -- see the
  class/id contract documented at the top of that CSS file.

  This is a brand-new style, not extracted from an existing demo -- built
  from a design brief (70s record-shop crate digging) at the user's request
  for something distinct from every other pack in this folder. The places
  are real public landmarks and districts, but the sleeve artwork, album
  titles, "artists" and credits are fictional placeholders -- swap in your
  own. All sleeve art is hand-written inline SVG.

  What's NOT included: audio playback, search/geocoding, routing, popups,
  or a hard-coded access token (demo-kit.js sets that).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vinyl Crate</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Sen:wght@400;600;700&display=swap" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" rel="stylesheet" />
<link href="vinyl-crate.css" rel="stylesheet" />
<script src="../demo-kit.js"></script>
<style>
  /* Demo-owned: every demo positions its own #map. */
  #map { position: absolute; inset: 0; }
</style>
</head>
<body>
<div class="app">
  <header class="turntable" id="tt">
    <div class="tt-text">
      <h1>Nashville Crate Dig</h1>
      <p class="tt-now" id="tt-now">Drop the needle</p>
    </div>
    <svg class="tt-svg" id="tt-svg" viewBox="0 0 300 250" role="img" aria-label="Turntable with a spinning record and tonearm">
      <defs>
        <linearGradient id="vc-wood" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8A6038"/><stop offset="1" stop-color="#5A3C24"/>
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="296" height="246" rx="14" fill="url(#vc-wood)" stroke="#2E1D10" stroke-width="3"/>
      <circle cx="120" cy="125" r="106" fill="#1b1b1b" stroke="#c9b99f" stroke-width="2"/>
      <g class="record">
        <circle cx="120" cy="125" r="100" fill="#121212"/>
        <g id="tt-grooves" fill="none" stroke="#2c2c2c" stroke-width="1"></g>
        <path d="M120 125 L169 40.1 A98 98 0 0 1 204.9 76 Z" fill="#fff" opacity="0.08"/>
        <path d="M120 125 L71 209.9 A98 98 0 0 1 35.1 174 Z" fill="#fff" opacity="0.08"/>
        <circle cx="120" cy="125" r="34" id="tt-label-bg" fill="#C0392B"/>
        <circle cx="120" cy="125" r="31" fill="none" stroke="#F5EBDD" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
        <text id="tt-label-no" x="120" y="132" text-anchor="middle" font-family="'Bowlby One SC', sans-serif" font-size="22" fill="#F5EBDD">A</text>
        <text id="tt-label-name" x="120" y="146" text-anchor="middle" font-family="'Bowlby One SC', sans-serif" font-size="5.5" fill="#F5EBDD">NASHVILLE</text>
        <text x="120" y="111" text-anchor="middle" font-family="'Bowlby One SC', sans-serif" font-size="5" fill="#F5EBDD" opacity="0.8">SIDE A</text>
      </g>
      <circle cx="120" cy="125" r="3.5" fill="#d8d2c6"/>
      <circle cx="262" cy="208" r="11" fill="#E1A730" stroke="#2E1D10" stroke-width="2"/>
      <circle class="tt-led" cx="262" cy="180" r="4"/>
      <g class="tonearm">
        <rect x="256" y="6" width="12" height="26" rx="3" fill="#F5EBDD" stroke="#2E1D10" stroke-width="1.5"/>
        <line x1="262" y1="38" x2="262" y2="150" stroke="#d9d2c4" stroke-width="4" stroke-linecap="round"/>
        <rect x="254" y="148" width="16" height="25" rx="3" fill="#121212"/>
        <rect x="257" y="165" width="10" height="7" fill="#E1A730"/>
        <circle cx="262" cy="38" r="13" fill="#bdb4a3" stroke="#2E1D10" stroke-width="2"/>
        <circle cx="262" cy="38" r="5" fill="#6B4A2E"/>
      </g>
    </svg>
  </header>

  <section class="liner" aria-live="polite" aria-label="Liner notes">
    <div class="status-note loading hidden" id="status-note"><span id="status-text">Loading map&hellip;</span></div>
    <div class="liner-body" id="liner-body"></div>
  </section>

  <div class="stage">
    <div class="map-wrap">
      <div id="map"></div>
      <button class="btn btn-secondary" id="whole-btn" type="button">Whole crawl</button>
    </div>
    <div class="crate">
      <div class="crate-row" id="crate-row" role="list" aria-label="Crate of stops"></div>
      <div class="crate-front">Nashville Crawl &middot; Side A</div>
    </div>
  </div>
</div>

<script>
// Fictional albums/artists; real public places (approximate coordinates).
const STOPS = [
  { name: "Ryman Auditorium", short: "RYMAN", album: "Mother Church Sessions", artist: "The Pew Kings",
    coord: [-86.7785, 36.1612], lab: '#C0392B', ink: '#F5EBDD',
    text: "A brick tabernacle from 1892 that grew into the 'Mother Church of Country Music'. Sit on the old wooden pews and the room does half the singing for you.",
    credits: [['Cut at', '1892 &middot; pew acoustics'], ['Mood', 'Hushed, reverent, foot-tapping'], ['Dig time', '60 min']] },
  { name: "Lower Broadway", short: "BROADWAY", album: "Neon Honky-Tonk Hour", artist: "Rhinestone Rita",
    coord: [-86.7755, 36.1598], lab: '#E1A730', ink: '#121212',
    text: "Block after block of neon, with live bands going from the first matinee set to last call. Walk it slowly: every doorway is a different record.",
    credits: [['Cut at', 'Every door, all day'], ['Mood', 'Loud, glittery, joyful'], ['Dig time', '90 min']] },
  { name: "Country Music Hall of Fame", short: "HALL OF FAME", album: "Gold Plaque Rotation", artist: "Various Fictional Heroes",
    coord: [-86.7761, 36.1583], lab: '#2A7F7A', ink: '#F5EBDD',
    text: "A museum shaped like piano keys and a bandstand, full of stage costumes, handwritten lyrics and gleaming instruments. Linger in the galleries of the long-playing years.",
    credits: [['Cut at', 'Rep. John Lewis Way S'], ['Mood', 'Curious, awed'], ['Dig time', '2 hrs']] },
  { name: "Music Row", short: "MUSIC ROW", album: "Studio B Outtakes", artist: "The Session Players",
    coord: [-86.7935, 36.1503], lab: '#D35400', ink: '#F5EBDD',
    text: "Low houses and converted bungalows along 16th and 17th Avenues hold the studios, labels and publishers behind countless records. Quiet streets, loud history.",
    credits: [['Cut at', '16th &amp; 17th Ave S'], ['Mood', 'Hushed, workmanlike'], ['Dig time', '45 min']] },
  { name: "The Gulch", short: "THE GULCH", album: "Rail Yard Remix", artist: "Switchman &amp; Co.",
    coord: [-86.7857, 36.1516], lab: '#6B7A2A', ink: '#F5EBDD',
    text: "A former rail yard turned neighbourhood of murals, rooftop bars and coffee roasters. The beat here is a little more modern, a lot more photogenic.",
    credits: [['Cut at', 'Old rail yard'], ['Mood', 'Breezy, trendy'], ['Dig time', '75 min']] },
  { name: "Printer's Alley", short: "PRINTER'S", album: "Back-Alley Blues", artist: "Ink &amp; Velvet",
    coord: [-86.7790, 36.1642], lab: '#F5EBDD', ink: '#121212',
    text: "A narrow lane of former printing houses that became a nightclub row, glowing with signs and late-night jazz and blues. Look up: the lights stack like album spines.",
    credits: [['Cut at', 'Between Church &amp; Union'], ['Mood', 'Smoky, intimate'], ['Dig time', '60 min']] },
  { name: "East Nashville Five Points", short: "FIVE POINTS", album: "Crossroads Flexi-Disc", artist: "The Fifth Corner",
    coord: [-86.7497, 36.1750], lab: '#8B5E3C', ink: '#F5EBDD',
    text: "Across the river, five streets meet at a crossroads of record shops, indie venues and neighbourhood diners. Finish the crawl with a flip through the bargain bins.",
    credits: [['Cut at', 'Woodland St &amp; 11th'], ['Mood', 'Laid-back, indie'], ['Dig time', '90 min']] },
];

const C = { mu: '#E1A730', or: '#D35400', ol: '#6B7A2A', te: '#2A7F7A', cr: '#F5EBDD', bk: '#121212', rd: '#C0392B', wa: '#6B4A2E' };
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const phone = () => window.matchMedia('(max-width: 820px)').matches;
const $ = (id) => document.getElementById(id);
let current = -1;
let armTimer = null;

/* ---- Sleeve art: bold geometric 70s designs, 100x100 viewBox ---- */
function pt(cx, cy, r, deg) {
  const a = (deg * Math.PI) / 180;
  return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`;
}
const ART = [
  () => { // sunburst
    let s = `<rect width="100" height="100" fill="${C.mu}"/>`;
    for (let a = -180; a < 0; a += 20) s += `<polygon points="50,100 ${pt(50, 100, 160, a)} ${pt(50, 100, 160, a + 10)}" fill="${C.or}"/>`;
    return s + `<circle cx="50" cy="100" r="30" fill="${C.cr}"/><circle cx="50" cy="100" r="18" fill="${C.rd}"/>`;
  },
  () => `<rect width="100" height="100" fill="${C.te}"/>` + [[100, C.mu], [82, C.or], [64, C.cr], [46, C.bk], [28, C.rd]]
    .map(([r, f]) => `<circle cx="0" cy="100" r="${r}" fill="${f}"/>`).join(''),
  () => { // record on olive
    let s = `<rect width="100" height="100" fill="${C.ol}"/><circle cx="50" cy="62" r="40" fill="${C.bk}"/>`;
    for (let r = 20; r < 40; r += 5) s += `<circle cx="50" cy="62" r="${r}" fill="none" stroke="${C.cr}" stroke-opacity=".25"/>`;
    return s + `<circle cx="50" cy="62" r="14" fill="${C.mu}"/><circle cx="50" cy="62" r="2.5" fill="${C.bk}"/>`;
  },
  () => { // checkerboard
    let s = `<rect width="100" height="100" fill="${C.cr}"/>`;
    for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) if ((x + y) % 2) s += `<rect x="${x * 20}" y="${y * 20}" width="20" height="20" fill="${C.or}"/>`;
    return s + `<circle cx="50" cy="62" r="25" fill="${C.bk}"/><circle cx="50" cy="62" r="10" fill="${C.mu}"/>`;
  },
  () => `<rect width="100" height="100" fill="${C.cr}"/><path d="M26 60 A24 24 0 0 1 74 60Z" fill="${C.rd}"/>` +
    [[60, C.ol], [72, C.te], [84, C.or], [96, C.mu]].map(([y, f]) => `<rect y="${y - 4}" width="100" height="12" fill="${f}"/>`).join(''),
  () => { // halftone
    let s = `<rect width="100" height="100" fill="${C.cr}"/>`;
    for (let y = 0; y < 6; y++) for (let x = 0; x < 6; x++) s += `<circle cx="${10 + x * 16}" cy="${24 + y * 14}" r="${1 + y * 0.9}" fill="${C.rd}"/>`;
    return s + `<polygon points="100,100 100,50 50,100" fill="${C.bk}"/><circle cx="82" cy="82" r="8" fill="${C.mu}"/>`;
  },
  () => { // five-point star
    const star = []; for (let k = 0; k < 10; k++) star.push(pt(50, 62, k % 2 ? 15 : 36, -90 + k * 36));
    let s = `<rect width="100" height="100" fill="${C.wa}"/><polygon points="${star.join(' ')}" fill="${C.mu}"/>`;
    for (let k = 0; k < 5; k++) { const [x, y] = pt(50, 62, 42, -90 + k * 72).split(','); s += `<circle cx="${x}" cy="${y}" r="4.5" fill="${C.cr}"/>`; }
    return s + `<circle cx="50" cy="62" r="7" fill="${C.rd}"/>`;
  },
];

/* ---- Turntable grooves ---- */
$('tt-grooves').innerHTML = Array.from({ length: 14 }, (_, i) => `<circle cx="120" cy="125" r="${40 + i * 4.2}"/>`).join('');

/* ---- Map ---- */
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  config: { basemap: { lightPreset: 'dusk', theme: 'faded', showPointOfInterestLabels: false, showPlaceLabels: false } },
  center: [-86.78, 36.162],
  zoom: 12,
  attributionControl: true,
});

const markerEls = [];
const row = $('crate-row');
const sleeveEls = [];

function fitAll(instant) {
  const b = new mapboxgl.LngLatBounds();
  STOPS.forEach((s) => b.extend(s.coord));
  const pad = phone() ? { top: 50, bottom: 70, left: 48, right: 48 } : { top: 60, bottom: 70, left: 80, right: 80 };
  map.fitBounds(b, { padding: pad, duration: instant || reduce ? 0 : 1400, pitch: 0, bearing: 0 });
}

function fly(s) {
  const o = { center: s.coord, zoom: 15.4, pitch: 45, bearing: -12,
    padding: { top: 30, bottom: 70, left: 30, right: 30 } };
  if (reduce) map.jumpTo(o); else map.flyTo({ ...o, duration: 2200, essential: false });
}

/* ---- Crate: sleeves + markers ---- */
STOPS.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'sleeve';
  b.setAttribute('role', 'listitem');
  b.setAttribute('aria-label', `${i + 1}. ${s.name}, album ${s.album}`);
  b.title = s.name;
  b.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">${ART[i]()}</svg>` +
    `<span class="sleeve-name">${s.short}</span><span class="sticker"><span>No.${i + 1}</span></span>`;
  b.addEventListener('click', () => select(i));
  row.appendChild(b);
  sleeveEls.push(b);

  const root = document.createElement('div');  // never style the Marker root
  root.innerHTML = `<div class="rec" style="--lab:${s.lab};--ink:${s.ink}" title="${s.name}"><span class="disc"></span><span class="n">${i + 1}</span></div>`;
  root.addEventListener('click', () => select(i));
  markerEls.push(root.firstChild);
  // on phones fan the bunched downtown stops (1, 2, 3, 6) apart with pixel offsets
  const fan = { 0: [-20, 2], 1: [20, -2], 2: [0, 22], 5: [0, -20] };
  new mapboxgl.Marker({ element: root, offset: phone() && fan[i] ? fan[i] : [0, 0] }).setLngLat(s.coord).addTo(map);
});

// Mouse wheel scrolls the crate sideways
row.addEventListener('wheel', (e) => {
  if (row.scrollWidth > row.clientWidth && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    row.scrollLeft += e.deltaY;
    e.preventDefault();
  }
}, { passive: false });

/* ---- Liner notes ---- */
function introHTML() {
  return `<p class="liner-kicker">Side A &middot; 7 tracks</p>
    <h2 class="liner-title">Flip through the crate</h2>
    <p class="liner-album">A Nashville music crawl</p>
    <p class="liner-text">Seven sleeves, seven stops, from the Mother Church to the bargain bins. Pick a sleeve below the map (or a record on the map) to drop the needle and fly there.</p>
    <div class="liner-nav"><button class="btn btn-primary" type="button" data-go="0">Start at track 1</button></div>`;
}

function stopHTML(s, i) {
  return `<p class="liner-kicker">Side A &middot; Track ${i + 1} of ${STOPS.length}</p>
    <h2 class="liner-title">${s.name}</h2>
    <p class="liner-album">${s.album} &mdash; ${s.artist}</p>
    <p class="liner-text">${s.text}</p>
    <dl class="credits">${s.credits.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    <div class="liner-nav">
      <button class="btn btn-secondary" type="button" data-go="${(i + STOPS.length - 1) % STOPS.length}">&larr; Prev</button>
      <button class="btn btn-primary" type="button" data-go="${(i + 1) % STOPS.length}">Next track &rarr;</button>
    </div>`;
}

function setLiner(html, animate) {
  const el = $('liner-body');
  el.innerHTML = html;
  el.classList.remove('swap');
  if (animate) { void el.offsetWidth; el.classList.add('swap'); }
  const sc = el.closest('.liner');
  if (sc) sc.scrollTop = 0;
}
$('liner-body').addEventListener('click', (e) => {
  const t = e.target.closest('[data-go]');
  if (t) select(Number(t.dataset.go));
});

/* ---- Selection: sleeve slides up, label updates, arm swings, platter spins ---- */
function select(i) {
  const s = STOPS[i];
  const tt = $('tt');
  const changed = i !== current;
  current = i;

  sleeveEls.forEach((el, k) => {
    el.classList.toggle('is-active', k === i);
    el.setAttribute('aria-pressed', k === i ? 'true' : 'false');
  });
  markerEls.forEach((el, k) => el.classList.toggle('on', k === i));

  // centre the picked sleeve inside the crate row (scrolls the row only, never the page)
  const el = sleeveEls[i];
  row.scrollTo({ left: el.offsetLeft - (row.clientWidth - el.offsetWidth) / 2, behavior: reduce ? 'auto' : 'smooth' });

  // platter label
  $('tt-label-bg').setAttribute('fill', s.lab);
  ['tt-label-no', 'tt-label-name'].forEach((id) => $(id).setAttribute('fill', s.ink));
  $('tt-label-no').textContent = String(i + 1).padStart(2, '0');
  $('tt-label-name').textContent = s.short;
  $('tt-now').textContent = `Now spinning: ${s.name}`;

  // lift the arm briefly when changing records, then drop it
  clearTimeout(armTimer);
  if (changed && tt.classList.contains('is-playing') && !reduce) {
    tt.classList.remove('is-playing');
    tt.classList.add('is-lifting');
    armTimer = setTimeout(() => { tt.classList.remove('is-lifting'); tt.classList.add('is-playing'); }, 450);
  } else {
    tt.classList.add('is-playing');
  }

  setLiner(stopHTML(s, i), changed && !reduce);
  fly(s);
  updateGlow();
}

/* ---- Map layers: a warm emissive glow under the picked stop ---- */
function updateGlow() {
  const src = map.getSource('crate-glow');
  if (!src) return;
  src.setData({ type: 'FeatureCollection', features: current < 0 ? [] : [
    { type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: STOPS[current].coord } }] });
}

map.on('style.load', () => {
  map.addSource('crate-glow', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: 'crate-glow', type: 'circle', source: 'crate-glow', slot: 'top',
    paint: {
      'circle-radius': 46, 'circle-color': '#E1A730', 'circle-opacity': 0.4,
      'circle-blur': 1, 'circle-emissive-strength': 1, 'circle-pitch-alignment': 'map',
    },
  });
  updateGlow();
  fitAll(true);
});

map.on('error', (e) => {
  const n = $('status-note');
  n.className = 'status-note error';
  $('status-text').textContent = 'Map error: ' + ((e.error && e.error.message) || 'unknown');
});

$('whole-btn').addEventListener('click', () => fitAll(false));
setLiner(introHTML(), false);
</script>
</body>
</html>
