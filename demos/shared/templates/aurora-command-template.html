<!--
  Working EXAMPLE of the Aurora Command style pack (aurora-command.css, in
  this same folder). Open this file directly to see the pattern working: an
  inset Mapbox Standard (faded) map of Barcelona framed by a drifting aurora
  gradient, with a command palette at the top. Press Cmd/Ctrl+K or / to
  open it, type to fuzzy-filter twenty places, use the arrow keys and Enter
  to fly there, or type > for commands (3d on, 3d off, night, day, reset
  view, random place). Copy the markup below into your own demo and link
  aurora-command.css from its <head> -- see the class/id contract
  documented at the top of that CSS file.

  This is a brand-new style, not extracted from an existing demo -- built
  from a design brief (aurora gradient, frosted glass, keyboard-first) at
  the user's request for something distinct from every other pack in this
  folder. The places are real, but the categories and subtitles are
  illustrative placeholders -- swap in your own.

  What's NOT included: search/geocoding against a real service, routing,
  popups, or a hard-coded access token (demo-kit.js sets that).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aurora Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" rel="stylesheet" />
<link href="aurora-command.css" rel="stylesheet" />
<script src="../demo-kit.js"></script>
<style>
  /* Demo-owned: every demo positions its own #map. */
  #map {
    position: absolute;
    inset: 0;
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand"><i class="brand-dot"></i>Aurora</span>
  <span class="topbar-hint">Press <kbd class="keycap mod-hint">Ctrl K</kbd> or <kbd class="keycap">/</kbd> to search</span>
</header>
<div class="stage">
  <div id="map"></div>

  <div class="palette" id="palette">
    <button class="palette-pill" id="palette-pill" type="button">
      <span class="pill-icon">&#8981;</span>
      <span class="pill-text">Search or type &gt; for commands</span>
      <kbd class="keycap mod-hint">Ctrl K</kbd>
    </button>
    <div class="palette-panel" role="dialog" aria-label="Command palette">
      <div class="palette-input-row">
        <span class="palette-icon">&#8981;</span>
        <input id="palette-input" type="text" autocomplete="off" spellcheck="false" role="combobox"
               aria-expanded="true" aria-controls="palette-results"
               placeholder="Search places, or type &gt; for commands" />
        <kbd class="keycap mod-hint">Ctrl K</kbd>
      </div>
      <div class="palette-results" id="palette-results" role="listbox"></div>
      <div class="palette-footer">
        <span><kbd class="keycap">&uarr;</kbd><kbd class="keycap">&darr;</kbd> navigate</span>
        <span><kbd class="keycap">&crarr;</kbd> open</span>
        <span><kbd class="keycap">esc</kbd> close</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</div>

<script>
// name, category, [lng, lat]. Categories and subtitles are illustrative.
const PLACES = [
  ['Sagrada Família', 'Landmark', [2.1744, 41.4036]],
  ['Park Güell', 'Park', [2.1527, 41.4145]],
  ['Casa Batlló', 'Landmark', [2.1650, 41.3917]],
  ['Casa Milà', 'Landmark', [2.1618, 41.3953]],
  ['Gothic Quarter', 'Neighbourhood', [2.1770, 41.3829]],
  ['Plaça de Catalunya', 'Landmark', [2.1700, 41.3870]],
  ['Boqueria Market', 'Market', [2.1717, 41.3817]],
  ['Barcelona Cathedral', 'Landmark', [2.1762, 41.3840]],
  ['Picasso Museum', 'Museum', [2.1806, 41.3852]],
  ['Arc de Triomf', 'Landmark', [2.1807, 41.3911]],
  ['Parc de la Ciutadella', 'Park', [2.1873, 41.3888]],
  ['Barceloneta Beach', 'Beach', [2.1900, 41.3783]],
  ['Montjuïc Castle', 'Viewpoint', [2.1660, 41.3636]],
  ['Magic Fountain', 'Landmark', [2.1517, 41.3712]],
  ['MNAC', 'Museum', [2.1534, 41.3685]],
  ['Tibidabo', 'Viewpoint', [2.1190, 41.4225]],
  ['Camp Nou', 'Sports', [2.1228, 41.3809]],
  ['Sant Antoni Market', 'Market', [2.1627, 41.3786]],
  ['Torre Glòries', 'Landmark', [2.1895, 41.4036]],
  ['Plaça del Sol', 'Neighbourhood', [2.1566, 41.4030]],
].map(([name, cat, coord]) => ({ name, cat, coord, sub: `${cat} · Barcelona` }));

const HOME = { center: [2.1686, 41.3874], zoom: 12.2, pitch: 0, bearing: 0 };

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  ...HOME,
  // Only keys confirmed in Standard's config schema.
  config: {
    basemap: { theme: 'faded', lightPreset: 'day', show3dObjects: true, showPointOfInterestLabels: false },
  },
});

const $ = (id) => document.getElementById(id);
const palette = $('palette'), input = $('palette-input'), resultsEl = $('palette-results'), toastEl = $('toast');
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
document.querySelectorAll('.mod-hint').forEach((el) => { el.textContent = isMac ? '⌘K' : 'Ctrl K'; });

let marker = null, toastTimer = null, items = [], sel = 0;

function toast(msg, isError) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('error', !!isError);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function setConfig(key, value) {
  try { map.setConfigProperty('basemap', key, value); } catch (e) { toast('Map style is still loading', true); }
}

function goTo(p) {
  if (!marker) {
    const el = document.createElement('div');
    el.className = 'aurora-marker';
    marker = new mapboxgl.Marker({ element: el }).setLngLat(p.coord).addTo(map);
  } else {
    marker.setLngLat(p.coord);
  }
  map.flyTo({ center: p.coord, zoom: 15.2, duration: 1600 });
  toast(`Flying to ${p.name}`);
}

const COMMANDS = [
  { name: '3d on', sub: 'Show 3D buildings and tilt the camera', hint: '> 3d on',
    run: () => { setConfig('show3dObjects', true); map.easeTo({ pitch: 60, duration: 900 }); toast('3D on'); } },
  { name: '3d off', sub: 'Flatten buildings and level the camera', hint: '> 3d off',
    run: () => { setConfig('show3dObjects', false); map.easeTo({ pitch: 0, duration: 900 }); toast('3D off'); } },
  { name: 'night', sub: 'Switch the basemap to night lighting', hint: '> night',
    run: () => { setConfig('lightPreset', 'night'); toast('Night preset'); } },
  { name: 'day', sub: 'Switch the basemap to day lighting', hint: '> day',
    run: () => { setConfig('lightPreset', 'day'); toast('Day preset'); } },
  { name: 'reset view', sub: 'Return to the city overview', hint: '> reset',
    run: () => { if (marker) { marker.remove(); marker = null; } map.flyTo({ ...HOME, duration: 1200 }); toast('View reset'); } },
  { name: 'random place', sub: 'Fly to a surprise spot', hint: '> random',
    run: () => goTo(PLACES[Math.floor(Math.random() * PLACES.length)]) },
];

/* ---- Fuzzy matching: greedy subsequence, rewarding runs and word starts ---- */
const fold = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function match(term, text) {
  if (!term) return { score: 0, hit: [] };
  const t = fold(term), s = fold(text), hit = [];
  let i = 0, score = 0, prev = -2;
  for (let j = 0; j < s.length && i < t.length; j++) {
    if (s[j] !== t[i]) continue;
    score += 1 + (j === prev + 1 ? 3 : 0) + (j === 0 || s[j - 1] === ' ' ? 2 : 0);
    hit.push(j); prev = j; i++;
  }
  return i === t.length ? { score: score - s.length * 0.01, hit } : null;
}

function rank(list, term, extra) {
  return list
    .map((o) => {
      const m = match(term, o.name) || (extra && match(term, o[extra]) && { score: -5, hit: [] });
      return m && { o, hit: m.hit, score: m.score };
    })
    .filter(Boolean)
    .sort((a, b) => b.score - a.score);
}

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mark = (text, hit) => [...text].map((c, i) => (hit.includes(i) ? `<mark>${esc(c)}</mark>` : esc(c))).join('');

/* ---- Rendering ---- */
function render() {
  const q = input.value.trimStart(), cmdMode = q.startsWith('>'), term = (cmdMode ? q.slice(1) : q).trim();
  const places = cmdMode ? [] : rank(PLACES, term, 'cat').slice(0, term ? 12 : 6);
  const cmds = cmdMode || !term ? rank(COMMANDS, term) : rank(COMMANDS, term).slice(0, 3);
  items = [...places.map((r) => ({ ...r, kind: 'place' })), ...cmds.map((r) => ({ ...r, kind: 'command' }))];
  sel = Math.min(sel, Math.max(items.length - 1, 0));

  let html = '', last = '';
  items.forEach((r, i) => {
    if (r.kind !== last) {
      last = r.kind;
      html += `<div class="result-group" role="presentation">${r.kind === 'place' ? 'Places' : 'Commands'}</div>`;
    }
    const isCmd = r.kind === 'command';
    html += `<div class="result-row ${isCmd ? 'is-command' : ''} ${i === sel ? 'is-selected' : ''}" id="opt-${i}" role="option" data-i="${i}">` +
      `<span class="result-icon">${isCmd ? '&gt;' : esc(r.o.cat[0])}</span>` +
      `<span class="result-text"><span class="result-title">${mark(r.o.name, r.hit)}</span><span class="result-sub">${esc(r.o.sub)}</span></span>` +
      `<kbd class="keycap result-hint">${isCmd ? esc(r.o.hint) : '&crarr;'}</kbd></div>`;
  });
  resultsEl.innerHTML = html || '<div class="palette-empty">No matches. Try another word, or type &gt; for commands.</div>';
  input.setAttribute('aria-activedescendant', items.length ? `opt-${sel}` : '');
}

function select(i, scroll) {
  if (!items.length) return;
  sel = (i + items.length) % items.length;
  resultsEl.querySelectorAll('.result-row').forEach((el, n) => el.classList.toggle('is-selected', n === sel));
  input.setAttribute('aria-activedescendant', `opt-${sel}`);
  if (scroll) $(`opt-${sel}`).scrollIntoView({ block: 'nearest' });
}

function run(i) {
  const r = items[i];
  if (!r) return;
  close();
  if (r.kind === 'place') goTo(r.o); else r.o.run();
}

/* ---- Open / close ---- */
const isOpen = () => palette.classList.contains('is-open');

function open() {
  palette.classList.add('is-open');
  sel = 0;
  render();
  input.focus();
}

function close() {
  palette.classList.remove('is-open');
  input.value = '';
  input.blur();
}

$('palette-pill').addEventListener('click', open);
input.addEventListener('input', () => { sel = 0; render(); });
resultsEl.addEventListener('mousemove', (e) => {
  const row = e.target.closest('.result-row');
  if (row && Number(row.dataset.i) !== sel) select(Number(row.dataset.i));
});
resultsEl.addEventListener('click', (e) => {
  const row = e.target.closest('.result-row');
  if (row) run(Number(row.dataset.i));
});
document.addEventListener('pointerdown', (e) => {
  if (isOpen() && !palette.contains(e.target)) close();
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); select(sel + 1, true); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); select(sel - 1, true); }
  else if (e.key === 'Enter') { e.preventDefault(); run(sel); }
});

window.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    isOpen() ? close() : open();
  } else if (e.key === 'Escape' && isOpen()) {
    close();
  } else if (e.key === '/' && !isOpen() && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    e.preventDefault();
    open();
  }
});

map.on('error', (e) => toast((e.error && e.error.message) || 'Map error', true));
</script>
</body>
</html>
