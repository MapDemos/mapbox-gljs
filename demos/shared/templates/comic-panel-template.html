<!--
  Working EXAMPLE of the Comic Panel style pack (comic-panel.css, in this
  same folder). Open this file directly to see the pattern working with six
  illustrative "chapter" panels around Rio de Janeiro, then copy the markup
  below into your own demo and link comic-panel.css from its <head> -- see
  the class/id contract documented at the top of that CSS file for what to
  build.

  This is a brand-new style, not extracted from an existing demo -- built
  from a design brief (a Silver-Age comic page: halftone dots, thick panel
  borders, speech balloons, starburst SFX). The hero "Captain Compass", the
  story copy and the drawings are fictional, illustrative placeholders --
  swap in your own.

  What's NOT included: real artwork or photos (the illustrations are tiny
  hand-written SVG shapes), any data beyond six hard-coded points, the Mapbox
  access token (demo-kit.js sets mapboxgl.accessToken for you), and any
  server or API calls beyond the map itself.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Amazing Tour of Rio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" rel="stylesheet" />
<link href="comic-panel.css" rel="stylesheet" />
<script src="../demo-kit.js"></script>
<style>
  /* Demo-owned: #map fills its own panel (.map-panel is position: sticky or
     relative, so absolute children anchor to it). */
  #map {
    position: absolute;
    inset: 0;
  }
</style>
</head>
<body>
<main class="page">
  <header class="title-panel">
    <div class="title-text">
      <h1 class="title">The Amazing Tour of Rio!</h1>
      <p class="byline">Captain Compass in &ldquo;Six Wonders, One Map!&rdquo; &mdash; click a panel to fly there!</p>
      <div><span class="status-note loading" id="status-note"><span id="status-text">Inking the map...</span></span></div>
    </div>
    <div class="pow" aria-hidden="true"><span>NEW!</span></div>
  </header>

  <section class="map-panel" aria-label="Map of Rio de Janeiro">
    <div id="map"></div>
    <div class="map-tools">
      <button class="btn btn-primary" id="next-btn" type="button">Next panel &#9654;</button>
    </div>
    <div class="sfx" id="sfx" aria-hidden="true"><div class="pow"><span id="sfx-word">POW!</span></div></div>
  </section>
  <!-- .story panels are generated below from the CHAPTERS list -->
</main>

<script>
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Tiny hand-drawn illustrations (classes .k .c .m .y .r .g .n .o are defined in the pack).
const svg = (body) => `<svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${body}</svg>`;
const ART = {
  cristo: svg('<circle class="y" cx="132" cy="20" r="11"/><path class="g" d="M0 90V62L50 40L80 32L112 42L160 64V90Z"/><rect class="n" x="54" y="14" width="52" height="8" rx="3"/><path class="n" d="M74 14H86L90 32H70Z"/><circle class="n" cx="80" cy="9" r="5"/><rect class="k" x="68" y="32" width="24" height="8"/>'),
  sugar: svg('<circle class="y" cx="28" cy="20" r="11"/><path class="g" d="M10 90C20 42 50 30 78 34C100 36 112 54 120 90Z"/><path class="g" d="M96 90C104 64 128 58 150 66L160 90Z"/><path class="o" d="M30 14L132 46"/><rect class="r" x="72" y="28" width="18" height="11" rx="2"/>'),
  stairs: svg('<path class="y" d="M0 90V78H22V66H44V54H66V42H88V30H110V18H132V6H160V90Z"/><rect class="m" x="6" y="80" width="10" height="6"/><rect class="c" x="28" y="68" width="10" height="6"/><rect class="r" x="50" y="56" width="10" height="6"/><rect class="g" x="72" y="44" width="10" height="6"/><rect class="m" x="94" y="32" width="10" height="6"/><rect class="c" x="116" y="20" width="10" height="6"/>'),
  beach: svg('<circle class="y" cx="132" cy="16" r="11"/><path class="c" d="M0 52Q20 42 40 52T80 52T120 52T160 52V90H0Z"/><path class="y" d="M0 78Q20 68 40 78T80 78T120 78T160 78V90H0Z"/><path class="o" d="M58 42V74"/><path class="r" d="M40 44a18 14 0 0 1 36 0Z"/>'),
  stadium: svg('<ellipse class="n" cx="80" cy="58" rx="66" ry="26"/><ellipse class="g" cx="80" cy="58" rx="46" ry="14"/><path class="o" d="M34 58H126"/><path class="o" d="M16 40V18M144 40V18"/><circle class="y" cx="16" cy="14" r="6"/><circle class="y" cx="144" cy="14" r="6"/><circle class="n" cx="80" cy="58" r="6"/>'),
  garden: svg('<rect class="g" y="76" width="160" height="14"/><rect class="n" x="38" y="28" width="7" height="50"/><path class="g" d="M41 28Q20 22 10 40Q26 32 41 34Q56 32 72 40Q62 22 41 28Z"/><rect class="n" x="112" y="20" width="7" height="58"/><path class="g" d="M115 20Q94 14 84 32Q100 24 115 26Q130 24 146 32Q136 14 115 20Z"/>'),
};

const CHAPTERS = [
  { name: 'Cristo Redentor', caption: 'Chapter 1: The Summit', tone: 'cyan', art: 'cristo', sfx: 'WHOOSH!',
    center: [-43.2105, -22.9519], zoom: 15.2,
    say: 'Arms wide on Corcovado! I can see the whole city from up here!',
    pop: 'Corcovado peak, 710 m up. Hold on to your cape!' },
  { name: 'Pão de Açúcar', caption: 'Chapter 2: Cable Car Caper', tone: 'yellow', art: 'sugar', sfx: 'ZOOM!',
    center: [-43.1566, -22.9486], zoom: 15,
    say: 'Two cable cars, one sugar-loaf peak: next stop, adventure!',
    pop: 'Sugarloaf Mountain: 396 m of granite and glory.' },
  { name: 'Escadaria Selarón', caption: 'Chapter 3: Tile Trouble', tone: 'magenta', art: 'stairs', sfx: 'POW!',
    center: [-43.1794, -22.9152], zoom: 17,
    say: 'Hundreds of steps and a thousand colours! Every tile hides a secret!',
    pop: 'A staircase mosaic of tiles from around the world.' },
  { name: 'Copacabana', caption: 'Chapter 4: Beach Brigade', tone: 'cyan', art: 'beach', sfx: 'SPLASH!',
    center: [-43.1823, -22.9711], zoom: 14.5,
    say: 'Sun, sand and wavy pavement! Not a villain in sight!',
    pop: 'Four kilometres of beach and a famous wave-patterned promenade.' },
  { name: 'Maracanã', caption: 'Chapter 5: The Big Match', tone: 'yellow', art: 'stadium', sfx: 'GOOOAL!',
    center: [-43.2302, -22.9122], zoom: 15.5,
    say: 'The crowd roars and the whole stadium shakes! What a game!',
    pop: 'A legendary stadium that has hosted World Cup finals.' },
  { name: 'Jardim Botânico', caption: 'Chapter 6: Garden Guardians', tone: 'magenta', art: 'garden', sfx: 'RUSTLE!',
    center: [-43.2243, -22.9689], zoom: 15.5,
    say: 'Tall royal palms and hidden paths: the perfect secret hideout!',
    pop: 'A hillside garden full of royal palms and rare plants.' },
];

const PAD = { top: 56, bottom: 64, left: 24, right: 24 };

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/streets-v12',
  bounds: [[-43.245, -22.98], [-43.15, -22.9]],
  fitBoundsOptions: { padding: { top: 56, bottom: 64, left: 40, right: 40 } },
  // On phones the map is sticky; let one finger scroll the page.
  cooperativeGestures: window.matchMedia('(max-width: 899px)').matches,
});

// --- Flat comic colours, applied on style.load. Everything is guarded. ---
const INK = '#111111', NEWS = '#FFF6DA', CYAN = '#00A6D6', GREEN = '#5FD35F', YELLOW = '#FFE600';

function paint(id, prop, value) {
  try { if (map.getLayer(id)) map.setPaintProperty(id, prop, value); } catch (e) { /* layer lacks this property */ }
}

// Multiply the numeric stops of a zoom-interpolated / stepped width.
function scaleWidth(expr, k) {
  if (typeof expr === 'number') return expr * k;
  if (!Array.isArray(expr)) return expr;
  if (expr[0] === 'interpolate') return expr.map((v, i) => (i >= 4 && i % 2 === 0 ? scaleWidth(v, k) : v));
  if (expr[0] === 'step') return expr.map((v, i) => (i >= 2 && i % 2 === 0 ? scaleWidth(v, k) : v));
  return expr;
}

function recolor() {
  map.getStyle().layers.forEach((l) => {
    const id = l.id;
    try {
      if (l.type === 'background') {
        paint(id, 'background-color', NEWS);
      } else if (l.type === 'fill') {
        if (/^water/.test(id)) paint(id, 'fill-color', CYAN);
        else if (id === 'landuse') paint(id, 'fill-color', ['match', ['get', 'class'], ['park', 'pitch', 'golf_course', 'cemetery'], GREEN, NEWS]);
        else if (/park|landcover|wood|grass|scrub/.test(id)) paint(id, 'fill-color', GREEN);
        else if (/building/.test(id)) paint(id, 'fill-color', YELLOW);
        else if (/hillshade/.test(id)) paint(id, 'fill-opacity', 0);
      } else if (l.type === 'fill-extrusion') {
        paint(id, 'fill-extrusion-color', YELLOW);
      } else if (l.type === 'line') {
        if (/^waterway/.test(id)) {
          paint(id, 'line-color', CYAN);
        } else if (/^(road|bridge|tunnel)-/.test(id)) {
          const isCase = /case|casing/.test(id);
          const color = isCase || /rail|path|steps|pedestrian/.test(id) ? INK
            : /motorway|trunk|primary/.test(id) ? YELLOW : '#FFFFFF';
          paint(id, 'line-color', color);
          const w = map.getPaintProperty(id, 'line-width');
          if (w !== undefined) paint(id, 'line-width', scaleWidth(w, isCase ? 1.5 : 1.25));
        }
      } else if (l.type === 'symbol') {
        paint(id, 'text-color', INK);
        paint(id, 'text-halo-color', '#FFFFFF');
        paint(id, 'text-halo-width', 1.6);
      }
    } catch (e) { /* skip layers that resist recolouring */ }
  });
}
map.on('style.load', recolor);

// --- UI ---
const statusEl = document.getElementById('status-note');
const statusTextEl = document.getElementById('status-text');
const sfxEl = document.getElementById('sfx');
const sfxWordEl = document.getElementById('sfx-word');
const pageEl = document.querySelector('.page');
let current = -1;
let popup = null;
let sfxTimer = null;

function setStatus(kind, text) {
  statusEl.classList.remove('loading', 'success', 'error');
  statusEl.classList.add(kind);
  statusTextEl.textContent = text;
}

function showSfx(word) {
  sfxWordEl.textContent = word;
  sfxEl.classList.remove('show');
  void sfxEl.offsetWidth; // restart the animation
  sfxEl.classList.add('show');
  clearTimeout(sfxTimer);
  sfxTimer = setTimeout(() => sfxEl.classList.remove('show'), 1200);
}

const markers = [];
const panels = [];

CHAPTERS.forEach((c, i) => {
  // Story panel
  const panel = document.createElement('article');
  panel.className = `story slot-${i + 1} tone-${c.tone}${i >= 4 ? ' wide' : ''}`;
  panel.tabIndex = 0;
  panel.setAttribute('role', 'button');
  panel.setAttribute('aria-label', `${c.caption}: ${c.name}`);
  panel.innerHTML = `<div class="caption">${c.caption}</div><p class="balloon">${c.say}</p><div class="art">${ART[c.art]}</div>`;
  panel.addEventListener('click', () => select(i));
  panel.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(i); }
  });
  pageEl.appendChild(panel);
  panels.push(panel);

  // Burst marker: the root element is Mapbox's; only the inner .mk is styled.
  const el = document.createElement('div');
  el.innerHTML = `<div class="mk" role="button" aria-label="${c.name}"><div class="pow"><span>${i + 1}</span></div></div>`;
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    select(i);
    panel.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
  });
  markers.push(new mapboxgl.Marker({ element: el, anchor: 'center' }).setLngLat(c.center).addTo(map));
});

function select(i) {
  current = i;
  const c = CHAPTERS[i];
  panels.forEach((p, k) => p.classList.toggle('active', k === i));
  markers.forEach((m, k) => m.getElement().firstElementChild.classList.toggle('active', k === i));
  setStatus('success', `Panel ${i + 1} of ${CHAPTERS.length}: ${c.name}`);

  const camera = { center: c.center, zoom: c.zoom, padding: PAD };
  if (reduceMotion) map.jumpTo(camera);
  else map.flyTo({ ...camera, duration: 1800, essential: false });

  if (popup) popup.remove();
  popup = new mapboxgl.Popup({ className: 'comic-popup', closeButton: false, offset: 26, maxWidth: '230px', focusAfterOpen: false })
    .setLngLat(c.center)
    .setHTML(`<span class="pop-title">${c.name}</span><span class="pop-text">${c.pop}</span>`)
    .addTo(map);

  showSfx(c.sfx);
}

document.getElementById('next-btn').addEventListener('click', () => {
  const next = (current + 1) % CHAPTERS.length;
  select(next);
  panels[next].scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
});

map.on('load', () => setStatus('success', 'Ready! Click a panel!'));
map.on('error', (e) => {
  if (statusEl.classList.contains('loading')) setStatus('error', 'Map failed to load');
});
</script>
</body>
</html>
