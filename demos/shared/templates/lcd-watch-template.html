<!--
  Working EXAMPLE of the LCD Watch style pack (lcd-watch.css, in this same
  folder). Open this file directly to see the pattern working: a morning
  run loop in Central Park, tracked on a chunky 1980s digital sports watch
  that floats over the map. Copy the markup below into your own demo and
  link lcd-watch.css from its <head> -- see the class/id contract documented
  at the top of that CSS file for what to build.

  This is a brand-new style, not extracted from an existing demo -- built
  from a design brief at the user's request for something distinct from
  every other pack in this folder. The watch brand ("Novatrack RUN-540") and
  all copy are fictional placeholders. The route is a real Mapbox Directions
  (walking) geometry for a Central Park loop, fetched once, simplified and
  embedded.

  What's NOT included: a real GPS/activity feed (the run is a simulation at
  1 s = 30 s), saving laps anywhere, or any elevation data (the watch is
  "ALTI-free" and the dot-matrix strip plots the route's north-south shape).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LCD Watch &mdash; Central Park morning run</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" rel="stylesheet" />
<link href="lcd-watch.css" rel="stylesheet" />
<script src="../demo-kit.js"></script>
<style>
  /* Demo-owned: every demo positions its own #map. */
  html, body { height: 100%; }
  body { overflow: hidden; }
  #map { position: absolute; inset: 0; }
  @media (max-width: 760px) {
    body { height: auto; overflow: auto; }
    #map { position: relative; inset: auto; height: 52dvh; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="plate">
  <h1>Morning Loop</h1>
  <div class="sub">Central Park, New York</div>
  <div class="hint" id="hint"></div>
  <div class="status-note loading" id="status" role="status" aria-live="polite">Loading route&hellip;</div>
</div>

<div class="watch-wrap">
  <div class="watch" id="watch">
    <div class="strap top"></div>
    <div class="case">
      <div class="print">
        <div class="brand">Novatrack<small>RUN-540</small></div>
        <div class="stripe"></div>
        <div class="legend yellow foot upper">Lap &middot; Split &middot; Pace</div>
        <div class="legend blue foot">Water res 50M &middot; Chrono</div>
      </div>

      <div class="side-btn left top">
        <div class="cap-wrap"><button class="cap" id="b-light" type="button" aria-label="Light: backlight and day or dawn" aria-pressed="false"></button></div>
        <span class="legend yellow" aria-hidden="true">Light</span>
      </div>
      <div class="side-btn left bottom">
        <div class="cap-wrap"><button class="cap" id="b-mode" type="button" aria-label="Mode: cycle screen"></button></div>
        <span class="legend blue" aria-hidden="true">Mode</span>
      </div>
      <div class="side-btn right top">
        <div class="cap-wrap"><button class="cap" id="b-start" type="button" aria-label="Start or stop"></button></div>
        <span class="legend orange" aria-hidden="true">Start/Stop</span>
      </div>
      <div class="side-btn right bottom">
        <div class="cap-wrap"><button class="cap" id="b-lap" type="button" aria-label="Lap or reset (hold to reset)"></button></div>
        <span class="legend blue" aria-hidden="true">Lap/Reset</span>
      </div>

      <div class="lcd-frame">
        <div class="lcd" id="lcd">
          <div class="lcd-status">
            <span class="mode" id="mode-tag">RUN</span>
            <span class="lapno" id="lapno">L01</span>
            <span class="rec" id="rec">REC</span>
          </div>

          <div class="screen" id="scr-0">
            <span class="seg seg-time" id="seg-time"><span class="ghost">88:88.8</span><span class="live" id="v-time">00:00.0</span></span>
            <div class="readouts">
              <div class="readout">
                <span class="cap-label">Dist</span>
                <span class="row"><span class="seg seg-num"><span class="ghost">8.88</span><span class="live" id="v-dist">0.00</span></span><span class="unit">km</span></span>
              </div>
              <div class="readout">
                <span class="cap-label">Pace</span>
                <span class="row"><span class="seg seg-num"><span class="ghost">8:88</span><span class="live" id="v-pace">-:--</span></span><span class="unit">/km</span></span>
              </div>
            </div>
            <canvas class="dotmap" id="dotmap" role="img" aria-label="Route progress strip"></canvas>
          </div>

          <div class="screen hidden" id="scr-1">
            <div class="lap-row" style="font-family:var(--font-print);font-size:.68em;letter-spacing:.14em"><span>LAP</span><span>SPLIT</span><span>PACE</span></div>
            <div id="laps"></div>
          </div>

          <div class="screen hidden" id="scr-2">
            <div class="stat-row"><span>Avg pace</span><span id="s-avg">-:--</span></div>
            <div class="stat-row"><span>Best lap</span><span id="s-best">-:--</span></div>
            <div class="stat-row"><span>Cadence</span><span id="s-cad">---</span></div>
            <div class="stat-row"><span>Kcal</span><span id="s-kcal">0</span></div>
            <div class="stat-row"><span>Loop done</span><span id="s-pct">0%</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="strap bottom"></div>
  </div>
</div>

<script>
const ROUTE = [[-73.97434,40.76821],[-73.97469,40.76823],[-73.97474,40.76834],[-73.97486,40.76843],[-73.97452,40.76851],[-73.97455,40.76877],[-73.9741,40.76911],[-73.97388,40.76946],[-73.97386,40.76959],[-73.97371,40.76973],[-73.97357,40.76978],[-73.97344,40.76978],[-73.97314,40.76964],[-73.97304,40.76976],[-73.9728,40.76965],[-73.97253,40.7696],[-73.97222,40.76963],[-73.97196,40.76971],[-73.97143,40.77004],[-73.97124,40.7703],[-73.97104,40.77071],[-73.97079,40.771],[-73.97047,40.77122],[-73.96994,40.77148],[-73.9698,40.77136],[-73.96918,40.77113],[-73.96884,40.77108],[-73.96871,40.77099],[-73.96847,40.77119],[-73.96835,40.7714],[-73.96808,40.77213],[-73.96765,40.77262],[-73.96749,40.7729],[-73.96729,40.7729],[-73.96722,40.77293],[-73.96701,40.7731],[-73.96701,40.77321],[-73.96712,40.77352],[-73.96694,40.77383],[-73.9664,40.77452],[-73.96622,40.77463],[-73.96592,40.77472],[-73.96585,40.77479],[-73.9658,40.7749],[-73.96577,40.77522],[-73.96573,40.7753],[-73.96549,40.77552],[-73.9655,40.77578],[-73.96539,40.77605],[-73.96497,40.77671],[-73.96466,40.77689],[-73.96438,40.77698],[-73.96428,40.777],[-73.96394,40.77692],[-73.96086,40.78113],[-73.96162,40.78145],[-73.9622,40.78153],[-73.96229,40.78169],[-73.96227,40.78179],[-73.96233,40.7818],[-73.96234,40.78193],[-73.96261,40.78207],[-73.96254,40.78216],[-73.96206,40.78201],[-73.96157,40.782],[-73.96128,40.78207],[-73.96094,40.78223],[-73.96072,40.78244],[-73.95972,40.7838],[-73.95963,40.78383],[-73.95938,40.7841],[-73.9593,40.78414],[-73.95925,40.78413],[-73.95918,40.78422],[-73.95893,40.78414],[-73.95723,40.78648],[-73.957,40.78692],[-73.95697,40.78723],[-73.95702,40.78773],[-73.95684,40.7884],[-73.95686,40.78861],[-73.95694,40.78881],[-73.95736,40.78933],[-73.95734,40.78972],[-73.95752,40.78976],[-73.95756,40.78957],[-73.95764,40.78949],[-73.95806,40.78951],[-73.95852,40.78939],[-73.95875,40.78937],[-73.959,40.78948],[-73.95924,40.78971],[-73.95942,40.78981],[-73.95955,40.78986],[-73.96011,40.78985],[-73.96064,40.78962],[-73.9611,40.78954],[-73.96149,40.78941],[-73.96258,40.78922],[-73.96292,40.78919],[-73.96337,40.78931],[-73.96395,40.7894],[-73.96497,40.78934],[-73.96525,40.78941],[-73.96552,40.78942],[-73.96589,40.7895],[-73.96605,40.78958],[-73.96602,40.78962],[-73.96627,40.78974],[-73.97371,40.77954],[-73.97373,40.77946],[-73.97377,40.77945],[-73.97416,40.77892],[-73.97421,40.7788],[-73.97397,40.77871],[-73.9772,40.77429],[-73.97704,40.77421],[-73.97691,40.7741],[-73.9769,40.77405],[-73.97696,40.77385],[-73.97716,40.77364],[-73.97722,40.77324],[-73.97713,40.77311],[-73.97682,40.77294],[-73.97694,40.77245],[-73.97731,40.7719],[-73.97695,40.77176],[-73.97716,40.77148],[-73.97742,40.77136],[-73.97756,40.77109],[-73.97757,40.77094],[-73.97785,40.77076],[-73.97805,40.77053],[-73.97818,40.77028],[-73.97815,40.76997],[-73.97808,40.76983],[-73.97795,40.76973],[-73.97757,40.76967],[-73.97722,40.76952],[-73.97664,40.76897],[-73.97637,40.76877],[-73.9754,40.76843],[-73.97522,40.7684],[-73.97486,40.76843],[-73.97474,40.76834],[-73.97469,40.76823],[-73.97434,40.76821]];
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEEDUP = 30;            // 1 real second = 30 s of run
const STEP_M = 500;            // reduced motion: metres per START press
const $ = (id) => document.getElementById(id);

/* ---------- route maths ---------- */
const cum = [0];
function hav(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b[1] - a[1]) * rad, dLng = (b[0] - a[0]) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * rad) * Math.cos(b[1] * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
for (let i = 1; i < ROUTE.length; i++) cum.push(cum[i - 1] + hav(ROUTE[i - 1], ROUTE[i]));
const TOTAL = cum[cum.length - 1];
function idxAt(d) {
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= d) lo = m; else hi = m; }
  return lo;
}
function pointAt(d) {
  d = Math.max(0, Math.min(TOTAL, d));
  const i = idxAt(d), seg = cum[i + 1] - cum[i] || 1, t = (d - cum[i]) / seg;
  const a = ROUTE[i], b = ROUTE[i + 1] || a;
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}
function sliceTo(d) {
  const i = idxAt(d);
  return ROUTE.slice(0, i + 1).concat([pointAt(d)]);
}
// pretend pace profile: ~5:30/km with gentle surges (m/s)
const speedAt = (d) => 3.05 * (1 + 0.12 * Math.sin(d / 420) + 0.05 * Math.sin(d / 130));

/* ---------- state ---------- */
let state = 'idle';            // idle | running | paused | done
let dist = 0, elapsed = 0, lapT0 = 0, lapD0 = 0, laps = [], screenNo = 0, lit = false;
let lastTs = 0, raf = 0, nextFollow = 0, followAfter = 0, curPace = 0;

const fmtT = (s) => {
  const m = Math.floor(s / 60), r = s - m * 60;
  return String(m).padStart(2, '0') + ':' + r.toFixed(1).padStart(4, '0');
};
const fmtP = (spk) => {
  if (!isFinite(spk) || spk <= 0 || spk > 5999) return '-:--';
  const m = Math.floor(spk / 60), r = Math.round(spk - m * 60);
  return (r === 60 ? m + 1 : m) + ':' + String(r === 60 ? 0 : r).padStart(2, '0');
};
function setStatus(txt, cls) {
  const el = $('status');
  el.textContent = txt;
  el.className = 'status-note ' + (cls || 'success');
}

/* ---------- map ---------- */
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  config: { basemap: { lightPreset: 'dawn', theme: 'monochrome', showPointOfInterestLabels: false } },
  center: [-73.9655, 40.7795],
  zoom: 13.5,
  attributionControl: true
});
new ResizeObserver(() => map.resize()).observe($('map'));

const desktop = () => window.innerWidth > 760;
function pad(follow) {
  if (!desktop()) return { top: 40, left: 36, right: 36, bottom: 70 };
  const w = $('watch').getBoundingClientRect().width;
  return { top: follow ? 60 : 70, left: follow ? 60 : 340, right: Math.round(w) + 70, bottom: 90 };
}
function fitLoop(instant) {
  const b = new mapboxgl.LngLatBounds();
  ROUTE.forEach((c) => b.extend(c));
  map.fitBounds(b, { padding: pad(false), pitch: 0, bearing: 0, duration: instant || reduce ? 0 : 1500 });
}

const runnerEl = document.createElement('div');
const runnerDot = document.createElement('div');
runnerDot.className = 'runner';
runnerEl.appendChild(runnerDot);
const runner = new mapboxgl.Marker({ element: runnerEl }).setLngLat(ROUTE[0]);

const emptyFC = { type: 'FeatureCollection', features: [] };
const lineFeat = (coords) => ({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords }, properties: {} });

map.on('load', () => {
  const kms = [];
  for (let k = 1; k <= Math.floor(TOTAL / 1000); k++) {
    kms.push({ type: 'Feature', geometry: { type: 'Point', coordinates: pointAt(k * 1000) }, properties: { n: String(k) } });
  }
  map.addSource('route', { type: 'geojson', data: lineFeat(ROUTE) });
  map.addSource('progress', { type: 'geojson', data: emptyFC });
  map.addSource('kms', { type: 'geojson', data: { type: 'FeatureCollection', features: kms } });
  map.addSource('sf', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'Point', coordinates: ROUTE[0] }, properties: { name: 'START / FINISH' } } });

  const w = (a, b) => ['interpolate', ['linear'], ['zoom'], 12, a, 16, b];
  const lineLayout = { 'line-cap': 'round', 'line-join': 'round' };
  map.addLayer({ id: 'route-case', type: 'line', source: 'route', slot: 'top', layout: lineLayout,
    paint: { 'line-color': '#F3F0E4', 'line-width': w(7, 15), 'line-emissive-strength': 1 } });
  map.addLayer({ id: 'route-base', type: 'line', source: 'route', slot: 'top', layout: lineLayout,
    paint: { 'line-color': '#1E2418', 'line-width': w(4, 9), 'line-emissive-strength': 1 } });
  map.addLayer({ id: 'route-progress', type: 'line', source: 'progress', slot: 'top', layout: lineLayout,
    paint: { 'line-color': '#FF7A1A', 'line-width': w(4, 9), 'line-emissive-strength': 1 } });
  map.addLayer({ id: 'km-dots', type: 'circle', source: 'kms', slot: 'top',
    paint: { 'circle-radius': 8, 'circle-color': '#121314', 'circle-stroke-color': '#F5D000', 'circle-stroke-width': 2, 'circle-emissive-strength': 1 } });
  map.addLayer({ id: 'km-nums', type: 'symbol', source: 'kms', slot: 'top',
    layout: { 'text-field': ['get', 'n'], 'text-font': ['DIN Pro Bold', 'Arial Unicode MS Bold'], 'text-size': 11, 'text-allow-overlap': true },
    paint: { 'text-color': '#F5D000', 'text-emissive-strength': 1 } });
  map.addLayer({ id: 'sf-dot', type: 'circle', source: 'sf', slot: 'top',
    paint: { 'circle-radius': 9, 'circle-color': '#FF7A1A', 'circle-stroke-color': '#121314', 'circle-stroke-width': 3, 'circle-emissive-strength': 1 } });
  map.addLayer({ id: 'sf-label', type: 'symbol', source: 'sf', slot: 'top',
    layout: { 'text-field': ['get', 'name'], 'text-font': ['DIN Pro Bold', 'Arial Unicode MS Bold'], 'text-size': 12, 'text-letter-spacing': 0.1,
      'text-variable-anchor': ['left', 'top', 'bottom'], 'text-radial-offset': 1.3 },
    paint: { 'text-color': '#121314', 'text-halo-color': '#F3F0E4', 'text-halo-width': 2, 'text-emissive-strength': 1 } });

  runner.addTo(map);
  fitLoop(true);
  setStatus('Ready — press START', 'success');
});

function drawProgress() {
  const src = map.getSource('progress');
  if (!src) return;
  src.setData(dist < 1 ? emptyFC : lineFeat(sliceTo(dist)));
  runner.setLngLat(pointAt(dist));
}

/* ---------- dot-matrix route strip ---------- */
const COLS = 36, ROWS = 5;
const profile = (() => {
  const v = [];
  for (let c = 0; c < COLS; c++) v.push(pointAt((c + 0.5) / COLS * TOTAL)[1]);
  const lo = Math.min(...v), hi = Math.max(...v);
  return v.map((y) => Math.round((hi - y) / (hi - lo) * (ROWS - 1)));   // north = top row
})();
function drawDots() {
  const cv = $('dotmap'), dpr = window.devicePixelRatio || 1;
  const cw = cv.clientWidth, ch = cv.clientHeight;
  if (!cw) return;
  if (cv.width !== Math.round(cw * dpr)) { cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr); }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, cw, ch);
  const cs = getComputedStyle($('lcd'));
  const ink = cs.getPropertyValue('--lcd-ink').trim() || '#1E2418';
  const ghost = cs.getPropertyValue('--lcd-ghost').trim() || 'rgba(30,36,24,.12)';
  const cwid = cw / COLS, chei = ch / ROWS, s = Math.min(cwid, chei) * 0.72;
  const cur = Math.min(COLS - 1, Math.floor(dist / TOTAL * COLS));
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      const x = c * cwid + (cwid - s) / 2, y = r * chei + (chei - s) / 2;
      const onLine = r === profile[c];
      const isCur = c === cur && dist > 0;
      if (isCur) { g.globalAlpha = 1; g.fillStyle = ink; }
      else if (onLine) { g.globalAlpha = c < cur && dist > 0 ? 1 : 0.35; g.fillStyle = ink; }
      else { g.globalAlpha = 1; g.fillStyle = ghost; }
      g.fillRect(x, y, s, s);
    }
  }
  g.globalAlpha = 1;
}

/* ---------- LCD readouts ---------- */
function render() {
  $('v-time').textContent = fmtT(elapsed);
  $('v-dist').textContent = (dist / 1000).toFixed(2);
  $('v-pace').textContent = state === 'idle' ? '-:--' : fmtP(curPace);
  $('lapno').textContent = 'L' + String(Math.min(99, laps.length + 1)).padStart(2, '0');
  $('rec').classList.toggle('on', state === 'running');
  $('b-start').setAttribute('aria-label', state === 'running' ? 'Stop' : 'Start');
  drawDots();
  renderLaps();
  renderStats();
}
function renderLaps() {
  const box = $('laps');
  if (!laps.length) { box.innerHTML = '<div class="lap-empty">NO LAPS</div>'; return; }
  box.innerHTML = laps.slice(-5).reverse().map((l) =>
    `<div class="lap-row"><span>L${String(l.n).padStart(2, '0')}</span><span>${fmtT(l.t)}</span><span>${fmtP(l.pace)}</span></div>`).join('');
}
function renderStats() {
  const avg = dist > 50 ? elapsed / (dist / 1000) : NaN;
  $('s-avg').textContent = fmtP(avg);
  $('s-best').textContent = laps.length ? fmtP(Math.min(...laps.map((l) => l.pace))) : '-:--';
  $('s-cad').textContent = dist > 50 ? String(168 + Math.round(4 * Math.sin(elapsed / 9))) : '---';
  $('s-kcal').textContent = String(Math.round(dist / 1000 * 68));
  $('s-pct').textContent = Math.round(dist / TOTAL * 100) + '%';
}
function showScreen(n) {
  screenNo = n;
  [0, 1, 2].forEach((i) => $('scr-' + i).classList.toggle('hidden', i !== n));
  $('mode-tag').textContent = ['RUN', 'LAPS', 'STAT'][n];
  if (n === 0) drawDots();
}

/* fit the big time inside the glass whatever width Doto turns out to be */
function fitTime() {
  const t = $('seg-time'), lcd = $('lcd');
  t.style.fontSize = '';
  const cs = getComputedStyle(lcd);
  const avail = lcd.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const w = t.offsetWidth;
  if (w > avail) t.style.fontSize = (parseFloat(getComputedStyle(t).fontSize) * avail / w / parseFloat(cs.fontSize) * 0.98) + 'em';
}

/* ---------- run engine ---------- */
function recordLap(final) {
  const t = elapsed - lapT0, d = dist - lapD0;
  if (d < 20) return;
  laps.push({ n: laps.length + 1, t, pace: t / (d / 1000) });
  lapT0 = elapsed; lapD0 = dist;
  setStatus((final ? 'Final split ' : 'Lap ' + laps.length + ' ') + fmtT(laps[laps.length - 1].t) + ' · ' + fmtP(laps[laps.length - 1].pace) + '/km');
}
function follow(now, force) {
  if (!force && now < nextFollow) return;
  nextFollow = now + 280;
  const o = { center: pointAt(dist), padding: pad(true) };
  if (reduce) map.jumpTo(o); else map.easeTo({ ...o, duration: 300, easing: (t) => t, essential: false });
}
function beginFollow() {
  const o = { center: pointAt(dist), zoom: 15.3, pitch: 50, padding: pad(true) };
  if (reduce) { map.jumpTo(o); followAfter = 0; }
  else { map.easeTo({ ...o, duration: 1200 }); followAfter = performance.now() + 1300; }
}
function finish() {
  dist = TOTAL;
  recordLap(true);
  state = 'done';
  cancelAnimationFrame(raf);
  drawProgress(); render();
  setStatus('Finish ' + (TOTAL / 1000).toFixed(2) + ' km in ' + fmtT(elapsed), 'success');
  setTimeout(() => fitLoop(false), 900);
}
function tick(ts) {
  if (state !== 'running') return;
  const dt = Math.min((ts - lastTs) / 1000, 0.1);
  lastTs = ts;
  const sp = speedAt(dist), dr = dt * SPEEDUP;
  dist += sp * dr; elapsed += dr;
  curPace += (1000 / sp - curPace) * 0.08;
  if (dist >= TOTAL) { finish(); return; }
  drawProgress(); render();
  if (ts > followAfter) follow(ts, false);
  raf = requestAnimationFrame(tick);
}
function stepOnce() {
  if (state === 'done') return;
  const sp = speedAt(dist);
  const ds = Math.min(STEP_M, TOTAL - dist);
  const fresh = dist === 0;
  elapsed += ds / sp; dist += ds; curPace = 1000 / sp; state = 'paused';
  if (dist >= TOTAL - 1) { finish(); return; }
  drawProgress(); render();
  if (fresh) beginFollow(); else follow(0, true);
  setStatus('Step ' + (dist / 1000).toFixed(1) + ' km', 'success');
}
function toggleRun() {
  if (state === 'done') { setStatus('Finished — hold LAP/RESET', 'success'); return; }
  if (reduce) { stepOnce(); return; }
  if (state === 'running') {
    state = 'paused'; cancelAnimationFrame(raf); render(); setStatus('Paused', 'loading');
  } else {
    const fresh = dist === 0;
    state = 'running'; lastTs = performance.now(); curPace = curPace || 1000 / speedAt(dist);
    if (fresh || !map.isMoving()) beginFollow();
    setStatus('Running — 1 s = 30 s', 'success');
    render();
    raf = requestAnimationFrame(tick);
  }
}
function reset() {
  cancelAnimationFrame(raf);
  state = 'idle'; dist = 0; elapsed = 0; lapT0 = 0; lapD0 = 0; laps = []; curPace = 0;
  drawProgress(); render(); fitLoop(false);
  setStatus('Reset — press START', 'success');
}
function lapOrReset() {
  if (reduce) { if (state === 'done' || dist === 0) reset(); else recordLap(false); render(); return; }
  if (state === 'running') { recordLap(false); render(); } else reset();
}
function toggleLight() {
  lit = !lit;
  $('watch').classList.toggle('is-lit', lit);
  $('b-light').setAttribute('aria-pressed', String(lit));
  try { map.setConfigProperty('basemap', 'lightPreset', lit ? 'day' : 'dawn'); } catch (e) { /* style not ready */ }
  drawDots();
  setStatus(lit ? 'Backlight on · day' : 'Backlight off · dawn', 'success');
}

/* ---------- buttons ---------- */
$('b-light').addEventListener('click', toggleLight);
$('b-mode').addEventListener('click', () => showScreen((screenNo + 1) % 3));
$('b-start').addEventListener('click', toggleRun);

let holdTimer = 0, held = false;
const lapBtn = $('b-lap');
lapBtn.addEventListener('pointerdown', () => {
  held = false;
  holdTimer = setTimeout(() => { held = true; reset(); }, 700);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => lapBtn.addEventListener(ev, () => clearTimeout(holdTimer)));
lapBtn.addEventListener('click', () => { if (held) { held = false; return; } lapOrReset(); });

/* ---------- boot ---------- */
$('hint').innerHTML = reduce
  ? '<b>START</b> steps 500 m. <b>LAP</b> records a split. Hold <b>LAP/RESET</b> to reset.'
  : '<b>START</b> runs the loop (1 s = 30 s). <b>LAP</b> splits. Press <b>LAP/RESET</b> when stopped, or hold it, to reset.';
showScreen(0);
render();
document.fonts.ready.then(() => { fitTime(); drawDots(); });
window.addEventListener('resize', () => { fitTime(); drawDots(); });
</script>
</body>
</html>
