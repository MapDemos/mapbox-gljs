<!--
  Working EXAMPLE of the Trading Card style pack (trading-card.css, in this
  same folder). Open this file directly to see the pattern working with a
  nine-card collector's series on the lighthouses of Brittany, France, on
  Mapbox Standard (dusk light). A black-vinyl binder page on the left holds
  a 3x3 grid of holographic cards in translucent pockets (foil border, rarity
  stars, three stat bars, a card number like 07/09; the foil sheen follows
  the pointer). The map sits on the right. Click a card (or its numbered
  marker on the map): the card lifts out of its pocket, the map flies there
  and draws the light's range as a translucent circle with a rotating beam.
  Click the lifted card again to flip it over for the back. Copy the markup
  below into your own demo and link trading-card.css from its <head> -- see
  the class/id contract documented at the top of that CSS file.

  This is a brand-new style, not extracted from an existing demo -- built
  from a design brief (collectible holo trading cards in a binder). The
  lighthouses are real public landmarks with approximate coordinates; the
  series name, rarity ratings, blurbs and all artwork (hand-written inline
  SVG generated from a few parameters) are fictional placeholders -- swap in
  your own. Height, range and first-lit figures are rounded illustrations.

  What's NOT included: search/geocoding, routing, popups, a persistence
  layer for the "collection", or a hard-coded access token (demo-kit.js sets
  that).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trading Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Archivo+Narrow:wght@400;600;700&display=swap" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" rel="stylesheet" />
<link href="trading-card.css" rel="stylesheet" />
<script src="../demo-kit.js"></script>
<style>
  /* Demo-owned: every demo positions its own #map. */
  #map { position: absolute; inset: 0; }
</style>
</head>
<body>
<div class="app">
  <main class="binder">
    <header class="binder-head">
      <div>
        <h1>Beacon Coast</h1>
        <p class="series">Series 01 &middot; Lighthouses of Brittany &middot; 9 cards</p>
      </div>
      <div class="head-actions">
        <p class="status-note" id="status-note"><span id="status-text">Collected 0 / 9</span></p>
        <button class="btn btn-secondary" type="button" id="whole-btn">Show all</button>
      </div>
    </header>
    <section class="sheet">
      <div class="rings" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>
  <div class="map-pane"><div id="map"></div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const phone = () => window.matchMedia('(max-width: 820px)').matches;

/* ---- Cards: real lighthouses, approximate coordinates; stats/blurbs are illustrative ---- */
// art: tower shape + stripes + base for the inline SVG; fan: pixel offset that separates bunched pins when zoomed out
const CARDS = [
  { name: "Créac'h", type: 'Island', stars: 5, h: 55, nm: 32, year: 1863, coord: [-5.1186, 48.4514], fan: [-18, 6],
    loc: 'Ouessant', text: 'Among the most powerful beams in Europe, sweeping the busy shipping lane off Ouessant. Its black and white bands are a collector favourite.',
    art: { base: 'island', th: 44, bw: 15, tw: 10, n: 6, c1: '#F4F7FB', c2: '#1A1C22', roof: '#1A1C22' } },
  { name: 'Ar-Men', type: 'Offshore', stars: 5, h: 33, nm: 23, year: 1881, coord: [-4.9983, 48.0597], fan: [0, 0],
    loc: 'Chaussée de Sein', text: 'Built on a bare reef beyond Sein and nicknamed hell of hells by its builders. Fourteen years of work, and waves still wash over the door.',
    art: { base: 'rock', th: 34, bw: 14, tw: 10, n: 3, c1: '#9AA0AB', c2: '#F4F7FB', roof: '#1A1C22' } },
  { name: 'Kéréon', type: 'Offshore', stars: 4, h: 38, nm: 21, year: 1916, coord: [-5.0292, 48.4286], fan: [18, 16],
    loc: 'Ushant Sound', text: 'A slender rock tower guarding the Fromveur passage. Keepers were once nicknamed the kings of Kéréon for its well-stocked rooms.',
    art: { base: 'rock', th: 40, bw: 12, tw: 8, n: 4, c1: '#D9DEE6', c2: '#8F99A9', roof: '#E5484D' } },
  { name: 'Eckmühl', type: 'Headland', stars: 4, h: 60, nm: 23, year: 1897, coord: [-4.3769, 47.7981], fan: [0, 0],
    loc: 'Penmarc’h', text: 'A tall granite tower with a spiral staircase of 307 steps and a bright lantern room. Showpiece of the south coast.',
    art: { base: 'cliff', th: 48, bw: 13, tw: 9, n: 2, c1: '#F4F7FB', c2: '#1A1C22', roof: '#1A1C22' } },
  { name: 'Île Vierge', type: 'Island', stars: 5, h: 83, nm: 27, year: 1902, coord: [-4.5667, 48.6383], fan: [0, 0],
    loc: 'Pays Pagan', text: 'The tallest stone lighthouse in Europe, clad in glazed tiles on the inside. A true legend card: rare, tall and always in demand.',
    art: { base: 'island', th: 56, bw: 11, tw: 7, n: 9, c1: '#B4BCC8', c2: '#8D96A4', roof: '#1A1C22' } },
  { name: 'Stiff', type: 'Island', stars: 3, h: 30, nm: 24, year: 1700, coord: [-5.0556, 48.4764], fan: [6, -20],
    loc: 'Ouessant', text: 'One of the oldest lights on the list, perched on a high cliff on the north-east of Ouessant. Two round towers, one calm sentinel.',
    art: { base: 'cliff', th: 30, bw: 16, tw: 12, n: 1, c1: '#F4F7FB', c2: '#F4F7FB', roof: '#E5484D' } },
  { name: 'La Vieille', type: 'Offshore', stars: 4, h: 27, nm: 18, year: 1887, coord: [-4.7578, 48.0406], fan: [0, 0],
    loc: 'Raz de Sein', text: 'The old lady of the Raz de Sein, a compact tower in a tide race that never quite sits still. Its partner light stands nearby on its own rock.',
    art: { base: 'rock', th: 32, bw: 15, tw: 11, n: 2, c1: '#F4F7FB', c2: '#2B2E36', roof: '#E5484D' } },
  { name: 'Men Ruz', type: 'Headland', stars: 2, h: 10, nm: 13, year: 1948, coord: [-3.4856, 48.8369], fan: [0, 0],
    loc: 'Ploumanac’h', text: 'A pocket-sized tower among pink granite boulders on the Pink Granite Coast. Small, sweet and easy to love, especially at sunset.',
    art: { base: 'boulders', th: 20, bw: 15, tw: 12, n: 3, c1: '#EBB3A0', c2: '#DC8F78', roof: '#E5484D' } },
  { name: 'Grand Jardin', type: 'Offshore', stars: 3, h: 24, nm: 15, year: 1939, coord: [-2.0708, 48.6747], fan: [0, 0],
    loc: 'Bay of Saint-Malo', text: 'A rock-top light standing guard at the entrance to the corsair port of Saint-Malo. Its red and white stripes are easy to spot from the ramparts.',
    art: { base: 'rock', th: 32, bw: 14, tw: 10, n: 4, c1: '#F4F7FB', c2: '#E5484D', roof: '#1A1C22' } },
];
const TOTAL = CARDS.length;
const pad2 = (n) => String(n).padStart(2, '0');

/* ---- Inline SVG lighthouse art (parametric: stripes, taper, base) ---- */
function lighthouseSVG(a, i) {
  const cx = 50, by = a.base === 'rock' ? 52 : 50;
  const wAt = (y) => a.bw + (a.tw - a.bw) * ((by - y) / a.th);
  let bands = '';
  for (let k = 0; k < a.n; k++) {
    const y0 = by - (a.th * k) / a.n, y1 = by - (a.th * (k + 1)) / a.n;
    const w0 = wAt(y0) / 2, w1 = wAt(y1) / 2;
    bands += `<polygon points="${cx - w0},${y0} ${cx + w0},${y0} ${cx + w1},${y1} ${cx - w1},${y1}" fill="${k % 2 ? a.c2 : a.c1}"/>`;
  }
  const top = by - a.th, tw = a.tw / 2;
  const stars = [[12, 8], [30, 14], [74, 6], [88, 18], [60, 12], [20, 26]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="0.7" fill="#F4F7FB" opacity="0.8"/>`).join('');
  const waves = `<path d="M0 62 Q8 59 16 62 T32 62 T48 62 T64 62 T80 62 T100 62" fill="none" stroke="#7FE3FF" stroke-opacity="0.45" stroke-width="0.9"/>
    <path d="M0 68 Q8 65 16 68 T32 68 T48 68 T64 68 T80 68 T100 68" fill="none" stroke="#7FE3FF" stroke-opacity="0.3" stroke-width="0.9"/>`;
  let base = '';
  if (a.base === 'rock') base = `<polygon points="30,62 36,52 44,50 58,51 66,54 74,62" fill="#2A2F3A"/><polygon points="36,52 44,50 52,56 40,60" fill="#3C4352"/><path d="M26 62 Q34 56 40 62 M60 62 Q68 55 76 62" fill="none" stroke="#F4F7FB" stroke-width="1.2" opacity="0.8"/>`;
  if (a.base === 'island') base = `<path d="M10 62 Q20 52 36 50 L66 50 Q82 52 92 62 Z" fill="#2F6B4A"/><path d="M10 62 Q20 56 36 55 L66 55 Q82 56 92 62 Z" fill="#244F3A"/>`;
  if (a.base === 'cliff') base = `<path d="M0 36 L22 34 L34 44 L38 50 L100 50 L100 70 L0 70 Z" fill="#3B4252"/><path d="M0 36 L22 34 L34 44 L38 50 L100 50 L100 53 L38 53 L32 47 L22 38 L0 40 Z" fill="#3C7A55"/>`;
  if (a.base === 'boulders') base = `<ellipse cx="34" cy="54" rx="16" ry="9" fill="#C97A68"/><ellipse cx="64" cy="55" rx="18" ry="8" fill="#B96B5A"/><ellipse cx="50" cy="52" rx="14" ry="5" fill="#E1A08F"/>`;
  const tx = a.base === 'cliff' ? 4 : 0;
  return `<svg viewBox="0 0 100 76" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="100" height="76" fill="#0D1B3A"/><rect y="26" width="100" height="30" fill="#24336B"/><rect y="42" width="100" height="16" fill="#6B4E8F" opacity="0.7"/><rect y="50" width="100" height="14" fill="#E98E7A" opacity="0.5"/>
    ${stars}<circle cx="82" cy="30" r="7" fill="#FFD27A" opacity="0.9"/>
    <rect y="58" width="100" height="18" fill="#0C2B4D"/>${waves}
    <g transform="translate(${tx} 0)">${base}
      <polygon points="${cx - a.bw / 2 - 1.5},${by} ${cx + a.bw / 2 + 1.5},${by} ${cx + a.bw / 2},${by - 2} ${cx - a.bw / 2},${by - 2}" fill="#2A2F3A"/>
      ${bands}
      <rect x="${cx - tw - 2.2}" y="${top - 1.6}" width="${a.tw + 4.4}" height="1.8" fill="#1A1C22"/>
      <rect x="${cx - tw + 0.6}" y="${top - 6.4}" width="${a.tw - 1.2}" height="4.8" fill="#FFD27A"/>
      <circle cx="${cx}" cy="${top - 4}" r="9" fill="#FFD27A" opacity="0.28"/>
      <polygon points="${cx - tw - 0.6},${top - 6.4} ${cx + tw + 0.6},${top - 6.4} ${cx},${top - 11}" fill="${a.roof}"/>
      <polygon points="${cx + tw},${top - 4} 100,${top - 12} 100,${top + 4}" fill="#FFD27A" opacity="0.16"/>
    </g></svg>`;
}

function starsHTML(n) {
  return Array.from({ length: 5 }, (_, k) => `<span class="star${k < n ? '' : ' off'}"></span>`).join('');
}
const pct = (v, max) => Math.max(6, Math.min(100, Math.round((v / max) * 100)));

function cardHTML(c, i) {
  const age = pct(2000 - c.year, 310); // older = longer bar
  return `<div class="pocket"><div class="card" role="button" tabindex="0" aria-pressed="false"
      aria-label="Card ${pad2(i + 1)} of ${pad2(TOTAL)}: ${c.name}. Press to select, press again to flip.">
    <div class="lift"><div class="flip">
      <div class="face front"><div class="face-in">
        <div class="c-head"><h2 class="c-name">${c.name}</h2><span class="c-num">${pad2(i + 1)}/${pad2(TOTAL)}</span></div>
        <div class="c-art"><span class="c-badge t-${c.type.toLowerCase()}">${c.type}</span>${lighthouseSVG(c.art, i)}</div>
        <div class="c-stars" role="img" aria-label="Rarity ${c.stars} of 5">${starsHTML(c.stars)}</div>
        <div class="stats">
          <div class="stat"><span class="stat-l">Height</span><span class="stat-v">${c.h} m</span><div class="bar"><i style="--w:${pct(c.h, 90)}%"></i></div></div>
          <div class="stat"><span class="stat-l">Range</span><span class="stat-v">${c.nm} nm</span><div class="bar"><i style="--w:${pct(c.nm, 35)}%"></i></div></div>
          <div class="stat"><span class="stat-l">Year lit</span><span class="stat-v">${c.year}</span><div class="bar"><i style="--w:${age}%"></i></div></div>
        </div>
        <div class="holo"></div>
      </div></div>
      <div class="face back"><div class="face-in">
        <svg class="b-emblem" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#FFD27A" stroke-width="3"/><polygon points="50,50 96,30 96,70" fill="#FFD27A" opacity="0.35"/><polygon points="50,50 4,34 4,66" fill="#7FE3FF" opacity="0.25"/><polygon points="44,78 56,78 53,36 47,36" fill="#F4F7FB"/><rect x="45" y="28" width="10" height="9" fill="#FFD27A"/><polygon points="43,28 57,28 50,20" fill="#E5484D"/></svg>
        <h2 class="b-title">${c.name}</h2>
        <p class="b-meta">${c.loc} &middot; ${c.coord[1].toFixed(2)}&deg;N</p>
        <p class="b-text">${c.text}</p>
        <p class="b-foot">Beacon Coast &middot; ${pad2(i + 1)}/${pad2(TOTAL)}</p>
        <div class="holo"></div>
      </div></div>
    </div></div></div></div>`;
}

/* ---- Map ---- */
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  config: { basemap: { lightPreset: 'dusk', showPointOfInterestLabels: false } },
  center: [-3.9, 48.4],
  zoom: 7,
  attributionControl: true,
});
map.addControl(new mapboxgl.NavigationControl({ showZoom: false }), 'top-right');
new ResizeObserver(() => map.resize()).observe($('map'));

const R_EARTH = 6371;
const NM_KM = 1.852;
function dest([lng, lat], bearingDeg, km) {
  const d = km / R_EARTH, b = bearingDeg * Math.PI / 180, p1 = lat * Math.PI / 180, l1 = lng * Math.PI / 180;
  const p2 = Math.asin(Math.sin(p1) * Math.cos(d) + Math.cos(p1) * Math.sin(d) * Math.cos(b));
  const l2 = l1 + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(p1), Math.cos(d) - Math.sin(p1) * Math.sin(p2));
  return [((l2 * 180 / Math.PI + 540) % 360) - 180, p2 * 180 / Math.PI];
}
function circlePoly(c, km, n = 96) {
  const ring = [];
  for (let k = 0; k <= n; k++) ring.push(dest(c, (k / n) * 360, km));
  return ring;
}
function wedge(c, km, bearing, width = 16) {
  const ring = [c];
  for (let k = 0; k <= 10; k++) ring.push(dest(c, bearing - width / 2 + (width * k) / 10, km));
  ring.push(c);
  return ring;
}
const fc = (features) => ({ type: 'FeatureCollection', features });
const poly = (ring) => ({ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [ring] } });
const line = (a, b) => ({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [a, b] } });

let current = -1;
const collected = new Set();
const cardEls = [], pocketEls = [], pinEls = [], markers = [];

function fitAll(instant) {
  const b = new mapboxgl.LngLatBounds();
  CARDS.forEach((c) => b.extend(c.coord));
  const p = phone();
  map.fitBounds(b, {
    padding: p ? { top: 44, bottom: 70, left: 36, right: 36 } : { top: 50, bottom: 64, left: 50, right: 50 },
    bearing: 0, pitch: 0, maxZoom: 10,
    duration: instant || reduce ? 0 : 1600, essential: true,
  });
}

function showRange(i) {
  const c = CARDS[i], km = c.nm * NM_KM;
  const ring = circlePoly(c.coord, km);
  map.getSource('tc-range')?.setData(fc([poly(ring)]));
  const b = new mapboxgl.LngLatBounds();
  ring.forEach((pt) => b.extend(pt));
  map.fitBounds(b, {
    padding: phone() ? { top: 24, bottom: 64, left: 24, right: 24 } : { top: 50, bottom: 80, left: 50, right: 50 },
    maxZoom: 11, pitch: 0, duration: reduce ? 0 : 1800, essential: true,
  });
}

/* ---- Rotating beam: a wedge + ray recomputed each frame (static for reduced motion) ---- */
let raf = 0;
function drawBeam(t) {
  if (current < 0) return;
  const c = CARDS[current], km = c.nm * NM_KM;
  const ang = reduce ? 40 : ((t / 7000) * 360) % 360;
  map.getSource('tc-beam')?.setData(fc([poly(wedge(c.coord, km, ang))]));
  map.getSource('tc-ray')?.setData(fc([line(c.coord, dest(c.coord, ang, km))]));
}
function loop(t) {
  drawBeam(t);
  raf = reduce ? 0 : requestAnimationFrame(loop);
}
function startBeam() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}
function clearBeam() {
  cancelAnimationFrame(raf);
  ['tc-range', 'tc-beam', 'tc-ray'].forEach((s) => map.getSource(s)?.setData(fc([])));
}

/* ---- Selection: first click selects, a second click flips ---- */
function select(i, fromMarker) {
  const same = i === current;
  if (same && !fromMarker) {
    const flipped = cardEls[i].classList.toggle('is-flipped');
    cardEls[i].setAttribute('aria-pressed', String(flipped));
    return;
  }
  if (same) return;
  current = i;
  cardEls.forEach((el, k) => {
    el.classList.toggle('is-active', k === i);
    el.classList.remove('is-flipped');
    el.setAttribute('aria-pressed', k === i ? 'true' : 'false');
    pocketEls[k].classList.toggle('is-active', k === i);
  });
  pinEls.forEach((el, k) => el.classList.toggle('on', k === i));
  collected.add(i);
  const n = $('status-note');
  n.className = 'status-note' + (collected.size === TOTAL ? ' success' : '');
  $('status-text').textContent = collected.size === TOTAL ? `Set complete! ${TOTAL} / ${TOTAL}` : `Collected ${collected.size} / ${TOTAL}`;
  showRange(i);
  startBeam();
  if (fromMarker) cardEls[i].scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
}

function deselect() {
  current = -1;
  cardEls.forEach((el, k) => {
    el.classList.remove('is-active', 'is-flipped');
    el.setAttribute('aria-pressed', 'false');
    pocketEls[k].classList.remove('is-active');
  });
  pinEls.forEach((el) => el.classList.remove('on'));
  clearBeam();
}

/* ---- Build cards ---- */
$('grid').innerHTML = CARDS.map(cardHTML).join('');
document.querySelectorAll('.card').forEach((el, i) => {
  cardEls.push(el);
  pocketEls.push(el.closest('.pocket'));
  el.addEventListener('click', () => select(i, false));
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(i, false); }
  });
  // foil shimmer follows the pointer (left at 0.5/0.5 for reduced motion)
  if (!reduce) {
    el.addEventListener('pointermove', (e) => {
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)).toFixed(3));
      el.style.setProperty('--my', Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)).toFixed(3));
    });
    el.addEventListener('pointerleave', () => {
      el.style.setProperty('--mx', '0.5');
      el.style.setProperty('--my', '0.5');
    });
  }
});

/* ---- Markers: foil-ringed numbers; the Ouessant trio is fanned apart while zoomed out ---- */
CARDS.forEach((c, i) => {
  const root = document.createElement('div'); // never style the Marker root
  root.innerHTML = `<div class="pin" title="${c.name}"><span>${pad2(i + 1)}</span></div>`;
  root.addEventListener('click', () => select(i, true));
  pinEls.push(root.firstChild);
  markers.push(new mapboxgl.Marker({ element: root, offset: c.fan }).setLngLat(c.coord).addTo(map));
});
let fanned = true;
function updateFan() {
  const want = map.getZoom() < 10;
  if (want === fanned) return;
  fanned = want;
  markers.forEach((m, i) => m.setOffset(want ? CARDS[i].fan : [0, 0]));
}
map.on('zoom', updateFan);

/* ---- Layers: translucent range disc + rotating beam, all emissive ---- */
map.on('style.load', () => {
  map.addSource('tc-range', { type: 'geojson', data: fc([]) });
  map.addSource('tc-beam', { type: 'geojson', data: fc([]) });
  map.addSource('tc-ray', { type: 'geojson', data: fc([]) });
  map.addLayer({ id: 'tc-range-fill', type: 'fill', source: 'tc-range', slot: 'top',
    paint: { 'fill-color': '#7FE3FF', 'fill-opacity': 0.16, 'fill-emissive-strength': 1 } });
  map.addLayer({ id: 'tc-range-line', type: 'line', source: 'tc-range', slot: 'top',
    paint: { 'line-color': '#C69CFF', 'line-width': 2.5, 'line-emissive-strength': 1 } });
  map.addLayer({ id: 'tc-beam-fill', type: 'fill', source: 'tc-beam', slot: 'top',
    paint: { 'fill-color': '#FFD27A', 'fill-opacity': 0.4, 'fill-emissive-strength': 1 } });
  map.addLayer({ id: 'tc-ray-line', type: 'line', source: 'tc-ray', slot: 'top',
    paint: { 'line-color': '#FFF3C4', 'line-width': 2, 'line-emissive-strength': 1 } });
  if (current >= 0) { showRange(current); startBeam(); } else fitAll(true);
});

map.on('error', (e) => {
  const n = $('status-note');
  n.className = 'status-note error';
  $('status-text').textContent = 'Map error: ' + ((e.error && e.error.message) || 'unknown');
});

$('whole-btn').addEventListener('click', () => { deselect(); fitAll(false); });
</script>
</body>
</html>
