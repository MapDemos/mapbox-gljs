<!--
  Working EXAMPLE of the Seed Packet style pack (seed-packet.css, in this
  same folder). Open this file directly to see the pattern working with six
  fictional farm stands around Burlington, Vermont on Mapbox Standard (day
  light, warmed colours). The map sits in a rounded window on a kraft board;
  below it a wire store rack holds six seed packets (inline-SVG
  chromolithograph-style art). Pick a packet (or a packet-shaped marker on
  the map): the packet lifts and tears open, a back-of-packet panel slides
  out with the farm details and a 12-month sow / grow / harvest calendar,
  and the map flies there. "Plan a farm loop" draws a driving loop through
  all six stands. Copy the markup below into your own demo and link
  seed-packet.css from its <head> -- see the class/id contract documented at
  the top of that CSS file.

  This is a brand-new style, not extracted from an existing demo -- built
  from a design brief (vintage garden seed packets) at the user's request
  for something distinct from every other pack in this folder. The towns are
  real; "Hollow Creek Seed Co.", the farms, varieties and calendars are
  fictional placeholders -- swap in your own. All art is hand-written inline
  SVG; the loop geometry is a one-time Mapbox Directions (driving) result
  embedded as coordinates.

  What's NOT included: live routing, search/geocoding, popups, or a
  hard-coded access token (demo-kit.js sets that).
-->

<body class="seed-page">

<section class="map-frame">
  <header class="seed-header">
    <div>
      <h1>Hollow Creek Seed Co.</h1>

    </div>
    <div class="seed-actions">

  <div class="rack"><div class="rack-row" id="packet-rack"></div></div>

function setStatus(kind, icon, text) {
  statusEl.className = 'status-note' + (kind ? ' ' + kind : '');
  statusEl.querySelector('.status-icon').textContent = icon;
  statusText.textContent = text;
}

function padding() {
  return innerWidth <= 760
    ? { top: 36, bottom: 64, left: 28, right: 28 }
    : { top: 50, bottom: 70, left: 60, right: 60 };
}

function fitTo(coords, instant) {
  const b = coords.reduce((acc, c) => acc.extend(c), new mapboxgl.LngLatBounds(coords[0], coords[0]));
  map.fitBounds(b, { padding: padding(), duration: instant || reduce ? 0 : 1400, maxZoom: 12 });
}

// Packets (rack) + markers (map) share one selection
FARMS.forEach((f, i) => {
  const b = document.createElement('button');
  b.className = 'packet';
  b.type = 'button';
  b.style.setProperty('--pk', f.pk);
  b.setAttribute('aria-pressed', 'false');
  b.setAttribute('aria-label', f.variety + ', ' + f.farm + ', ' + f.town);

  new mapboxgl.Marker({ element: root, anchor: 'bottom' }).setLngLat(f.lngLat).addTo(map);

});

function renderBack(f) {
  let bars = '', months = '';
  for (let m = 0; m < 12; m++) {
    const ph = PHASE_NAME[f.cal[m]];
    bars += '<div class="cal-col"><div class="cal-bar" data-phase="' + ph + '" title="' + MONTHS[m] + ': ' + ph + '"></div></div>';
    months += '<span class="cal-month">' + MONTHS[m] + '</span>';
  }
  backEl.classList.remove('is-empty');
  backEl.style.setProperty('--pk', f.pk === '#D6A62C' ? '#9A7410' : f.pk);
  backEl.innerHTML = '<button class="back-close" type="button" aria-label="Close packet">&times;</button>' +
    '<span class="back-label">Directions on back &middot; ' + f.town + ', Vermont</span>' +
    '<h2 class="back-title">' + f.variety + '</h2>' +
    '<p class="back-meta">' + f.farm + ' &middot; ' + f.hours + '</p>' +
    '<p class="back-lead">' + f.blurb + '</p>' +
    '<span class="back-label">Planting calendar</span>' +
    '<div class="calendar" role="img" aria-label="Sow, grow and harvest months">' + bars + '</div>' +
    '<div class="calendar-months">' + months + '</div>' +
    '<div class="cal-legend"><span><i class="swatch sow"></i>Sow</span><span><i class="swatch grow"></i>Grow</span><span><i class="swatch harvest"></i>Harvest</span></div>';
  backEl.querySelector('.back-close').addEventListener('click', closePacket);
  if (!reduce) {
    backEl.classList.remove('is-entering');
    void backEl.offsetWidth;
    backEl.classList.add('is-entering');
  }
}

    el.classList.toggle('is-open', k === i);
    el.setAttribute('aria-pressed', k === i ? 'true' : 'false');
  });
  markerEls.forEach((m, k) => {
    m.inner.classList.toggle('is-selected', k === i);
    m.root.style.zIndex = k === i ? 2 : '';
  });
  renderBack(f);
  setStatus('success', '✓', f.town + ' – packet opened.');
  if (innerWidth <= 760) {
    const row = rackEl, el = packetEls[i];
    row.scrollTo({ left: el.offsetLeft - (row.clientWidth - el.offsetWidth) / 2, behavior: reduce ? 'auto' : 'smooth' });
  }
  if (fly) {
    const o = { center: f.lngLat, zoom: 11.5, padding: padding() };
    if (reduce) map.jumpTo(o); else map.flyTo({ ...o, duration: 1800, essential: false });
  }
}

function closePacket() {
  selected = -1;
  packetEls.forEach((el) => { el.classList.remove('is-selected', 'is-open'); el.setAttribute('aria-pressed', 'false'); });
  markerEls.forEach((m) => { m.inner.classList.remove('is-selected'); m.root.style.zIndex = ''; });
  backEl.className = 'packet-back is-empty';
  backEl.textContent = 'Pick a seed packet from the rack to read its back — farm details and a planting calendar.';
  setStatus('', '❈', 'Pick a packet to tear it open.');
  fitTo(loopOn ? LOOP : FARMS.map((f) => f.lngLat));
}

// Farm loop: green line with a cream casing, emissive so the day light never dims it
map.on('style.load', () => {
  map.addSource('loop', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: LOOP } } });
  const vis = { visibility: loopOn ? 'visible' : 'none', 'line-cap': 'round', 'line-join': 'round' };
  map.addLayer({ id: 'loop-casing', type: 'line', source: 'loop', slot: 'top', layout: vis,
    paint: { 'line-color': '#F6EBD3', 'line-width': 9, 'line-emissive-strength': 1 } });
  map.addLayer({ id: 'loop-line', type: 'line', source: 'loop', slot: 'top', layout: vis,
    paint: { 'line-color': '#4E7D3A', 'line-width': 5, 'line-emissive-strength': 1 } });
});

loopBtn.addEventListener('click', () => {
  loopOn = !loopOn;
  touched = true;
  ['loop-casing', 'loop-line'].forEach((id) => { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', loopOn ? 'visible' : 'none'); });
  loopBtn.textContent = loopOn ? 'Clear farm loop' : 'Plan a farm loop';
  loopBtn.classList.toggle('btn-primary', !loopOn);
  loopBtn.classList.toggle('btn-secondary', loopOn);
  setStatus('success', loopOn ? '✓' : '❈', loopOn ? 'Farm loop: about 95 mi, 2 h 40 of driving.' : 'Pick a packet to tear it open.');
  if (loopOn) fitTo(LOOP);
  else if (selected < 0) fitTo(FARMS.map((f) => f.lngLat));
});

// The grid settles after load: keep the canvas in step and refit until the user acts
new ResizeObserver(() => {
  map.resize();
  if (!touched) fitTo(FARMS.map((f) => f.lngLat), true);
}).observe(document.getElementById('map'));
</script>
</body>
</html>
