<!--
  Working EXAMPLE of the Fleet Ops style pack (fleet-ops.css, in this same
  folder). Open this file directly to see the pattern working with a
  fictional delivery fleet ("Meridian Fleet", 12 vans out of a Jurong depot
  in Singapore) on Mapbox Standard in the monochrome theme. The map card
  shows four real driving routes (CBD, Sentosa, Woodlands, Bishan, Punggol,
  Tampines, Changi) with the completed part of each trip drawn darker; the
  vehicles move along them, and the four KPI cards (each with an inline-SVG
  sparkline), the status filter chips, the vehicles table and the alerts
  drawer all update from the same simulation. Hover or click a table row or
  a vehicle on the map to highlight and fly to it; click an alert to focus
  its vehicle. Copy the markup below into your own demo and link
  fleet-ops.css from its <head> -- see the class/id contract documented at
  the top of that CSS file.

  This is a brand-new style, not extracted from an existing demo -- built
  from a design brief (a clean light enterprise SaaS operations dashboard)
  at the user's request for something distinct from every other pack in
  this folder. "Meridian Fleet", the driver names, vehicle IDs, delays and
  alerts are fictional placeholders and the movement is a simulation -- swap
  in your own data. The route lines come from the Mapbox Directions API
  (driving), simplified and embedded as plain coordinates.

  What's NOT included: live telematics, a real ETA engine, search/geocoding,
  routing calls at runtime, or a hard-coded access token (demo-kit.js sets
  that).
-->

};
const RT = 120;          // real seconds for a speed-1 vehicle to drive its route
const CLOCK_X = 25;      // simulated seconds per real second
const CLOCK_START = 10 * 3600 + 42 * 60;
const STOPS_BASE = 148, STOPS_PLAN = 312, ONTIME_BASE = 138, DONE_BASE = 146;
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const phone = () => window.matchMedia('(max-width: 760px)').matches;
const $ = (id) => document.getElementById(id);

/* ---------- Route geometry ---------- */
ROUTES.forEach((rt) => {
  const cum = [0];
  for (let i = 1; i < rt.coords.length; i++) {
    const a = rt.coords[i - 1], b = rt.coords[i];
    cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1]));
  }
  rt.cum = cum;
  rt.total = cum[cum.length - 1];
  // stop fractions = position of the nearest route vertex
  rt.stops = rt.stops.map(([x, y, name]) => {
    let best = 0, bd = Infinity;
    rt.coords.forEach((c, i) => {
      const d = (c[0] - x) ** 2 + (c[1] - y) ** 2;
      if (d < bd) { bd = d; best = i; }
    });
    return { name, f: rt.cum[best] / rt.total };
  }).sort((a, b) => a.f - b.f);
});

function posAt(rt, f) {
  const d = f * rt.total;
  let i = 1;
  while (i < rt.cum.length - 1 && rt.cum[i] < d) i++;
  const t = (d - rt.cum[i - 1]) / (rt.cum[i] - rt.cum[i - 1] || 1);
  const a = rt.coords[i - 1], b = rt.coords[i];
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}

function slice(rt, f0, f1) {
  const out = [posAt(rt, f0)];
  rt.cum.forEach((c, i) => {
    const f = c / rt.total;
    if (f > f0 && f < f1) out.push(rt.coords[i]);
  });
  out.push(posAt(rt, f1));
  return out;
}

/* ---------- Simulation ---------- */
let elapsed = 0;
FLEET.forEach((v, i) => { v.dir = 1; v.legs = 0; v.ph = i * 1.7; });

const delayOf = (v) => v.idle ? 0 : Math.max(0, v.base + 1.2 * Math.sin(elapsed / 17 + v.ph));
function statusOf(v) {
  if (v.idle) return 'idle';
  const d = delayOf(v);
  return d <= 3 ? 'ontime' : d <= 10 ? 'risk' : 'late';
}

function nextStop(v) {
  const rt = ROUTES[v.r];
  if (v.dir > 0) return rt.stops.find((s) => s.f > v.p + 1e-6) || rt.stops[rt.stops.length - 1];
  const back = rt.stops.filter((s) => s.f < v.p - 1e-6);
  return back.length ? back[back.length - 1] : { name: 'Jurong Depot', f: 0 };
}
function stopsDone(v) {
  const rt = ROUTES[v.r];
  const n = rt.stops.filter((s) => (v.dir > 0 ? s.f <= v.p : s.f >= v.p)).length;
  return v.legs * rt.stops.length + n;
}

const hhmm = (sec) => {
  const s = Math.floor(sec) % 86400;
  return String(Math.floor(s / 3600)).padStart(2, '0') + ':' + String(Math.floor((s % 3600) / 60)).padStart(2, '0');
};
function etaOf(v) {
  if (v.idle) return '--:--';
  const rt = ROUTES[v.r], ns = nextStop(v);
  return hhmm(CLOCK_START + elapsed * CLOCK_X + (Math.abs(ns.f - v.p) * rt.dur) / v.vf + delayOf(v) * 60);
}

function step(dt) {
  elapsed += dt;
  FLEET.forEach((v) => {
    if (v.idle) return;
    v.p += (v.dir * dt * v.vf) / RT;
    if (v.p >= 1) { v.p = 1; v.dir = -1; v.legs++; }
    else if (v.p <= 0) { v.p = 0; v.dir = 1; v.legs++; }
  });
}

/* ---------- Vehicles table ---------- */
let filter = 'all', query = '', hoverId = null, selId = null;
const rowEls = {};
FLEET.forEach((v) => {
  const el = document.createElement('button');
  el.className = 'veh-row';
  el.dataset.id = v.id;
  el.innerHTML = `<span class="veh-id">${v.id}</span><span class="veh-driver">${v.driver}<small></small></span>` +
    `<span class="pill"></span><span class="veh-eta"></span><span class="bar"><i></i></span>`;
  el.addEventListener('mouseenter', () => setHover(v.id));
  el.addEventListener('mouseleave', () => setHover(null));
  el.addEventListener('click', () => select(v.id, true));
  $('rows').appendChild(el);
  rowEls[v.id] = { el, sub: el.querySelector('small'), pill: el.querySelector('.pill'), eta: el.querySelector('.veh-eta'), bar: el.querySelector('.bar') };
});

function isVisible(v) {
  const s = statusOf(v);
  if (filter !== 'all' && s !== filter) return false;
  const q = query.trim().toLowerCase();
  if (!q) return true;
  return [v.id, v.driver, ROUTES[v.r].name, ROUTES[v.r].id, ST[s].label].join(' ').toLowerCase().includes(q);
}

function updateTable() {
  const counts = { ontime: 0, risk: 0, late: 0, idle: 0 };
  let shown = 0;
  FLEET.forEach((v) => {
    const s = statusOf(v), r = rowEls[v.id], rt = ROUTES[v.r];
    counts[s]++;
    r.el.dataset.status = s;
    const ns = nextStop(v);
    const sub = `${rt.id} · ${v.idle ? 'parked' : (v.dir > 0 ? 'next ' : 'return via ') + ns.name}`;
    if (r.sub.textContent !== sub) r.sub.textContent = sub;
    const cls = 'pill ' + s;
    if (r.pill.className !== cls) { r.pill.className = cls; r.pill.textContent = ST[s].label; }
    r.eta.textContent = etaOf(v);
    r.bar.style.setProperty('--p', ((v.dir > 0 ? v.p : 1 - v.p) * 100).toFixed(0));
    const vis = isVisible(v);
    r.el.classList.toggle('hidden', !vis);
    if (vis) shown++;
  });
  $('veh-empty').classList.toggle('hidden', shown > 0);
  $('veh-count').textContent = shown === FLEET.length ? FLEET.length : `${shown} of ${FLEET.length}`;
  Object.keys(counts).forEach((k) => { $('c-' + k).textContent = counts[k]; });
  return counts;
}

/* ---------- KPIs + sparklines ---------- */
// Seed history: 24 points easing towards today's values (decorative).
const seed = (from, to, wobble) => Array.from({ length: 24 }, (_, i) =>
  from + (to - from) * (i / 23) + Math.sin(i * 2.3) * wobble * (1 - i / 23));
const hist = { active: seed(9, 10, 0.8), ontime: seed(95.2, 94.0, 0.25), stops: seed(92, 148, 0), delay: seed(4.2, 5.4, 0.4) };

function drawSpark(key) {
  const d = hist[key], w = 100, h = 40, pad = 4;
  const lo = Math.min(...d), hi = Math.max(...d), span = hi - lo || 1;
  const xy = d.map((v, i) => [(i / (d.length - 1)) * w, pad + (1 - (v - lo) / span) * (h - pad * 2)]);
  const line = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const last = xy[xy.length - 1];
  $('s-' + key).innerHTML = `<path class="spark-area" d="${line}L${w} ${h}L0 ${h}Z"/><path class="spark-line" d="${line}"/>` +
    `<circle class="spark-dot" cx="${last[0]}" cy="${last[1].toFixed(1)}" r="3.5"/>`;
}

function kpis(counts) {
  const moving = FLEET.filter((v) => !v.idle);
  const done = FLEET.reduce((n, v) => n + stopsDone(v), 0);
  const w = { ontime: 1, risk: 0.6, late: 0.2, idle: 1 };
  const onTimeN = FLEET.reduce((n, v) => n + stopsDone(v) * w[statusOf(v)], 0);
  const cur = {
    active: moving.length,
    ontime: (100 * (ONTIME_BASE + onTimeN)) / (DONE_BASE + done),
    stops: STOPS_BASE + done,
    delay: moving.reduce((n, v) => n + delayOf(v), 0) / moving.length,
  };
  $('k-active').innerHTML = `${cur.active}<small>/ ${FLEET.length}</small>`;
  $('k-ontime').innerHTML = `${cur.ontime.toFixed(1)}<small>%</small>`;
  $('k-stops').innerHTML = `${cur.stops}<small>/ ${STOPS_PLAN}</small>`;
  $('k-stops-d').innerHTML = `<b>${Math.round((100 * cur.stops) / STOPS_PLAN)}%</b> of today’s plan`;
  $('k-delay').innerHTML = `${cur.delay.toFixed(1)}<small>min</small>`;
  return cur;
}

let lastPush = 0;
function pushSpark(cur) {
  Object.keys(hist).forEach((k) => { hist[k].push(cur[k]); hist[k].shift(); drawSpark(k); });
}

/* ---------- Alerts drawer ---------- */
const ICONS = {
  late: '<path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17.5v.1"/>',
  risk: '<path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17.5v.1"/>',
  idle: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8v.1"/>',
};
ALERTS.forEach((a) => {
  const el = document.createElement('button');
  el.className = 'alert sev-' + a.sev;
  el.innerHTML = `<svg class="alert-ico" viewBox="0 0 24 24">${ICONS[a.sev]}</svg><span class="alert-text">${a.text}</span>` +
    `<span class="alert-veh">${a.veh}</span><span class="alert-time">${a.time}</span>`;
  el.addEventListener('click', () => select(a.veh, true));
  $('alerts-body').appendChild(el);
});
$('alerts-count').textContent = ALERTS.length;
$('alerts-toggle').addEventListener('click', () => {
  const c = $('alerts').classList.toggle('collapsed');
  $('alerts-toggle').setAttribute('aria-expanded', String(!c));
});
if (phone()) { $('alerts').classList.add('collapsed'); $('alerts-toggle').setAttribute('aria-expanded', 'false'); }

/* ---------- Filters ---------- */
document.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => {
  filter = c.dataset.status;
  document.querySelectorAll('.chip').forEach((x) => x.classList.toggle('active', x === c));
  refresh(true);
}));
['q', 'q-top'].forEach((id) => $(id).addEventListener('input', (e) => {
  query = e.target.value;
  $('q').value = $('q-top').value = query;
  refresh(true);
}));
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !/INPUT/.test(document.activeElement.tagName)) {
    e.preventDefault();
    (phone() ? $('q') : $('q-top')).focus();
  }
});
$('date-text').textContent = 'Today, ' + new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

/* ---------- Map ---------- */
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  center: [103.82, 1.34],
  zoom: 10.4,
  config: { basemap: { theme: 'monochrome', lightPreset: 'day', showPointOfInterestLabels: false, showTransitLabels: false } },
});
map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');
let ready = false;

const tip = new mapboxgl.Popup({ closeButton: false, closeOnClick: false, offset: 16, className: 'fo-tip', maxWidth: '260px' });

function pad() {
  // The cards sit beside the map (not over it): clear the legend (top) and
  // keep points off the logo / attribution corners (bottom >= 64).
  return { top: 56, bottom: 72, left: 40, right: 40 };
}

function fitAll(duration) {
  const b = new mapboxgl.LngLatBounds();
  ROUTES.forEach((rt) => rt.coords.forEach((c) => b.extend(c)));
  map.fitBounds(b, { padding: pad(), duration: reduce ? 0 : duration });
}

function vehPoint(v) {
  return {
    type: 'Feature',
    properties: { id: v.id, status: statusOf(v) },
    geometry: { type: 'Point', coordinates: posAt(ROUTES[v.r], v.p) },
  };
}
function donePart(v) {
  const rt = ROUTES[v.r];
  const a = v.dir > 0 ? 0 : v.p, b = v.dir > 0 ? v.p : 1;
  return { type: 'Feature', properties: { id: v.id, status: statusOf(v) }, geometry: { type: 'LineString', coordinates: slice(rt, a, Math.max(b, a + 1e-4)) } };
}

const statusColor = ['match', ['get', 'status'], 'ontime', ST.ontime.color, 'risk', ST.risk.color, 'late', ST.late.color, ST.idle.color];
const sel = (a, b) => ['case', ['boolean', ['feature-state', 'selected'], false], a, ['boolean', ['feature-state', 'hover'], false], (a + b) / 2, b];

map.on('style.load', () => {
  const lineW = ['interpolate', ['linear'], ['zoom'], 9, 2.5, 14, 6];
  const join = { 'line-join': 'round', 'line-cap': 'round' };
  map.addSource('routes', { type: 'geojson', data: { type: 'FeatureCollection', features: ROUTES.map((rt) => ({ type: 'Feature', properties: { id: rt.id }, geometry: { type: 'LineString', coordinates: rt.coords } })) } });
  map.addSource('done', { type: 'geojson', data: { type: 'FeatureCollection', features: FLEET.map(donePart) } });
  map.addSource('veh', { type: 'geojson', promoteId: 'id', data: { type: 'FeatureCollection', features: FLEET.map(vehPoint) } });
  map.addSource('depot', { type: 'geojson', data: { type: 'Feature', properties: { name: 'Meridian Depot' }, geometry: { type: 'Point', coordinates: DEPOT } } });

  map.addLayer({ id: 'routes-casing', type: 'line', source: 'routes', slot: 'middle', layout: join, paint: { 'line-color': '#FFFFFF', 'line-opacity': 0.9, 'line-width': ['interpolate', ['linear'], ['zoom'], 9, 5, 14, 8.5] } });
  map.addLayer({ id: 'routes-plan', type: 'line', source: 'routes', slot: 'middle', layout: join, paint: { 'line-color': '#9DB8F5', 'line-width': lineW } });
  map.addLayer({ id: 'routes-done', type: 'line', source: 'done', slot: 'middle', layout: join, paint: { 'line-color': '#2F5BEA', 'line-width': lineW } });
  map.addLayer({ id: 'depot', type: 'circle', source: 'depot', slot: 'top', paint: { 'circle-radius': 7, 'circle-color': '#0B1220', 'circle-stroke-color': '#FFFFFF', 'circle-stroke-width': 2.5 } });
  map.addLayer({ id: 'depot-label', type: 'symbol', source: 'depot', slot: 'top', minzoom: 9,
    layout: { 'text-field': ['get', 'name'], 'text-size': 12, 'text-font': ['DIN Pro Medium', 'Arial Unicode MS Regular'], 'text-variable-anchor': ['left', 'top', 'bottom'], 'text-radial-offset': 0.9 },
    paint: { 'text-color': '#0B1220', 'text-halo-color': '#FFFFFF', 'text-halo-width': 1.6 } });
  map.addLayer({ id: 'veh-halo', type: 'circle', source: 'veh', slot: 'top', paint: {
    'circle-radius': ['interpolate', ['linear'], ['zoom'], 9, 16, 14, 22],
    'circle-color': '#2F5BEA',
    'circle-opacity': ['case', ['boolean', ['feature-state', 'selected'], false], 0.22, ['boolean', ['feature-state', 'hover'], false], 0.14, 0] } });
  map.addLayer({ id: 'veh', type: 'circle', source: 'veh', slot: 'top', paint: {
    'circle-radius': ['interpolate', ['linear'], ['zoom'], 9, sel(10, 7.5), 14, sel(14, 11)],
    'circle-color': statusColor, 'circle-stroke-color': '#FFFFFF', 'circle-stroke-width': 2.5 } });
  map.addLayer({ id: 'veh-label', type: 'symbol', source: 'veh', slot: 'top', minzoom: 11,
    layout: { 'text-field': ['get', 'id'], 'text-size': 11, 'text-font': ['DIN Pro Medium', 'Arial Unicode MS Regular'], 'text-variable-anchor': ['top', 'bottom', 'right', 'left'], 'text-radial-offset': 1.1 },
    paint: { 'text-color': '#0B1220', 'text-halo-color': '#FFFFFF', 'text-halo-width': 1.6 } });

  map.on('mouseenter', 'veh', (e) => { map.getCanvas().style.cursor = 'pointer'; setHover(e.features[0].properties.id); });
  map.on('mouseleave', 'veh', () => { map.getCanvas().style.cursor = ''; setHover(null); });
  map.on('click', 'veh', (e) => { e.originalEvent.cancelBubble = true; select(e.features[0].properties.id, false); });
  map.on('click', (e) => { if (!e.originalEvent.cancelBubble) select(null, false); });

  ready = true;
  applyMapFilter();
  setHover(hoverId);
  if (selId) map.setFeatureState({ source: 'veh', id: selId }, { selected: true });
  fitAll(0);
  $('status-note').classList.add('hidden');
});

map.on('error', (e) => {
  if (ready) return;
  const n = $('status-note');
  n.className = 'status-note error';
  n.textContent = 'Map error: ' + ((e.error && e.error.message) || 'unknown');
});

let filterKey = '';
function applyMapFilter() {
  if (!ready) return;
  const ids = FLEET.filter(isVisible).map((v) => v.id);
  if (ids.join() === filterKey) return;
  filterKey = ids.join();
  const f = ids.length === FLEET.length ? null : ['in', ['get', 'id'], ['literal', ids]];
  ['routes-done', 'veh-halo', 'veh', 'veh-label'].forEach((l) => map.setFilter(l, f));
}

function setHover(id) {
  if (ready && hoverId && hoverId !== id) map.setFeatureState({ source: 'veh', id: hoverId }, { hover: false });
  if (hoverId && hoverId !== id) rowEls[hoverId].el.classList.remove('hover');
  hoverId = id;
  if (id) rowEls[id].el.classList.add('hover');
  if (ready && id) map.setFeatureState({ source: 'veh', id }, { hover: true });
  if (!id) tip.remove(); else updateTip();
}

function updateTip() {
  const v = FLEET.find((x) => x.id === hoverId);
  if (!v || !ready) return;
  const s = statusOf(v), rt = ROUTES[v.r], ns = nextStop(v);
  tip.setLngLat(posAt(rt, v.p)).setHTML(
    `<div class="tip-id">${v.id}<span class="pill ${s}">${ST[s].label}</span></div>` +
    `<div class="tip-row">Driver<b>${v.driver}</b></div>` +
    `<div class="tip-row">Route<b>${rt.id} · ${rt.name}</b></div>` +
    `<div class="tip-row">${v.dir > 0 ? 'Next stop' : 'Returning via'}<b>${v.idle ? '—' : ns.name}</b></div>` +
    `<div class="tip-row">ETA<b class="mono">${etaOf(v)}</b></div>` +
    `<div class="tip-row">Delay<b class="mono">${v.idle ? '—' : '+' + delayOf(v).toFixed(0) + ' min'}</b></div>`);
  if (!tip.isOpen()) tip.addTo(map);
}

function select(id, fly) {
  if (ready && selId && selId !== id) map.setFeatureState({ source: 'veh', id: selId }, { selected: false });
  if (selId && selId !== id) rowEls[selId].el.classList.remove('selected');
  selId = id;
  if (!id) return;
  rowEls[id].el.classList.add('selected');
  if (ready) map.setFeatureState({ source: 'veh', id }, { selected: true });
  if (fly && ready) {
    if (phone()) document.querySelector('.map-card').scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' });
    const v = FLEET.find((x) => x.id === id);
    const opts = { center: posAt(ROUTES[v.r], v.p), zoom: Math.max(map.getZoom(), 12.6), padding: pad() };
    if (reduce) map.jumpTo(opts); else map.flyTo({ ...opts, duration: 1600, essential: false });
  }
  if (!phone()) rowEls[id].el.scrollIntoView({ block: 'nearest' });
}

/* ---------- Main loop ---------- */
let last = 0, tUi = 0, tDone = 0;
function refresh(force) {
  const counts = updateTable();
  const cur = kpis(counts);
  applyMapFilter();
  if (force) return;
  if (elapsed - lastPush > 4) { lastPush = elapsed; pushSpark(cur); }
}

function frame(ts) {
  const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0;
  last = ts;
  step(reduce ? 1 : dt);
  if (ready) {
    map.getSource('veh').setData({ type: 'FeatureCollection', features: FLEET.map(vehPoint) });
    if (elapsed - tDone > 0.3) { tDone = elapsed; map.getSource('done').setData({ type: 'FeatureCollection', features: FLEET.map(donePart) }); }
    if (hoverId) updateTip();
  }
  if (elapsed - tUi > 0.5) {
    tUi = elapsed;
    refresh(false);
    $('clock').textContent = 'Live · ' + hhmm(CLOCK_START + elapsed * CLOCK_X);
  }
  if (reduce) setTimeout(() => requestAnimationFrame(frame), 1000); else requestAnimationFrame(frame);
}

Object.keys(hist).forEach(drawSpark);
refresh(true);
$('clock').textContent = 'Live · ' + hhmm(CLOCK_START);
requestAnimationFrame(frame);
</script>
</body>
</html>
