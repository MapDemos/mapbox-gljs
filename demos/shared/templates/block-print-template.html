<!--
  Working EXAMPLE of the Block Print style pack (block-print.css, in this
  same folder). Open this file directly to see the pattern working with a
  six-stall bazaar and craft walk through Jaipur's walled Pink City on
  Mapbox Standard (day preset, warm colour config). Printed borders frame
  the page, the map sits in a fabric panel, and six hanging swatches list
  the stalls: click a swatch or a stamp marker (or press the Left / Right
  arrow keys) and the marker is STAMPED (thunk + ink-splash ring) while the
  camera flies to it and a detail card opens. "Print the route" draws the
  walking route as if a block were stamped segment by segment. Reduced
  motion: no stamping, instant camera jumps and an instantly drawn route.
  Copy the markup below into your own demo and link block-print.css from
  its <head> -- see the class/id contract documented at the top of that CSS
  file.

  This is a brand-new style, not extracted from an existing demo -- built
  from a design brief (hand-carved wooden-block textiles in indigo, madder
  red and turmeric on natural cotton) at the user's request for something
  distinct from every other pack in this folder. The streets, bazaars and
  Hawa Mahal are real; the workshops, dye-yard and lassi shop are fictional
  placeholders -- swap in your own. The walking route was fetched once
  from the Mapbox Directions API, simplified and embedded.

  What's NOT included: search/geocoding, live routing, popups, or a
  hard-coded access token (demo-kit.js sets that).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pink City Block Print Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" rel="stylesheet" />
<link href="block-print.css" rel="stylesheet" />
<script src="../demo-kit.js"></script>
<style>
  /* Demo-owned: every demo positions its own #map (inside the map well). */
  #map { position: absolute; inset: 0; }
</style>
</head>
<body>
<!-- Shared SVG symbols: wooden-block icon and the small stamp motifs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="blk" viewBox="0 0 32 32">
      <rect x="9" y="3" width="14" height="8" rx="3" fill="#8A5A33" stroke="#2A1E1A" stroke-width="2"/>
      <rect x="4" y="11" width="24" height="17" rx="2" fill="#C58B52" stroke="#2A1E1A" stroke-width="2"/>
      <path d="M16 15c4 1 5 5 3 8-2 2-5 1-5-1s2-3 3-2" fill="none" stroke="#2A1E1A" stroke-width="2" stroke-linecap="round"/>
      <circle cx="9" cy="24" r="1.4" fill="#2A1E1A"/><circle cx="23" cy="15" r="1.4" fill="#2A1E1A"/>
    </symbol>
    <symbol id="m1" viewBox="0 0 24 24"><path d="M10 2c7 2 10 10 5 16-3 3-8 2-8-2 0-4 4-5 6-3 2 2-1 4-3 3z"/></symbol>
    <symbol id="m2" viewBox="0 0 24 24"><g><ellipse cx="12" cy="6" rx="3.4" ry="5"/><ellipse cx="12" cy="6" rx="3.4" ry="5" transform="rotate(72 12 12)"/><ellipse cx="12" cy="6" rx="3.4" ry="5" transform="rotate(144 12 12)"/><ellipse cx="12" cy="6" rx="3.4" ry="5" transform="rotate(216 12 12)"/><ellipse cx="12" cy="6" rx="3.4" ry="5" transform="rotate(288 12 12)"/></g></symbol>
    <symbol id="m3" viewBox="0 0 24 24"><path d="M2 21V10l3-3 2 2 5-6 5 6 2-2 3 3v11h-4v-6a3 3 0 0 0-6 0v6z"/></symbol>
    <symbol id="m4" viewBox="0 0 24 24"><path d="M12 1l4 7 7 4-7 4-4 7-4-7-7-4 7-4z"/></symbol>
    <symbol id="m5" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2.4"/><circle cx="12" cy="20" r="2.4"/><circle cx="4" cy="12" r="2.4"/><circle cx="20" cy="12" r="2.4"/><circle cx="6.3" cy="6.3" r="2"/><circle cx="17.7" cy="6.3" r="2"/><circle cx="6.3" cy="17.7" r="2"/><circle cx="17.7" cy="17.7" r="2"/><circle cx="12" cy="12" r="3.4"/></symbol>
    <symbol id="m6" viewBox="0 0 24 24"><path d="M5 3h14l-1.5 14a5.5 5.5 0 0 1-11 0z"/><rect x="9" y="20" width="6" height="2.5" rx="1"/></symbol>
  </defs>
</svg>

<div class="cloth">
  <!-- Top band: buta / paisley repeat (explicit heights on the svg) -->
  <svg class="band band-top" width="100%" height="44" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="pat-buta" width="96" height="44" patternUnits="userSpaceOnUse">
        <rect width="96" height="44" fill="#2B3A67"/>
        <rect y="3" width="96" height="3" fill="#E0A526"/><rect y="38" width="96" height="3" fill="#E0A526"/>
        <g transform="translate(9.5 7.5) scale(.9)"><path d="M18 0C30 4 34 18 26 28 21 34 11 32 10 25 9 18 16 15 20 19 23 22 19 25 16 23" fill="#E0A526" opacity=".6"/></g>
        <g transform="translate(8 6) scale(.9)"><path d="M18 0C30 4 34 18 26 28 21 34 11 32 10 25 9 18 16 15 20 19 23 22 19 25 16 23" fill="#F3EAD7"/><circle cx="22" cy="11" r="3.4" fill="#A4332B"/><circle cx="16" cy="12" r="1.3" fill="#E0A526"/></g>
        <g transform="translate(88 6) scale(-.9 .9)"><path d="M18 0C30 4 34 18 26 28 21 34 11 32 10 25 9 18 16 15 20 19 23 22 19 25 16 23" fill="#E3967A"/><circle cx="22" cy="11" r="3.4" fill="#2B3A67"/><circle cx="22" cy="11" r="1.4" fill="#F3EAD7"/></g>
        <g transform="translate(48 22)" fill="#F3EAD7"><circle cy="-6" r="3.6"/><circle cy="6" r="3.6"/><circle cx="-6" r="3.6"/><circle cx="6" r="3.6"/><circle r="3" fill="#E0A526"/></g>
        <path d="M44 10l4-3 4 3M44 34l4 3 4-3" stroke="#A4332B" stroke-width="2" fill="none"/>
      </pattern>
    </defs>
    <rect width="100%" height="44" fill="url(#pat-buta)"/>
  </svg>

  <header class="cloth-head">
    <div>
      <h1 class="cloth-title">Pink City Block Print Walk</h1>
      <p class="cloth-sub">Stamps, dye-yards &amp; lassi in Jaipur's walled bazaars</p>
    </div>
    <div class="cloth-actions">
      <span class="status-note loading" id="status-note">Laying out the cloth</span>
      <button class="btn btn-secondary" id="btn-overview" type="button">Overview</button>
      <button class="btn btn-primary" id="btn-route" type="button" disabled>Print the route</button>
    </div>
  </header>

  <main class="main">
    <section class="panel" aria-label="Map of the walk">
      <div class="map-well"><div id="map"></div></div>
      <aside class="detail hidden" id="detail" aria-live="polite">
        <button class="detail-close" id="detail-close" type="button" aria-label="Close details">&times;</button>
        <svg class="detail-icon" aria-hidden="true"><use href="#blk"/></svg>
        <p class="detail-tag" id="d-tag"></p>
        <h2 class="detail-title" id="d-title"></h2>
        <p class="detail-place" id="d-place"></p>
        <p class="detail-text" id="d-text"></p>
      </aside>
    </section>

    <section class="hang" aria-label="Stalls">
      <div class="rod" aria-hidden="true"></div>
      <div class="swatches" id="swatches"></div>
    </section>
  </main>

  <!-- Bottom band: small flower repeat -->
  <svg class="band band-bottom" width="100%" height="36" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="pat-flower" width="32" height="36" patternUnits="userSpaceOnUse">
        <rect width="32" height="36" fill="#F3EAD7"/>
        <rect y="0" width="32" height="4" fill="#2B3A67"/><rect y="5" width="32" height="1.5" fill="#E0A526"/>
        <g transform="translate(17 21)" fill="#E0A526" opacity=".6"><ellipse cy="-6" rx="3.2" ry="5.5"/><ellipse cy="-6" rx="3.2" ry="5.5" transform="rotate(72)"/><ellipse cy="-6" rx="3.2" ry="5.5" transform="rotate(144)"/><ellipse cy="-6" rx="3.2" ry="5.5" transform="rotate(216)"/><ellipse cy="-6" rx="3.2" ry="5.5" transform="rotate(288)"/></g>
        <g transform="translate(16 20)" fill="#A4332B"><ellipse cy="-6" rx="3.2" ry="5.5"/><ellipse cy="-6" rx="3.2" ry="5.5" transform="rotate(72)"/><ellipse cy="-6" rx="3.2" ry="5.5" transform="rotate(144)"/><ellipse cy="-6" rx="3.2" ry="5.5" transform="rotate(216)"/><ellipse cy="-6" rx="3.2" ry="5.5" transform="rotate(288)"/><circle r="2.4" fill="#E0A526"/></g>
        <ellipse cx="1" cy="21" rx="2" ry="4" fill="#5E7A3A" transform="rotate(-30 1 21)"/><ellipse cx="31" cy="21" rx="2" ry="4" fill="#5E7A3A" transform="rotate(30 31 21)"/>
        <rect y="33" width="32" height="3" fill="#2B3A67"/>
      </pattern>
    </defs>
    <rect width="100%" height="36" fill="url(#pat-flower)"/>
  </svg>
</div>

<script>
// Six stalls. Coordinates are [lng, lat], snapped to the walking route.
const STOPS = [
  { name: 'Neelkanth Chhapai', kind: 'Block printer', place: 'Chandpole Bazaar', coord: [75.81131, 26.92719], motif: 'm1', tone: 'madder',
    text: 'Carvers here press sheesham blocks into indigo and madder cloth. Each block lands twice, and the slight shift between passes is the hand-made signature.' },
  { name: 'Gulabi Thappa Ghar', kind: 'Block printer', place: 'Tripolia Bazaar', coord: [75.8231, 26.92506], motif: 'm2', tone: 'indigo',
    text: 'A narrow workshop near the City Palace gate. Floral repeats are stamped on cotton dupattas from small blocks, one row at a time on long padded tables.' },
  { name: 'Hawa Mahal Chhajja', kind: 'Viewpoint', place: 'Badi Choupad, facing the Palace of Winds', coord: [75.82699, 26.92363], motif: 'm3', tone: 'turmeric',
    text: 'A rooftop terrace opposite the honeycomb facade of Hawa Mahal. Morning light turns the sandstone to rose, a good moment to look back over the walk.' },
  { name: 'Three Bazaars Arcade', kind: 'Bazaar', place: 'Johari Bazaar, near Tripolia and Bapu', coord: [75.82358, 26.92043], motif: 'm4', tone: 'madder',
    text: 'Johari Bazaar is the jewellers and lac-bangle street; Tripolia and Bapu Bazaar run off it with textiles, lacquer, shoes and spices under arched shopfronts.' },
  { name: 'Manjith & Neel Dye-Yard', kind: 'Dyer', place: 'Chaura Rasta', coord: [75.82111, 26.91847], motif: 'm5', tone: 'indigo',
    text: 'Vats of indigo and madder root stand in the courtyard, and cloth dries on rooftop lines. Ask to see the resist-dyed lengths before they are block printed.' },
  { name: 'Kesar Lassi Ghar', kind: 'Lassi shop', place: 'Bapu Bazaar', coord: [75.81757, 26.91723], motif: 'm6', tone: 'turmeric',
    text: 'Thick saffron lassi served in clay cups you smash afterwards. A cool stop at the end of the walk, with a view of the shopfront awnings.' },
];

// Walking route (Mapbox Directions, fetched once, simplified): 3.9 km, ~45 min.
const ROUTE = [[75.81131,26.92719],[75.81137,26.92724],[75.81145,26.92751],[75.81204,26.9274],[75.81219,26.92799],[75.81479,26.92734],[75.81897,26.92652],[75.81873,26.92558],[75.81908,26.92552],[75.8195,26.92555],[75.81978,26.92585],[75.81985,26.92587],[75.82063,26.92572],[75.82158,26.92545],[75.82177,26.92534],[75.82228,26.92523],[75.82234,26.92513],[75.82236,26.92488],[75.8227,26.92479],[75.82291,26.92483],[75.82318,26.92517],[75.82335,26.92529],[75.82424,26.92514],[75.82432,26.92541],[75.8244,26.92552],[75.8245,26.92555],[75.82538,26.92539],[75.82606,26.92521],[75.82578,26.92408],[75.82623,26.92397],[75.82601,26.92318],[75.82637,26.92311],[75.82665,26.92311],[75.82682,26.92321],[75.82699,26.92363],[75.82682,26.92321],[75.82669,26.92315],[75.82661,26.92304],[75.82661,26.92291],[75.82671,26.92277],[75.82669,26.92265],[75.82622,26.92099],[75.82407,26.92149],[75.82374,26.9204],[75.8219,26.92078],[75.82163,26.91982],[75.82151,26.91985],[75.82094,26.91791],[75.82034,26.91805],[75.82018,26.91757],[75.81967,26.91769],[75.81951,26.91714],[75.81797,26.91749],[75.81787,26.91715],[75.81757,26.91723]];

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (id) => document.getElementById(id);
const phone = () => window.matchMedia('(max-width: 760px)').matches;
const line = (coords) => ({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } });

// Index of the route vertex nearest each stop (kept monotonic).
let from = 0;
const STOP_IDX = STOPS.map((s) => {
  let best = from, bd = Infinity;
  for (let i = from; i < ROUTE.length; i++) {
    const d = (ROUTE[i][0] - s.coord[0]) ** 2 + (ROUTE[i][1] - s.coord[1]) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  from = best;
  return best;
});

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  config: {
    basemap: {
      lightPreset: 'day',
      showPointOfInterestLabels: false,
      showTransitLabels: false,
      showAdminBoundaries: false,
      // Warm "pink city" colour config (documented Standard keys)
      colorLand: '#F3EAD7',
      colorBuildings: '#E8B49C',
      colorRoads: '#FFF7E8',
      colorMotorways: '#F2CD8E',
      colorTrunks: '#F2CD8E',
      colorWater: '#8EA2C9',
      colorGreenspace: '#B4C28E',
      colorPlaceLabels: '#2A1E1A',
      colorRoadLabels: '#6B3A2A',
    },
  },
  center: [75.8205, 26.9225],
  zoom: 15,
  pitch: 20,
  attributionControl: true,
});

/* ---- Camera ---- */
function overviewOpts() {
  return phone()
    ? { padding: { top: 40, bottom: 66, left: 30, right: 30 }, pitch: 20, bearing: 0 }
    : { padding: { top: 56, bottom: 70, left: 60, right: 60 }, pitch: 20, bearing: 0 };
}
function routeBounds() {
  return ROUTE.reduce((b, c) => b.extend(c), new mapboxgl.LngLatBounds(ROUTE[0], ROUTE[0]));
}
function showOverview(ms) {
  map.fitBounds(routeBounds(), { ...overviewOpts(), duration: reduce ? 0 : ms === undefined ? 1400 : ms });
}
function flyToStop(s) {
  // Desktop: the detail card covers the map's top-left, so shift the target right.
  const opts = {
    center: s.coord, zoom: 17, pitch: 50,
    bearing: phone() ? 0 : -12,
    padding: phone() ? { top: 30, bottom: 60, left: 20, right: 20 } : { top: 30, bottom: 70, left: 300, right: 30 },
  };
  if (reduce) map.jumpTo(opts); else map.flyTo({ ...opts, duration: 1800, essential: false });
}

/* ---- Swatches + stamp markers ---- */
const cards = [], stamps = [];
let current = -1;

function stampMarker(i) {
  if (reduce) return;
  const el = stamps[i];
  el.classList.remove('thunk');
  void el.offsetWidth; // restart the animation
  el.classList.add('thunk');
  setTimeout(() => el.classList.remove('thunk'), 950);
}

STOPS.forEach((s, i) => {
  const card = document.createElement('button');
  card.type = 'button';
  card.className = `swatch sw-${i + 1}`;
  card.innerHTML =
    `<svg class="sw-icon" aria-hidden="true"><use href="#blk"/></svg>` +
    `<span class="sw-plate"><span class="sw-no">Swatch ${i + 1}</span><span class="sw-name">${s.name}</span><span class="sw-kind">${s.kind}</span></span>`;
  card.addEventListener('click', () => select(i));
  $('swatches').appendChild(card);
  cards.push(card);

  // Marker root stays untouched; only the inner child is styled.
  const root = document.createElement('div');
  root.innerHTML = `<button class="stamp" type="button" data-tone="${s.tone}" aria-label="${s.name}"><svg aria-hidden="true"><use href="#${s.motif}"/></svg><span class="num">${i + 1}</span></button>`;
  const el = root.firstElementChild;
  el.addEventListener('click', () => select(i));
  stamps.push(el);
  new mapboxgl.Marker({ element: root }).setLngLat(s.coord).addTo(map);
});

function select(i) {
  current = i;
  const s = STOPS[i];
  $('d-tag').textContent = `Swatch ${i + 1} · ${s.kind}`;
  $('d-title').textContent = s.name;
  $('d-place').textContent = s.place;
  $('d-text').textContent = s.text;
  $('detail').classList.remove('hidden');
  cards.forEach((c, k) => c.classList.toggle('active', k === i));
  stamps.forEach((m, k) => m.classList.toggle('active', k === i));
  stampMarker(i);
  flyToStop(s);
}

function overview() {
  current = -1;
  $('detail').classList.add('hidden');
  cards.forEach((c) => c.classList.remove('active'));
  stamps.forEach((m) => m.classList.remove('active'));
  showOverview();
}

$('detail-close').addEventListener('click', overview);
$('btn-overview').addEventListener('click', overview);
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); select(current < 0 ? 0 : Math.min(STOPS.length - 1, current + 1)); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (current > 0) select(current - 1); else overview(); }
  else if (e.key === 'Escape') overview();
});

/* ---- "Print the route": stamped in short segments ---- */
let printing = false;
function printRoute() {
  if (printing) return;
  const src = map.getSource('route');
  if (!src) return;
  const note = $('status-note');
  const done = () => {
    printing = false;
    $('btn-route').disabled = false;
    note.className = 'status-note success';
    note.textContent = 'Route printed: 3.9 km, about 45 minutes on foot';
  };
  if (reduce) { src.setData(line(ROUTE)); done(); return; }

  printing = true;
  $('btn-route').disabled = true;
  note.className = 'status-note loading';
  note.textContent = 'Stamping the route';
  src.setData(line([ROUTE[0], ROUTE[0]]));
  if (current >= 0) overview(); else showOverview(900);

  const STEP = 2;      // vertices per stamp
  let end = 0;         // last printed vertex
  let nextStop = 0;
  setTimeout(function stamp() {
    end = Math.min(ROUTE.length - 1, end + STEP);
    src.setData(line(ROUTE.slice(0, end + 1)));
    while (nextStop < STOPS.length && STOP_IDX[nextStop] <= end) stampMarker(nextStop++);
    if (end < ROUTE.length - 1) setTimeout(stamp, 140); else done();
  }, 1000);
}
$('btn-route').addEventListener('click', printRoute);

/* ---- Map lifecycle ---- */
map.on('style.load', () => {
  map.addSource('route-guide', { type: 'geojson', data: line(ROUTE) });
  map.addSource('route', { type: 'geojson', data: line([ROUTE[0], ROUTE[0]]) });
  // Faint "pencil" guide of the whole walk, before it is printed
  map.addLayer({ id: 'route-guide', type: 'line', source: 'route-guide', slot: 'top',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#2B3A67', 'line-width': 3, 'line-opacity': 0.45, 'line-dasharray': [1, 2], 'line-emissive-strength': 1 } });
  // Mis-registered turmeric second pass, indigo casing, madder ink
  map.addLayer({ id: 'route-ghost', type: 'line', source: 'route', slot: 'top',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#E0A526', 'line-width': 11, 'line-opacity': 0.7, 'line-translate': [2, 2], 'line-emissive-strength': 1 } });
  map.addLayer({ id: 'route-casing', type: 'line', source: 'route', slot: 'top',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#2B3A67', 'line-width': 9, 'line-emissive-strength': 1 } });
  map.addLayer({ id: 'route-line', type: 'line', source: 'route', slot: 'top',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#A4332B', 'line-width': 5, 'line-emissive-strength': 1 } });
  const note = $('status-note');
  note.className = 'status-note';
  note.textContent = 'Pick a swatch or a stamp';
  $('btn-route').disabled = false;
});

map.on('error', (e) => {
  const n = $('status-note');
  n.className = 'status-note error';
  n.textContent = 'Map error: ' + ((e.error && e.error.message) || 'unknown');
});

// The map well is sized by grid/flex that can settle after load.
new ResizeObserver(() => map.resize()).observe($('map'));
map.once('load', () => showOverview(0));
window.addEventListener('resize', () => { if (current < 0 && !printing) showOverview(0); });
</script>
</body>
</html>
