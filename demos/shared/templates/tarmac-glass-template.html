<!--
  Working EXAMPLE of the Tarmac Glass style pack (tarmac-glass.css +
  light-preset-pill.css, both in this same folder -- the light-preset pill
  is a standalone component you can also use on its own). Open this file
  directly to see the pattern working with 4 placeholder items, then copy
  the markup below into your own demo and link both CSS files from its
  <head> -- see the class/id contract documented at the top of each file
  for what to build.

  Extracted from demos/indoor-airport-brazil.html ("playful airport
  wayfinding" style, rated NICE in the step-9 UI review). What's NOT
  included: the cinematic multi-airport tour camera choreography, and the
  floor-polling logic that clicks Mapbox's native IndoorControl buttons
  (only relevant if your new demo also uses Standard style's native indoor
  floors).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.18.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.18.0/mapbox-gl.css" rel="stylesheet" />
<link href="tarmac-glass.css" rel="stylesheet" />
<link href="light-preset-pill.css" rel="stylesheet" />
<script src="../demo-kit.js"></script>
<script src="light-preset-pill.js"></script>
</head>
<body>
<div id="map"></div>

<!-- Info bar: current selection + play/tour toggle + expandable chip drawer -->
<div class="info-bar expanded" id="info-bar">
    <div class="bar-main">
        <button id="tour-toggle" class="tour-btn">▶ Play</button>
        <button id="chips-toggle" class="chips-toggle" title="Choose item" aria-label="Choose item">▾</button>
        <span class="live"><i></i></span>
        <div class="current" id="current-item"></div>
    </div>
    <div class="bar-drawer">
        <div class="item-buttons" id="item-buttons"></div>
    </div>
</div>

<script>
// Placeholder data -- replace with your own items. Each needs at minimum a
// short code (shown in the chip), a title/subtitle for the board, and
// somewhere to fly the camera to.
const ITEMS = [
    { code: 'HND', title: 'Haneda', sub: 'Tokyo, Japan', center: [139.7798, 35.5494], zoom: 15.5 },
    { code: 'CDG', title: 'Charles de Gaulle', sub: 'Paris, France', center: [2.5479, 49.0097], zoom: 15.5 },
    { code: 'JFK', title: 'John F. Kennedy', sub: 'New York, USA', center: [-73.7781, 40.6413], zoom: 15.5 },
    { code: 'DXB', title: 'Dubai Intl', sub: 'Dubai, UAE', center: [55.3644, 25.2532], zoom: 15.5 },
];

const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/standard',
    center: ITEMS[0].center,
    zoom: ITEMS[0].zoom,
    pitch: 60,
});

createLightPresetPill(map);

const barEl = document.getElementById('info-bar');
const currentEl = document.getElementById('current-item');
const itemButtonsEl = document.getElementById('item-buttons');
const chipsToggle = document.getElementById('chips-toggle');
const tourBtn = document.getElementById('tour-toggle');

chipsToggle.addEventListener('click', () => barEl.classList.toggle('expanded'));

function renderCurrent(item) {
    currentEl.innerHTML = `<div class="cur-title">${item.code}</div><div class="cur-sub">${item.title}</div>`;
}

function selectItem(item, { fly = true } = {}) {
    document.querySelectorAll('.item-btn').forEach((b) => b.classList.toggle('active', b.dataset.code === item.code));
    renderCurrent(item);
    if (fly) map.flyTo({ center: item.center, zoom: item.zoom, duration: 1400 });
}

ITEMS.forEach((item) => {
    const btn = document.createElement('button');
    btn.className = 'item-btn';
    btn.dataset.code = item.code;
    btn.textContent = item.code;
    btn.addEventListener('click', () => selectItem(item));
    itemButtonsEl.appendChild(btn);
});
selectItem(ITEMS[0], { fly: false });

let tourTimer = null;
tourBtn.addEventListener('click', () => {
    const running = barEl.classList.contains('touring');
    if (running) {
        clearInterval(tourTimer);
        barEl.classList.remove('touring');
        tourBtn.textContent = '▶ Play';
        tourBtn.classList.remove('running');
        return;
    }
    barEl.classList.add('touring');
    barEl.classList.remove('expanded');
    tourBtn.textContent = '■ Stop';
    tourBtn.classList.add('running');
    let i = ITEMS.findIndex((it) => it.code === document.querySelector('.item-btn.active')?.dataset.code);
    tourTimer = setInterval(() => {
        i = (i + 1) % ITEMS.length;
        selectItem(ITEMS[i]);
    }, 3000);
});
</script>
</body>
</html>
