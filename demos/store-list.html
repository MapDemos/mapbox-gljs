<html lang="ja">

<head>
  <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:;base64,iVBORw0KGgo=" />
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-language/v1.0.0/mapbox-gl-language.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.18.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.18.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/d3@7.8.5/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.2/mapbox-gl-geocoder.min.js"></script>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.2/mapbox-gl-geocoder.css" type="text/css" />
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js" integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM=" crossorigin=""></script>
<script src="/shared/polyline.js" type="module"></script>
<script src="/shared/demo-kit.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #f8f8f8;
      color: #333;
    }

    header {
      background-color: #ED1C24;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    header a {
      color: white;
      font-size: 14px;
    }

    #total-count {
      padding: 16px 20px 0;
      font-size: 14px;
      color: #666;
    }

    /* Flat divided list (no cards/shadows), matching the reference site's
       own new-store list (store-info.skylark.co.jp/list/) - confirmed by
       inspecting its .list-unit/.open-date/.title-with-icon/.actions
       markup and computed styles live. */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    .new-store-item {
      display: block;
      padding: 16px 0;
      border-bottom: 1px solid #eee;
      text-decoration: none;
      color: #333;
    }

    .new-store-date {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .new-store-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .new-store-name {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .new-store-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: white;
      object-fit: contain;
      flex-shrink: 0;
    }

    .new-store-name span {
      font-weight: 700;
      font-size: 20px;
    }

    .new-store-details-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 0 15px;
      background-color: #ED1C24;
      color: white;
      font-size: 14px;
    }

    .new-store-address {
      display: block;
      font-size: 16px;
      margin-top: 8px;
    }

    #pagination {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
    }

    #pagination button {
      border: 1px solid #ddd;
      background-color: white;
      color: #333;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    #pagination button.active {
      background-color: #ED1C24;
      color: white;
      border-color: #ED1C24;
    }
  </style>
</head>

<body>
  <header>
    <h1>新店舗一覧</h1>
    <a href="store-locator.html">← 地図で探す</a>
  </header>
  <div id="total-count">読み込み中...</div>
  <main id="store-list-container"></main>
  <div id="pagination"></div>

  <script>
    const SKYLARK_DATA_FILE = 'skylark-stores.json';
    const PAGE_SIZE = 10;
    let newStores = [];
    let currentPage = 1;

    function renderPage(page) {
      currentPage = page;
      const container = document.getElementById('store-list-container');
      container.innerHTML = '';

      const start = (page - 1) * PAGE_SIZE;
      const pageStores = newStores.slice(start, start + PAGE_SIZE);

      pageStores.forEach(store => {
        const extra = store.extra_fields || {};
        const brandCode = extra['カテゴリ'] || '0101';
        const openDate = new Date(extra['オープン日']);

        const a = document.createElement('a');
        a.className = 'new-store-item';
        a.href = `store-locator.html?lat=${store.latitude}&lng=${store.longitude}&zoom=15.00`;

        const dateEl = document.createElement('p');
        dateEl.className = 'new-store-date';
        dateEl.textContent = `${openDate.getFullYear()}年${openDate.getMonth() + 1}月${openDate.getDate()}日 オープン`;

        const row = document.createElement('div');
        row.className = 'new-store-row';
        row.innerHTML = `
          <div class="new-store-name">
            <img class="new-store-icon" src="assets/brand-icons/${brandCode}.png" alt="">
            <span>${store.name}</span>
          </div>
          <span class="new-store-details-btn">店舗詳細</span>
        `;

        const addr = document.createElement('p');
        addr.className = 'new-store-address';
        addr.textContent = store.address;

        a.appendChild(dateEl);
        a.appendChild(row);
        a.appendChild(addr);
        container.appendChild(a);
      });

      renderPagination();
    }

    function renderPagination() {
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';
      const pageCount = Math.ceil(newStores.length / PAGE_SIZE);
      if (pageCount <= 1) return;

      for (let i = 1; i <= pageCount; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = i;
        btn.className = i === currentPage ? 'active' : '';
        btn.addEventListener('click', () => renderPage(i));
        pagination.appendChild(btn);
      }
    }

    async function init() {
      let stores;
      try {
        const response = await fetch(SKYLARK_DATA_FILE);
        const data = await response.json();
        stores = Array.isArray(data) ? data : (data.items || data.data || data.stores || []);
      } catch (error) {
        document.getElementById('total-count').textContent = '店舗データの読み込みに失敗しました';
        return;
      }

      // R072: mirrors the reference site's own new-store list - only stores
      // flagged 新店フラグ (real data, not a fabricated subset), newest
      // opening date first, not the full store directory grouped by
      // prefecture.
      newStores = stores
        .filter(store => (store.extra_fields || {})['新店フラグ'] === '1')
        .sort((a, b) => new Date(b.extra_fields['オープン日']) - new Date(a.extra_fields['オープン日']));

      document.getElementById('total-count').textContent = `${newStores.length}件の店舗をご紹介します。`;
      renderPage(1);
    }

    init();
  </script>
</body>

</html>
