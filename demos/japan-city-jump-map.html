<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Japan City Jump Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.js"></script>
<script src="shared/demo-kit.js"></script>
<style>
  :root {
    --paper: #F2EFE6;
    --paper-deep: #E6E1D2;
    --pink: #FF48B0;
    --blue: #0078BF;
    --yellow: #FFE800;
    --ink: #1B1A24;
    --ink-muted: #4B4959;
    --success: #0078BF;
    --error: #D6249F;

    --font-display: 'Bricolage Grotesque', 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'Space Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

    --gutter: 16px;
    --card-w: 230px;
    --strip-h: 230px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: var(--paper);
    color: var(--ink);
    font-family: var(--font-mono);
    -webkit-font-smoothing: antialiased;
  }

  button {
    font-family: inherit;
  }

  :focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 3px;
  }

  #map {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 100%;
  }

  .mapboxgl-ctrl-bottom-left,
  .mapboxgl-ctrl-bottom-right {
    bottom: var(--strip-h);
    z-index: 1;
  }

  .zine-title {
    position: absolute;
    top: 18px;
    left: var(--gutter);
    z-index: 4;
    max-width: 280px;
    padding: 12px 16px 12px;
    background: var(--yellow);
    border: 2.5px solid var(--ink);
    transform: rotate(-2.5deg);
    box-shadow: 5px 5px 0 var(--pink), -4px -3px 0 var(--blue);
  }

  .zine-title::after {
    content: '';
    position: absolute;
    right: 0;
    bottom: 0;
    width: 56px;
    height: 40px;
    background-image: radial-gradient(var(--pink) 1.6px, transparent 2px);
    background-size: 7px 7px;
    pointer-events: none;
  }

  .zine-title h1 {
    position: relative;
    margin: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 32px;
    line-height: 0.92;
    letter-spacing: -0.045em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .zine-title .issue {
    position: relative;
    margin-top: 8px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    z-index: 1;
  }

  /* Bottom filmstrip */
  .filmstrip {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 3;
    display: flex;
    align-items: stretch;
    gap: 20px;
    padding: 22px var(--gutter) 24px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    pointer-events: none;
  }

  .filmstrip > * {
    pointer-events: auto;
  }

  .filmstrip::-webkit-scrollbar {
    display: none;
  }

  .zine-card {
    position: relative;
    flex: 0 0 var(--card-w);
    scroll-snap-align: center;
    scroll-snap-stop: always;
    min-height: 150px;
    padding: 0;
    background-color: var(--paper);
    border: 2.5px solid var(--ink);
    box-shadow: 6px 6px 0 var(--pink), -4px -4px 0 var(--blue);
    opacity: 0.88;
    transform: rotate(-0.8deg) scale(0.96);
    transform-origin: 50% 100%;
    transition: transform 0.28s cubic-bezier(.3, 1.6, .5, 1), box-shadow 0.28s ease, opacity 0.2s ease, background-color 0.2s ease;
    overflow: hidden;
  }

  .zine-card:nth-child(3n + 2) {
    transform: rotate(0.7deg) scale(0.96);
    box-shadow: -6px 5px 0 var(--pink), 4px -4px 0 var(--blue);
  }

  .zine-card:nth-child(3n) {
    transform: rotate(-0.3deg) scale(0.96);
    box-shadow: 5px -5px 0 var(--blue), -5px 5px 0 var(--pink);
  }

  .zine-card.is-active {
    opacity: 1;
    transform: rotate(0deg) scale(1);
    box-shadow: 9px 9px 0 var(--pink), -6px -6px 0 var(--blue);
    background-color: #FFFEF8;
    z-index: 1;
  }

  .zine-card.is-active::after {
    content: 'You are here';
    position: absolute;
    top: 10px;
    right: 8px;
    padding: 3px 7px;
    border: 2px solid var(--pink);
    color: var(--pink);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transform: rotate(8deg);
    mix-blend-mode: multiply;
    animation: zine-stamp 0.32s cubic-bezier(.2, 1.8, .4, 1) both;
    pointer-events: none;
  }

  @keyframes zine-stamp {
    from { transform: rotate(8deg) scale(2.2); opacity: 0; }
    to { transform: rotate(8deg) scale(1); opacity: 1; }
  }

  .city-card-btn {
    display: block;
    width: 100%;
    height: 100%;
    padding: 14px 16px 16px;
    background: transparent;
    border: none;
    text-align: left;
    cursor: pointer;
    color: inherit;
  }

  .city-card-btn:disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }

  .card-num {
    display: block;
    margin: 0 0 2px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 48px;
    line-height: 0.85;
    letter-spacing: -0.06em;
    color: var(--blue);
    text-shadow: 3px 3px 0 var(--pink);
    mix-blend-mode: multiply;
  }

  .card-title {
    margin: 4px 0 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 21px;
    line-height: 1;
    letter-spacing: -0.035em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .card-meta {
    margin: 6px 0 0;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--blue);
    min-height: 2.6em;
  }

  .card-tag {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 8px;
    background: var(--yellow);
    border: 1.5px solid var(--ink);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transform: rotate(-2deg);
  }

  .zine-card.is-active .card-tag {
    background: var(--pink);
    color: #fff;
  }

  /* Reset-to-Japan control, alongside the row */
  .reset-wrap {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    scroll-snap-align: none;
  }

  .reset-btn {
    padding: 10px 14px;
    background: var(--blue);
    color: #fff;
    border: 2.5px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.15s ease;
    white-space: nowrap;
  }

  .reset-btn:hover {
    filter: brightness(1.1);
  }

  .reset-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 0 0 0 var(--ink);
  }

  .reset-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Status note, near the bottom row */
  .status-note {
    position: absolute;
    left: var(--gutter);
    bottom: calc(var(--strip-h) + 10px);
    z-index: 3;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 3px 8px;
    background: var(--yellow);
    border: 1.5px solid var(--ink);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transform: rotate(-1deg);
    max-width: calc(100vw - 32px);
  }

  .status-note .status-icon {
    flex: none;
  }

  .status-note.loading .status-icon {
    display: inline-block;
    animation: zine-spin 0.9s linear infinite;
  }

  @keyframes zine-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .status-note.error {
    background: var(--error);
    color: #fff;
  }

  .status-note.success {
    background: var(--blue);
    color: #fff;
  }

  .hidden {
    display: none !important;
  }

  /* Custom HTML marker */
  .zine-marker {
    width: 34px;
    height: 34px;
    cursor: pointer;
  }

  .zine-marker .pin {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    background: var(--yellow);
    border: 2.5px solid var(--ink);
    border-radius: 50%;
    box-shadow: 3px 3px 0 var(--pink), -2px -2px 0 var(--blue);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: -0.03em;
    color: var(--ink);
    transition: transform 0.25s cubic-bezier(.3, 1.6, .5, 1), background 0.2s ease, color 0.2s ease;
  }

  .zine-marker:hover .pin {
    transform: rotate(-8deg) scale(1.1);
  }

  .zine-marker.is-active .pin {
    background: var(--pink);
    color: #fff;
    transform: scale(1.3) rotate(-6deg);
    box-shadow: 4px 4px 0 var(--blue), -2px -2px 0 var(--yellow);
  }

  .zine-marker.is-active {
    z-index: 2;
  }

  .mapboxgl-popup-content {
    font-family: var(--font-mono);
    background: #FFFEF8;
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--pink);
    border-radius: 0;
    padding: 10px 12px;
  }

  .mapboxgl-popup-tip {
    display: none;
  }

  .popup-name {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0 0 2px;
  }

  .popup-sub {
    font-size: 10px;
    color: var(--ink-muted);
    letter-spacing: 0.02em;
  }

  @media (max-width: 640px) {
    :root {
      --card-w: 180px;
      --strip-h: 210px;
    }

    .zine-title {
      top: 14px;
      max-width: calc(100vw - 96px);
      padding: 9px 12px;
    }

    .zine-title h1 {
      font-size: 24px;
    }

    .filmstrip {
      gap: 14px;
      padding-top: 16px;
      padding-bottom: 18px;
    }

    .card-num {
      font-size: 40px;
    }

    .card-title {
      font-size: 17px;
    }

    .mapboxgl-ctrl-top-right {
      top: 8px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .zine-card, .zine-marker .pin, .zine-card.is-active::after {
      transition: none;
      animation: none;
    }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="zine-title">
  <h1>Japan<br />City Jump</h1>
  <div class="issue">Issue 01 &middot; 5 cities &middot; live geocode</div>
</div>

<div class="status-note hidden" id="statusNote" role="status" aria-live="polite">
  <span class="status-icon" aria-hidden="true">&#9679;</span>
  <span id="statusText"></span>
</div>

<div class="filmstrip" id="filmstrip"></div>

<script>
(() => {
  const JAPAN_CENTER = [137, 37];
  const JAPAN_ZOOM = 4.8;
  const FLY_ZOOM = 11;
  const FLY_DURATION = 2000;

  const CITIES = [
    { id: 'tokyo', label: 'Tokyo', tag: 'Kanto', hint: 'Capital, Honshu east coast' },
    { id: 'osaka', label: 'Osaka', tag: 'Kansai', hint: 'Honshu west, Kansai hub' },
    { id: 'nagoya', label: 'Nagoya', tag: 'Chubu', hint: 'Central Honshu' },
    { id: 'sapporo', label: 'Sapporo', tag: 'Hokkaido', hint: 'Northern island capital' },
    { id: 'naha', label: 'Naha', tag: 'Okinawa', hint: 'Southern island chain' },
  ];

  const geocodeCache = Object.create(null);
  const markers = Object.create(null);
  const cityCards = Object.create(null);
  const cityButtons = Object.create(null);
  let activeCityId = null;

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v12',
    center: JAPAN_CENTER,
    zoom: JAPAN_ZOOM,
  });
  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');

  const strip = document.getElementById('filmstrip');
  const statusNote = document.getElementById('statusNote');
  const statusText = document.getElementById('statusText');

  function showStatus(message, kind) {
    statusText.textContent = message;
    statusNote.classList.remove('hidden', 'loading', 'success', 'error');
    if (kind) statusNote.classList.add(kind);
  }

  function hideStatus() {
    statusNote.classList.add('hidden');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function setActiveCity(cityId) {
    activeCityId = cityId;
    CITIES.forEach((c) => {
      const card = cityCards[c.id];
      const btn = cityButtons[c.id];
      if (card) card.classList.toggle('is-active', c.id === cityId);
      if (btn) btn.setAttribute('aria-pressed', String(c.id === cityId));
    });
    Object.keys(markers).forEach((id) => {
      markers[id].getElement().classList.toggle('is-active', id === cityId);
    });
  }

  function buildMarkerEl(index) {
    const el = document.createElement('div');
    el.className = 'zine-marker';
    el.innerHTML = `<div class="pin">${index + 1}</div>`;
    return el;
  }

  function placeMarker(cityId, index, lngLat, placeName, placeFormatted) {
    if (markers[cityId]) {
      markers[cityId].remove();
    }
    const el = buildMarkerEl(index);
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', `${placeName} marker`);

    const popupHtml = `
      <div class="popup-name">${escapeHtml(placeName)}</div>
      <div class="popup-sub">${escapeHtml(placeFormatted || '')}</div>`;

    const popup = new mapboxgl.Popup({ offset: 20, closeButton: true }).setHTML(popupHtml);

    const marker = new mapboxgl.Marker({ element: el, anchor: 'center' })
      .setLngLat(lngLat)
      .setPopup(popup)
      .addTo(map);

    const activateFromMarker = () => {
      setActiveCity(cityId);
      marker.togglePopup();
    };
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      activateFromMarker();
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        activateFromMarker();
      }
    });

    markers[cityId] = marker;
  }

  async function geocodeCity(cityLabel) {
    if (geocodeCache[cityLabel]) {
      return geocodeCache[cityLabel];
    }
    const query = encodeURIComponent(cityLabel);
    const url = `https://api.mapbox.com/search/geocode/v6/forward?q=${query}&country=jp&types=place&access_token=${mapboxgl.accessToken}`;
    const res = await fetch(url);
    if (!res.ok) {
      throw new Error(`Geocoding request failed (${res.status})`);
    }
    const data = await res.json();
    const feature = data && data.features && data.features[0];
    if (!feature) {
      throw new Error('No match found');
    }
    const result = {
      lngLat: feature.geometry.coordinates,
      name: feature.properties.name || cityLabel,
      placeFormatted: feature.properties.place_formatted || '',
    };
    geocodeCache[cityLabel] = result;
    return result;
  }

  function setAllDisabled(disabled) {
    Object.keys(cityButtons).forEach((id) => { cityButtons[id].disabled = disabled; });
    resetBtn.disabled = disabled;
  }

  async function jumpToCity(city, index) {
    setAllDisabled(true);
    showStatus(`Locating ${city.label}…`, 'loading');

    try {
      const result = await geocodeCity(city.label);
      placeMarker(city.id, index, result.lngLat, result.name, result.placeFormatted);
      setActiveCity(city.id);
      map.flyTo({
        center: result.lngLat,
        zoom: FLY_ZOOM,
        duration: FLY_DURATION,
        essential: true,
      });
      hideStatus();
    } catch (err) {
      showStatus(`Couldn't find ${city.label}. Try again.`, 'error');
    } finally {
      setAllDisabled(false);
    }
  }

  // Build filmstrip cards
  CITIES.forEach((city, index) => {
    const card = document.createElement('article');
    card.className = 'zine-card';
    card.dataset.index = index;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'city-card-btn';
    btn.id = `city-btn-${city.id}`;
    btn.setAttribute('aria-pressed', 'false');
    btn.innerHTML = `
      <span class="card-num">${String(index + 1).padStart(2, '0')}</span>
      <h2 class="card-title">${city.label}</h2>
      <p class="card-meta">Tap to geocode and fly in</p>
      <span class="card-tag">${city.tag}</span>`;
    btn.addEventListener('click', () => jumpToCity(city, index));

    card.appendChild(btn);
    strip.appendChild(card);
    cityCards[city.id] = card;
    cityButtons[city.id] = btn;
  });

  // Reset-to-Japan control, alongside the bottom row
  const resetWrap = document.createElement('div');
  resetWrap.className = 'reset-wrap';
  const resetBtn = document.createElement('button');
  resetBtn.type = 'button';
  resetBtn.className = 'reset-btn';
  resetBtn.textContent = 'Full Japan view';
  resetBtn.addEventListener('click', () => {
    setActiveCity(null);
    map.flyTo({
      center: JAPAN_CENTER,
      zoom: JAPAN_ZOOM,
      duration: FLY_DURATION,
      essential: true,
    });
  });
  resetWrap.appendChild(resetBtn);
  strip.appendChild(resetWrap);

  function syncStripHeight() {
    const h = strip.offsetHeight;
    document.documentElement.style.setProperty('--strip-h', h + 'px');
    map.setPadding({ top: 0, left: 0, right: 0, bottom: h });
  }

  map.on('load', () => {
    syncStripHeight();
  });
  window.addEventListener('resize', syncStripHeight);
})();
</script>
</body>
</html>
