#map {

}

.hero-step {
    position: relative;
    padding: 0;
    justify-content: center;
}

.hero-step::before {

    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(180deg, rgba(245, 241, 232, 0.8) 0%, rgba(251, 248, 241, 0.8) 50%, rgba(245, 241, 232, 0.8) 100%);
}

.hero {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px 20px;
}

.hero-tagline {
    margin: 0 0 24px;
    font-family: var(--font-label);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-muted);
}

.hero-name {
    font-family: var(--font-headline);
    font-weight: 900;
    line-height: 0.95;
    color: var(--ink);
}

.hero-name div {
    font-size: clamp(48px, 11vw, 120px);
}

.hero-logo {
    display: block;
    margin: 32px auto 0;
    width: 96px;
    height: auto;
}

.chapter-divider {
    box-sizing: border-box;
    position: relative;
    z-index: 1;
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px 20px;
}

.chapter-divider::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, rgba(245, 241, 232, 0.8) 0%, rgba(251, 248, 241, 0.8) 50%, rgba(245, 241, 232, 0.8) 100%);
}

.chapter-divider .chapter-number {
    margin: 0 0 10px;
    font-family: var(--font-label);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
}

.chapter-divider h2 {
    margin: 0;
    font-family: var(--font-headline);
    font-weight: 900;
    font-size: clamp(40px, 8vw, 80px);
    color: var(--ink);
}

#features {
    padding-top: 0;
    padding-bottom: 0;
}

.hidden {
    visibility: hidden;
}

.centered {
    justify-content: center;
}

.lefty {
    justify-content: flex-start;
}

.righty {
    justify-content: flex-end;
}

.fully {
    justify-content: center;
}

.step {
    box-sizing: border-box;
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0 8vw;
    opacity: 0.25;
}

.step.active {
    opacity: 0.9;
}

.step .paper-card {
    max-width: 480px;
    width: 100%;
}

.step .paper-card h3 {
    margin: 0 0 10px;
    font-family: var(--font-headline);
    font-weight: 900;
    font-size: 24px;
    color: var(--ink);
}

.step .paper-card img {
    display: block;
    width: calc(100% + 44px);
    margin: 0 -22px 16px;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    filter: grayscale(0.4) sepia(0.15);
    border-bottom: 1px solid var(--rule);
}

@media (max-width: 750px) {
    .step {
        justify-content: center;
        padding: 0 6vw;
    }
}

/* Fix issue on mobile browser where scroll breaks  */

var initLoad = true;
// Tracks which onStepEnter call is the most recent one, independent of the
// DOM's .active class — scrollama's enter/exit events don't always fire in
// a clean order on fast or reversed scroll, which can leave more than one
// step's .active class set at once. Comparing against this counter instead
// guarantees only the latest requested transition ever drives the camera.
var activeChapterRequestId = 0;
var layerTypes = {
    'fill': ['fill-opacity'],
    'line': ['line-opacity'],
    'circle': ['circle-opacity', 'circle-stroke-opacity'],
    'symbol': ['icon-opacity', 'text-opacity'],
    'raster': ['raster-opacity'],
    'fill-extrusion': ['fill-extrusion-opacity'],
    'heatmap': ['heatmap-opacity']
};

var alignments = {
    'left': 'lefty',
    'center': 'centered',
    'right': 'righty',
    'full': 'fully'
};

function getLayerPaintType(layer) {
    var layerType = map.getLayer(layer).type;
    return layerTypes[layerType];
}

function setLayerOpacity(layer) {
    var paintProps = getLayerPaintType(layer.layer);
    paintProps.forEach(function (prop) {
        var options = {};
        if (layer.duration) {
            var transitionProp = prop + '-transition';
            options = { 'duration': layer.duration };
            map.setPaintProperty(layer.layer, transitionProp, options);
        }
        map.setPaintProperty(layer.layer, prop, layer.opacity, options);
    });
}

            pullQuote.appendChild(headline);

            var byline = document.createElement('span');
            byline.classList.add('byline');
            byline.innerText = [record.era, record.place].filter(Boolean).join(' — ');
            pullQuote.appendChild(byline);

            chapter.appendChild(pullQuote);
        }

        if (record.narration) {
            var story = document.createElement('p');
            story.innerHTML = record.narration;
            chapter.appendChild(story);
        }
    }

    container.setAttribute('id', record.id);
    container.classList.add('step');
    if (record.isHero) {
        container.classList.add('hero-step');
    }
    if (idx === 0) {
        container.classList.add('active');
    }

    if (!record.isHero) {
        chapter.classList.add('paper-card');
    }
    container.appendChild(chapter);
    if (!record.isHero) {
        container.classList.add(alignments[record.alignment] || 'centered');
    }
    if (record.hidden) {
        container.classList.add('hidden');
    }
    features.appendChild(container);
});

story.appendChild(features);

const transformRequest = (url) => {
    const hasQuery = url.indexOf('?') !== -1;
    const suffix = hasQuery ? '&pluginName=scrollytellingV2' : '?pluginName=scrollytellingV2';
    return {
        url: url + suffix
    };
};

var map = new mapboxgl.Map({
    container: 'map',
    style: config.style,
    center: config.chapters[0].location.center,
    zoom: config.chapters[0].location.zoom,
    bearing: config.chapters[0].location.bearing,
    pitch: config.chapters[0].location.pitch,
    interactive: false,
    transformRequest: transformRequest,
    projection: config.projection,
    language: 'ja'
});

// Create a inset map if enabled in config.js
if (config.inset) {
    var insetMap = new mapboxgl.Map({
        container: 'mapInset', // container id
        style: 'mapbox://styles/mapbox/dark-v10', //hosted style id
        center: config.chapters[0].location.center,
        // Hardcode above center value if you want insetMap to be static.
        zoom: 3, // starting zoom
        hash: false,
        interactive: false,
        attributionControl: false,
        //Future: Once official mapbox-gl-js has globe view enabled,
        //insetmap can be a globe with the following parameter.
        //projection: 'globe'
    });
}

if (config.showMarkers) {
    // Visibility is toggled with addTo/remove (not a style.opacity property)
    // at the start/end of each scroll-triggered flight — see onStepEnter
    // below. Mapbox's Marker has its own continuous occlusion-based opacity
    // management (occludedOpacity) that re-asserts every render frame and
    // silently overwrites any manually-set style.opacity, so that approach
    // doesn't work here.
    var marker = new mapboxgl.Marker({ color: config.markerColor });
    marker.setLngLat(config.chapters[0].location.center);
}

// instantiate the scrollama
var scroller = scrollama();


map.on('load', function () {
    map.setConfigProperty('basemap', 'lightPreset', 'day');

    if (config.use3dTerrain) {
        map.addSource('mapbox-dem', {
            'type': 'raster-dem',
            'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
            'tileSize': 512,
            'maxzoom': 14
        });
        // add the DEM source as a terrain layer with exaggerated height
        map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });

        // add a sky layer that will show when the map is highly pitched
        map.addLayer({
            'id': 'sky',
            'type': 'sky',
            'paint': {
                'sky-type': 'atmosphere',
                'sky-atmosphere-sun': [0.0, 0.0],
                'sky-atmosphere-sun-intensity': 15
            }
        });
    };

    // As the map moves, grab and update bounds in inset map.
    if (config.inset) {
        map.on('move', getInsetBounds);
    }
    // setup the instance, pass callback functions
    scroller
        .setup({
            step: '.step',
            offset: 0.5,
            progress: true
        })
        .onStepEnter(async response => {
            var current_chapter = config.chapters.findIndex(chap => chap.id === response.element.id);
            var chapter = config.chapters[current_chapter];

            response.element.classList.add('active');

            // If the user scrolls past this step before its animation chain
            // finishes, a newer onStepEnter call takes over — bail out of this
            // stale chain instead of letting it fire flyTo/opacity changes for
            // a step that's no longer current. Uses a counter rather than the
            // .active class, since scrollama can leave more than one step
            // marked .active at once on fast/reversed scroll.
            var requestId = ++activeChapterRequestId;
            var isStale = function () {
                return requestId !== activeChapterRequestId;
            };

            // Fly to the next chapter as one continuous motion: zoom out to a
            // wide globe view, then zoom back in to the chapter's actual
            // location, instead of flying directly there.
            if (config.showMarkers) {
                marker.remove();
            }

            var start = {
                lng: map.getCenter().lng,
                lat: map.getCenter().lat,
                zoom: map.getZoom(),
                pitch: map.getPitch(),
                bearing: map.getBearing()
            };
            var target = {
                lng: chapter.location.center[0],
                lat: chapter.location.center[1],
                zoom: chapter.location.zoom,
                pitch: chapter.location.pitch || 0,
                bearing: chapter.location.bearing || 0
            };
            var globeZoom = 1.2;

            function easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }

            var duration = 2600;
            var startTime = null;

            function step(timestamp) {
                if (isStale()) { return; }
                if (startTime === null) { startTime = timestamp; }
                var progress = Math.min((timestamp - startTime) / duration, 1);

                var lng = start.lng + (target.lng - start.lng) * easeInOutCubic(progress);
                var lat = start.lat + (target.lat - start.lat) * easeInOutCubic(progress);

                var zoom, pitch, bearing;
                if (progress < 0.5) {
                    var pOut = easeInOutCubic(progress / 0.5);
                    zoom = start.zoom + (globeZoom - start.zoom) * pOut;
                    pitch = start.pitch + (0 - start.pitch) * pOut;
                    bearing = start.bearing + (0 - start.bearing) * pOut;
                } else {
                    var pIn = easeInOutCubic((progress - 0.5) / 0.5);
                    zoom = globeZoom + (target.zoom - globeZoom) * pIn;
                    pitch = 0 + (target.pitch - 0) * pIn;
                    bearing = 0 + (target.bearing - 0) * pIn;
                }

                map.jumpTo({ center: [lng, lat], zoom: zoom, pitch: pitch, bearing: bearing });

                if (progress < 1) {
                    requestAnimationFrame(step);
                    return;
                }

                if (config.showMarkers) {
                    if (target.zoom > 5) {
                        marker.setLngLat([target.lng, target.lat]).addTo(map);
                    } else {
                        marker.remove();
                    }
                }
                if (chapter.rotateAnimation) {
                    const rotateNumber = map.getBearing();
                    map.rotateTo(rotateNumber + 180, {
                        duration: 30000, easing: function (t) {
                            return t;
                        }
                    });
                }
                if (config.auto) {
                    var next_chapter = (current_chapter + 1) % config.chapters.length;
                    document.querySelectorAll('[data-scrollama-index="' + next_chapter.toString() + '"]')[0].scrollIntoView();
                }
            }
            requestAnimationFrame(step);

            // Incase you do not want to have a dynamic inset map,
            // rather want to keep it a static view but still change the
            // bbox as main map move: comment out the below if section.
            if (config.inset) {
                if (chapter.location.zoom < 5) {
                    insetMap.flyTo({ center: chapter.location.center, zoom: 0 });
                }
                else {
                    insetMap.flyTo({ center: chapter.location.center, zoom: 3 });
                }
            }
            if (config.showMarkers) {
                marker.setLngLat(chapter.location.center);
            }
            if (chapter.onChapterEnter.length > 0) {
                chapter.onChapterEnter.forEach(setLayerOpacity);
            }
            if (chapter.callback) {
                window[chapter.callback]();
            }
        })
        .onStepExit(response => {
            var chapter = config.chapters.find(chap => chap.id === response.element.id);
            response.element.classList.remove('active');
            if (chapter.onChapterExit.length > 0) {
                chapter.onChapterExit.forEach(setLayerOpacity);
            }
        });


    if (config.auto) {
        document.querySelectorAll('[data-scrollama-index="0"]')[0].scrollIntoView();
    }
});

//Helper functions for insetmap
function getInsetBounds() {
    let bounds = map.getBounds();

    let boundsJson = {
        'type': 'FeatureCollection',
        'features': [{
            'type': 'Feature',
            'properties': {},
            'geometry': {
                'type': 'Polygon',
                'coordinates': [
                    [
                        [
                            bounds._sw.lng,
                            bounds._sw.lat
                        ],
                        [
                            bounds._ne.lng,
                            bounds._sw.lat
                        ],
                        [
                            bounds._ne.lng,
                            bounds._ne.lat
                        ],
                        [
                            bounds._sw.lng,
                            bounds._ne.lat
                        ],
                        [
                            bounds._sw.lng,
                            bounds._sw.lat
                        ]
                    ]
                ]
            }
        }]
    };

    if (initLoad) {
        addInsetLayer(boundsJson);
        initLoad = false;
    } else {
        updateInsetLayer(boundsJson);
    }

}

function addInsetLayer(bounds) {
    insetMap.addSource('boundsSource', {
        'type': 'geojson',
        'data': bounds
    });

    insetMap.addLayer({
        'id': 'boundsLayer',
        'type': 'fill',
        'source': 'boundsSource', // reference the data source
        'layout': {},
        'paint': {
            'fill-color': '#fff', // blue color fill
            'fill-opacity': 0.2
        }
    });
    // // Add a black outline around the polygon.
    insetMap.addLayer({
        'id': 'outlineLayer',
        'type': 'line',
        'source': 'boundsSource',
        'layout': {},
        'paint': {
            'line-color': '#000',
            'line-width': 1
        }
    });
}

function updateInsetLayer(bounds) {
    insetMap.getSource('boundsSource').setData(bounds);
}
    </script>
</body>
</html>
