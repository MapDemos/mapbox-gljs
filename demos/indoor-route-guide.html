<!DOCTYPE html>
<html lang="en">
<head>
    <title>Indoor Route Guide</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="https://static-assets.mapbox.com/branding/favicon/v1/favicon.ico" />
    <!-- Indoor maps require Mapbox GL JS v3.21+ -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.21.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.21.0/mapbox-gl.css" rel="stylesheet" />
    <script src="shared/demo-kit.js"></script>
    <style>
        html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #15171c; }
        #map { position: absolute; inset: 0; }
        /* Floor selector rides just above the bottom sheet, whatever height the sheet is */
        .mapboxgl-ctrl-top-right { top: auto; bottom: calc(var(--sheet-h, 0px) + var(--foot) + 12px); transition: bottom .2s; }
        /* Strip under the panel that holds the Mapbox logo and attribution, so the panel never covers them */
        :root { --foot: 36px; }
        .mapboxgl-ctrl-bottom-left, .mapboxgl-ctrl-bottom-right { z-index: 2; }
        .foot-strip { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot); background: #15171c; z-index: 1; pointer-events: none; }
        .sheet { position: absolute; left: 0; right: 0; bottom: var(--foot); max-width: 480px; margin: 0 auto; background: #1b1d22; color: #fff;
                 border-radius: 16px 16px 0 0; box-shadow: 0 -4px 16px #0008; max-height: 75vh; display: flex; flex-direction: column; }
        .sheet header { padding: 14px 20px 10px; text-align: center; cursor: grab; touch-action: none; user-select: none; border-bottom: 1px solid #2c2f36; flex: none; }
        .sheet header::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: #555; margin: 0 auto 10px; }
        .sheet h1 { margin: 0; font-size: 17px; }
        .sheet header small { color: #9aa0aa; }
        .sheet.dragging { transition: none; }
        .sheet.dragging header { cursor: grabbing; }
        ol { list-style: none; margin: 0; padding: 0; overflow: auto; }
        .sheet.collapsed ol { display: none; }
        li { display: flex; gap: 16px; padding: 14px 20px; border-bottom: 1px solid #2c2f36; cursor: pointer; align-items: flex-start; }
        li.active { background: #262a33; }
        li .ico { font-size: 22px; width: 28px; text-align: center; }
        li b { display: block; font-size: 15px; margin-bottom: 2px; }
        li span { color: #9aa0aa; font-size: 13px; line-height: 1.35; }
        .mapboxgl-ctrl-group { background: #23262d; border-radius: 22px; }
        /* Flag at the end of the route: where the user meets the driver */
        .flag { display: none; pointer-events: none; text-align: center; }
        .flag svg { display: block; margin: 0 auto; filter: drop-shadow(0 2px 3px #0008); }
        .flag span { display: inline-block; margin-bottom: 4px; padding: 3px 9px; border-radius: 10px; background: #fff; color: #111; font-size: 12px; font-weight: 600; white-space: nowrap; box-shadow: 0 1px 4px #0006; }
        .route-pick { position: absolute; top: 16px; left: 16px; background: #23262d; color: #fff; border: 0; border-radius: 16px; padding: 6px 10px; font-size: 13px; box-shadow: 0 2px 8px #0006; }
        .mode-seg { position: absolute; top: 60px; left: 16px; display: flex; background: #23262d; border-radius: 16px; padding: 3px; box-shadow: 0 2px 8px #0006; }
        .mode-seg button { border: 0; background: none; color: #9aa0aa; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 13px; cursor: pointer; }
        .mode-seg button.on { background: #3b82f6; color: #fff; }
        /* The geolocate control is driven by the Simulated/Real toggle, so its own button stays hidden */
        .mapboxgl-ctrl-geolocate { display: none; }
        .mapboxgl-ctrl-group:has(> .mapboxgl-ctrl-geolocate:only-child) { display: none; }
        .gps-seg { position: absolute; top: 112px; right: 16px; display: flex; background: #23262d; border-radius: 16px; padding: 3px; box-shadow: 0 2px 8px #0006; }
        .gps-seg[hidden] { display: none; }
        .gps-seg button { border: 0; background: none; color: #9aa0aa; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 13px; cursor: pointer; }
        .gps-seg button.on { background: #3b82f6; color: #fff; }
        .sim-btn { position: absolute; top: 16px; right: 16px; height: 44px; padding: 0 16px; border: 0; border-radius: 22px;
                   background: #2563eb; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px #0006; }
        .sim-btn.running { background: #23262d; }
        /* User position puck: blue dot + view cone that points along the heading */
        .puck { width: 110px; height: 110px; position: relative; pointer-events: none; }
        .puck-cone { position: absolute; inset: 0; border-radius: 50%;
                     background: conic-gradient(from -35deg, rgba(96,165,250,.95) 0deg 70deg, transparent 70deg);
                     -webkit-mask-image: radial-gradient(circle closest-side, #000 15%, transparent 100%); mask-image: radial-gradient(circle closest-side, #000 15%, transparent 100%); }
        /* Same look as the GPS demo's user-location puck */
        .puck-accuracy { position: absolute; left: 50%; top: 50%; width: var(--acc, 44px); height: var(--acc, 44px); transform: translate(-50%, -50%); border-radius: 50%; box-sizing: border-box;
                         background: rgba(59, 130, 246, 0.15); border: 2px solid rgba(59, 130, 246, 0.3); }
        .puck-dot { position: absolute; left: 50%; top: 50%; width: 15px; height: 15px; margin: -10.5px 0 0 -10.5px; border-radius: 50%; box-sizing: content-box;
                    border: 3px solid #fff; background-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <select class="route-pick" id="route-pick" aria-label="Route">
        <option value="GRU-T3-gate305">T3 · gate 305</option>
        <option value="GRU-T3-gate319">T3 · gate 319</option>
        <option value="GRU-T2-gate105">T2 · gate 105</option>
    </select>
    <button class="sim-btn" id="sim-btn">▶ Simulate walk</button>
    <div class="mode-seg" id="mode-seg" title="Where the blue dot comes from"><button data-m="sim" class="on">Simulated</button><button data-m="real">My location</button></div>
    <div class="gps-seg" id="gps-seg" title="Simulated GPS quality" hidden><button data-q="good">Good GPS</button><button data-q="fair">Fair</button><button data-q="poor" class="on">Poor</button></div>

    <div class="foot-strip"></div>
    <div class="sheet" id="sheet">
        <header id="sheet-head">
            <h1>Walk to pickup point</h1>
            <small>Terminal exit → pickup zone · Level <span id="route-levels"></span></small>
        </header>
        <ol id="steps"></ol>
    </div>

    <script>
        // Terminal centre (GRU). Each step flies to a point on the matching floor.
        const MIN_INDOOR_ZOOM = 17;
        const FOOT = 36;   // px, matches --foot in the CSS
        // Route file (data/<name>.geojson): chosen with ?route=, default T3 gate 305. Each feature is one
        // step; its instructions, level and line come from the file itself.
        const ROUTE_NAMES = [...document.querySelectorAll('#route-pick option')].map(o => o.value);
        const ROUTE = ROUTE_NAMES.includes(new URLSearchParams(location.search).get('route')) ? new URLSearchParams(location.search).get('route') : ROUTE_NAMES[0];
        document.getElementById('route-pick').value = ROUTE;
        document.getElementById('route-pick').addEventListener('change', e => { location.search = '?route=' + e.target.value; });
        let START = [-46.4745, -23.4256];   // replaced by the first vertex of the first route once loaded
        let START_LEVEL = 0;
        const STEPS = [];
        const iconFor = t => /immigration/i.test(t) ? '🛂' : /baggage/i.test(t) ? '🧳' : /driver|zone/i.test(t) ? '📍' : '🚶';

        // Each step is one drawn route (in drawing order); its pt/level are read from the data.
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/standard',
            center: START, zoom: 18, pitch: 0,
            config: { basemap: { showIndoor: true, lightPreset: 'night' } }
        });
        map.addControl(new mapboxgl.IndoorControl(), 'top-right');

        // Real location: same GeolocateControl setup as the indoor GPS demo (blue dot, heading, accuracy circle).
        const geolocate = new mapboxgl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 },
            trackUserLocation: true, showUserHeading: true, showUserLocation: true, showAccuracyCircle: true,
            fitBoundsOptions: { maxZoom: 18 }
        });
        map.addControl(geolocate, 'bottom-left');
        let realMode = false, geoActive = false;
        geolocate.on('trackuserlocationstart', () => { geoActive = true; });
        geolocate.on('trackuserlocationend', () => { geoActive = false; });
        geolocate.on('error', err => {
            console.error('Geolocation error:', err);
            alert(err.code === 1 ? 'Location permission denied. Please allow location access for this site.' : 'Unable to get your location.');
            setMode('sim');
        });
        function setMode(mode) {
            const real = mode === 'real';
            if (real === realMode) return;
            realMode = real;
            document.querySelectorAll('#mode-seg button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
            document.getElementById('sim-btn').style.display = real ? 'none' : '';
            document.getElementById('gps-seg').hidden = true;
            if (real) {
                stopSim();
                puck.remove(); puckOnMap = false;
                if (!geoActive) geolocate.trigger();
            } else {
                for (let i = 0; i < 3 && geoActive; i++) geolocate.trigger();   // active-lock -> off
                puck.addTo(map); puckOnMap = true;
            }
            updatePuck();
        }
        document.querySelectorAll('#mode-seg button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));

        let routeData = null;
        let currentLevel = null;

        // The floor control exposes no public API/event in v3.21, so read the
        // selected button's label from its DOM and re-filter on every change.
        function readLevel() {
            const sel = document.querySelector('.mapboxgl-ctrl-level-button-selected[aria-label]');
            const n = sel ? parseInt(sel.getAttribute('aria-label'), 10) : NaN;
            return Number.isNaN(n) ? null : n;
        }
        // After a manual floor switch, bring that floor's route into view unless all of it is already on screen.
        function revealRoute(level) {
            if (!routeData || level === null) return;
            const coords = routeData.features.filter(f => f.properties.level === level).flatMap(f => f.geometry.coordinates);
            if (!coords.length) return;
            const b = coords.reduce((bb, c) => bb.extend(c), new mapboxgl.LngLatBounds(coords[0], coords[0]));
            const view = map.getBounds();
            if (view.contains(b.getSouthWest()) && view.contains(b.getNorthEast())) return;   // whole route already in view
            // Fit the route, but never zoom out below MIN_INDOOR_ZOOM: the floor selector disappears
            // once the zoom drops under ~16, and a small screen with a tall panel would otherwise get there.
            const padding = { top: 80, left: 40, right: 40, bottom: document.getElementById('sheet').offsetHeight + FOOT + 40 };
            const cam = map.cameraForBounds(b, { padding, maxZoom: 18.5 });
            if (cam) map.easeTo({ center: cam.center, zoom: Math.max(cam.zoom, MIN_INDOOR_ZOOM), padding, duration: 1200 });
        }
        // Meet-your-driver flag: placed at the end of the last route, shown on that route's floor.
        let flag = null, flagLevel = null;
        function addFlag() {
            const last = routeData.features[routeData.features.length - 1];
            const end = last.geometry.coordinates[last.geometry.coordinates.length - 1];
            flagLevel = last.properties.level;
            const el = document.createElement('div');
            el.className = 'flag';
            el.innerHTML = '<span>Meet your driver</span><svg width="34" height="44" viewBox="0 0 34 44"><rect x="6" y="4" width="3" height="40" rx="1.5" fill="#fff"/><path d="M9 5 H30 L24 13 L30 21 H9 Z" fill="#ef4444" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>';
            // anchor 'bottom-left' would sit the pole's foot on the point; shift so the pole (x=7.5) is on it.
            flag = new mapboxgl.Marker({ element: el, anchor: 'bottom', offset: [9.5, 0] }).setLngLat(end).addTo(map);
            updateFlag();
        }
        // Before/after a walk the puck shows only on its own floor; during a walk it is always shown.
        function updatePuck() { if (typeof puckEl !== 'undefined') puckEl.style.display = !realMode && (running || puckFloor === currentLevel) ? 'block' : 'none'; }
        function updateFlag() { if (flag) flag.getElement().style.display = currentLevel === flagLevel ? 'block' : 'none'; }
        function applyLevel(level) {
            if (level === currentLevel) return;
            const first = currentLevel === null || currentLevel === undefined;
            currentLevel = level;
            if (!first && !running && userPickedFloor) revealRoute(level);   // not for the automatic start-floor selection
            updateFlag();
            updatePuck();
            showFloorRoutes();
        }
        // The source only ever holds the current floor's routes, and is given fresh data on every
        // floor change. (A layer filter was left drawing nothing after a floor switch + camera jump
        // in real Chrome, even with the right value; new data can't go stale like that.)
        let selectedLeg = null;   // step picked from the list: only that route is drawn (null = all routes on the floor)
        const EMPTY = { type: 'FeatureCollection', features: [] };
        function showFloorRoutes() {
            const src = map.getSource('routes');
            if (!src || !routeData) return;
            src.setData(currentLevel === null || currentLevel === undefined ? EMPTY
                : { type: 'FeatureCollection', features: routeData.features.filter((f, i) => f.properties.level === currentLevel && (selectedLeg === null || i === selectedLeg)) });
        }
        new MutationObserver(() => applyLevel(running && puckLevel !== null ? puckLevel : readLevel())).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'] });

        map.on('style.load', async () => {
            routeData = await fetch(`data/${ROUTE}.geojson`).then(r => r.json());
            routeData.features.sort((a, b) => new Date(a.properties.created) - new Date(b.properties.created));
            // One step per route, starting at the route's first vertex, on that route's floor.
            routeData.features.forEach(f => STEPS.push({ icon: iconFor(f.properties.instructions), title: f.properties.instructions, text: `Level ${f.properties.level}`, level: f.properties.level, pt: f.geometry.coordinates[0] }));
            START = routeData.features[0].geometry.coordinates[0];
            START_LEVEL = routeData.features[0].properties.level;
            buildSteps();
            buildPath();
            const levels = [...new Set(routeData.features.map(f => f.properties.level))].sort((a, b) => b - a);
            document.getElementById('route-levels').textContent = levels.join(' / ');

            map.addSource('routes', { type: 'geojson', lineMetrics: true, data: EMPTY });
            // slot 'top' keeps the route above the indoor floor plan.
            // Mapbox "Add a patterned line" example: line-pattern + line-join 'none',
            // with a line-width that doubles within each zoom level so the width
            // stays constant in tile space and the dots keep their aspect ratio.
            const baseWidth = 14, widthStops = [];
            for (let z = 0; z <= 21; z++) widthStops.push(z, baseWidth, z + 0.9999, baseWidth * 2);
            widthStops.push(22, baseWidth * 2);
            const dot = await new Promise((res, rej) => map.loadImage('assets/pattern-dot.png', (e, img) => e ? rej(e) : res(img)));
            map.addImage('pattern-dot', dot);
            map.addLayer({ id: 'route-dots', type: 'line', source: 'routes', slot: 'top',
                layout: { 'line-join': 'none' },
                paint: { 'line-pattern': 'pattern-dot', 'line-emissive-strength': 2,
                         'line-width': ['interpolate', ['exponential', 2], ['zoom'], ...widthStops] } });
            addFlag();
            placeStartPuck();
            selectStartFloor();
            currentLevel = undefined;
            applyLevel(readLevel());
            showFloorRoutes();
        });

        // Steps list: tap to fly to the step and switch the floor.
        const ol = document.getElementById('steps');
        function buildSteps() { STEPS.forEach((s, i) => {
            const li = document.createElement('li');
            li.innerHTML = `<div class="ico">${s.icon}</div><div><b>${s.title}</b><span>${s.text}</span></div>`;
            li.addEventListener('click', () => {
                stopSim();
                selectedLeg = i;
                showFloorRoutes();
                setActiveStep(i);
                map.flyTo({ center: s.pt, zoom: 19, duration: 1500 });
                // Click the matching floor button (aria-label = floor name).
                document.querySelector(`.mapboxgl-ctrl-level-button[aria-label="${s.level}"]`)?.click();
            });
            ol.appendChild(li);
        }); }

        // ---- Simulated user position ------------------------------------------
        const SPEED_MPS = 12;   // sped up so the whole walk takes about half a minute
        const meters = (a, b) => Math.hypot((b[0] - a[0]) * Math.cos(a[1] * Math.PI / 180) * 111320, (b[1] - a[1]) * 110540);
        const headingOf = (a, b) => (Math.atan2((b[0] - a[0]) * Math.cos(a[1] * Math.PI / 180), b[1] - a[1]) * 180 / Math.PI + 360) % 360;

        // Join the routes in the order they were drawn into one path; each vertex
        // keeps its floor and its distance from the start.
        let path = null;
        function buildPath() {
            // Feature i is step i: each step starts where its route begins.
            const feats = routeData.features;
            const pts = []; let d = 0;
            feats.forEach((f, fi) => f.geometry.coordinates.forEach((c, ci) => {
                const prev = pts[pts.length - 1];
                if (prev) d += meters(prev.c, c);
                pts.push({ c, level: f.properties.level, d });
                if (STEPS[fi] && ci === 0) STEPS[fi].startD = d;
            }));
            path = { pts, total: d };
        }
        function poseAt(dist) {
            const pts = path.pts;
            let i = 0;
            while (i < pts.length - 2 && pts[i + 1].d <= dist) i++;
            const a = pts[i], b = pts[i + 1];
            const t = b.d === a.d ? 0 : Math.min(1, Math.max(0, (dist - a.d) / (b.d - a.d)));
            return { c: [a.c[0] + (b.c[0] - a.c[0]) * t, a.c[1] + (b.c[1] - a.c[1]) * t], level: a.level, heading: headingOf(a.c, b.c) };
        }

        // Show the puck at the beginning of the route (gate 309) before any walk starts.
        function placeStartPuck() {
            if (!path) buildPath();
            const p = poseAt(0);
            routeHeading = moveHeading = shownHeading = p.heading;
            puckFloor = p.level;
            fitPadding();
            map.jumpTo({ center: p.c });   // centre it in the part of the map the panel doesn't cover
            puck.setLngLat(p.c).setRotation(p.heading).addTo(map);
            puckOnMap = true;
            updatePuck();
        }
        // Open on the puck's floor. The floor control only fills in once the building is detected, so
        // retry for a few seconds, and stop as soon as the user picks a floor themselves.
        let userPickedFloor = false;
        document.addEventListener('pointerdown', e => { if (e.target.closest('.mapboxgl-ctrl-top-right')) userPickedFloor = true; }, true);
        function selectStartFloor() {
            let tries = 0;
            const t = setInterval(() => {
                if (userPickedFloor || running || ++tries > 30) return clearInterval(t);
                if (readLevel() === START_LEVEL) return;
                document.querySelector(`.mapboxgl-ctrl-level-button[aria-label="${START_LEVEL}"]`)?.click();
            }, 300);
        }

        function setActiveStep(i) {
            const items = ol.querySelectorAll('li');
            items.forEach((x, k) => x.classList.toggle('active', k === i));
            items[i]?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        // ---- GPS error model --------------------------------------------------
        // The true position (on the route) drives steps and floors. The puck is drawn at a
        // smooth, repeatable offset from it: mostly sideways, a little along the route, with
        // occasional "drift episodes" where the error grows for a few seconds.
        const GPS = { good: { amp: 0.8, drift: 0.5 }, fair: { amp: 2, drift: 1 }, poor: { amp: 4, drift: 1.5 } };
        let gps = GPS.poor, dispPos = null, dispOff = null, dispLevel = null, routeHeading = null, simT = 0;
        // Noise is a function of elapsed seconds (not distance), so it stays gentle however fast the walk is simulated.
        const wave = (t, s) => 0.55 * Math.sin(t * 0.8 + s) + 0.3 * Math.sin(t * 1.9 + 2.1 * s + 1) + 0.15 * Math.sin(t * 4.3 + 3.3 * s);
        const ease = (dt, tau) => 1 - Math.exp(-dt / tau);
        const turn = (from, to, f) => (from + (((to - from + 540) % 360) - 180) * f + 360) % 360;
        function noisyPos(p, t) {
            const episode = Math.pow(Math.max(0, Math.sin(t * 0.5 + 2)), 8);   // a drift episode roughly every 12 s
            const k = gps.amp * (1 + gps.drift * 1.5 * episode);
            const side = k * wave(t, 0), along = 0.4 * k * wave(t, 5);
            const h = routeHeading * Math.PI / 180;
            const east = Math.sin(h) * along + Math.cos(h) * side, north = Math.cos(h) * along - Math.sin(h) * side;
            return { c: [p.c[0] + east / (111320 * Math.cos(p.c[1] * Math.PI / 180)), p.c[1] + north / 110540], err: Math.hypot(east, north) };
        }
        document.querySelectorAll('#gps-seg button').forEach(b => b.addEventListener('click', () => {
            gps = GPS[b.dataset.q];
            document.querySelectorAll('#gps-seg button').forEach(x => x.classList.toggle('on', x === b));
        }));

        const puckEl = document.createElement('div');
        puckEl.className = 'puck';
        puckEl.innerHTML = '<div class="puck-cone"></div><div class="puck-accuracy"></div><div class="puck-dot"></div>';
        const puck = new mapboxgl.Marker({ element: puckEl, rotationAlignment: 'map', pitchAlignment: 'map' });
        let puckOnMap = false;

        const simBtn = document.getElementById('sim-btn');
        let puckFloor = null, lastRouteCheck = 0, lastRouteRepair = 0, prevFrame = 0, moveHeading = null, lastFloorClick = 0, running = false, simDist = 0, lastT = 0, shownHeading = null, puckLevel = null, activeStep = -1, raf = 0;

        function frame(now) {
            if (!running) return;
            simDist = Math.min(path.total, simDist + (now - lastT) / 1000 * SPEED_MPS);
            lastT = now;
            const p = poseAt(simDist);
            const dt = Math.min(0.25, Math.max(0.001, (now - prevFrame) / 1000)); prevFrame = now;

            // Offset direction follows a smoothed route heading so it doesn't flip at corners.
            routeHeading = routeHeading === null ? p.heading : turn(routeHeading, p.heading, ease(dt, 0.4));
            simT += dt;
            const noisy = noisyPos(p, simT);
            // Smooth the offset only (smoothing the position itself would make the puck lag behind the route).
            const off = [noisy.c[0] - p.c[0], noisy.c[1] - p.c[1]];
            if (dispOff === null || p.level !== dispLevel) { dispOff = off; dispLevel = p.level; }   // no sweep across a floor change
            const before = dispPos || [p.c[0] + dispOff[0], p.c[1] + dispOff[1]];
            const f = ease(dt, 0.25);
            dispOff = [dispOff[0] + (off[0] - dispOff[0]) * f, dispOff[1] + (off[1] - dispOff[1]) * f];
            dispPos = [p.c[0] + dispOff[0], p.c[1] + dispOff[1]];

            // Heading comes from the puck's own movement (plus a little compass error).
            if (meters(before, dispPos) > 0.02) moveHeading = turn(moveHeading ?? p.heading, headingOf(before, dispPos), ease(dt, 0.35));
            shownHeading = (moveHeading ?? p.heading) + 4 * Math.sin(simDist * 0.2);

            // Accuracy ring: the current error plus a margin, in metres converted to pixels.
            const accM = Math.max(1.5, gps.amp * 1.2, noisy.err * 1.3 + 1);
            const mpp = 78271.517 * Math.cos(dispPos[1] * Math.PI / 180) / Math.pow(2, map.getZoom());
            puckEl.style.setProperty('--acc', Math.max(24, 2 * accM / mpp) + 'px');

            puck.setLngLat(dispPos).setRotation(shownHeading);
            if (!puckOnMap) { puck.addTo(map); puckOnMap = true; }
            map.jumpTo({ center: dispPos });

            // Follow the user to their floor. The route and puck follow the puck's floor;
            // the floor selector can lag or reset (e.g. when the camera enters another
            // building), so keep asking for the right floor until it takes.
            puckLevel = puckFloor = p.level;
            applyLevel(p.level);
            if (readLevel() !== p.level && now - lastFloorClick > 400) {
                lastFloorClick = now;
                document.querySelector(`.mapboxgl-ctrl-level-button[aria-label="${p.level}"]`)?.click();
            }
            puckEl.style.display = 'block';

            // Safety net: if nothing of the route is drawn on screen (it always passes under the puck),
            // hand the source fresh data again.
            if (now - lastRouteCheck > 600) {
                lastRouteCheck = now;
                if (map.queryRenderedFeatures({ layers: ['route-dots'] }).length === 0 && now - lastRouteRepair > 1500) { lastRouteRepair = now; showFloorRoutes(); }
            }

            let idx = 0;
            STEPS.forEach((st, k) => { if (simDist >= st.startD) idx = k; });
            if (idx !== activeStep) { activeStep = idx; setActiveStep(idx); }

            if (simDist >= path.total) { stopSim(); simBtn.textContent = '↺ Replay'; return; }
            raf = requestAnimationFrame(frame);
        }
        // Publish the sheet's height to CSS (floor selector position) and keep the map padded by it.
        new ResizeObserver(() => {
            document.documentElement.style.setProperty('--sheet-h', document.getElementById('sheet').offsetHeight + 'px');
            fitPadding();
        }).observe(document.getElementById('sheet'));
        // Keep the map centre (and so the puck) in the part not covered by the sheet.
        function fitPadding() { map.setPadding({ bottom: document.getElementById('sheet').offsetHeight + FOOT }); }
        function startSim() {
            if (!routeData || realMode) return;
            if (!path) buildPath();
            if (simDist >= path.total) simDist = 0;
            selectedLeg = null; showFloorRoutes();
            running = true; lastT = prevFrame = performance.now(); puckLevel = null; shownHeading = null; moveHeading = null; routeHeading = null; dispPos = null; dispOff = null; if (simDist === 0) simT = 0; activeStep = -1;
            simBtn.textContent = '■ Stop'; simBtn.classList.add('running');
            document.getElementById('sheet').classList.remove('collapsed');
            fitPadding();
            map.jumpTo({ center: poseAt(simDist).c, zoom: 17 });
            raf = requestAnimationFrame(frame);
        }
        function stopSim() {
            if (!running) return;
            running = false; cancelAnimationFrame(raf);
            updatePuck();
            simBtn.textContent = simDist >= path.total ? '↺ Replay' : '▶ Resume';
            simBtn.classList.remove('running');
        }
        simBtn.addEventListener('click', () => running ? stopSim() : startSim());
        // The sheet's header is a drag handle: drag up/down to resize it (what users do on a phone);
        // dragging it nearly shut collapses it, and a plain tap still toggles it.
        (() => {
            const sheet = document.getElementById('sheet'), head = document.getElementById('sheet-head');
            let startY = 0, startH = 0, moved = false, dragging = false, suppressClick = false;
            head.addEventListener('pointerdown', e => {
                dragging = true; moved = false; startY = e.clientY; startH = sheet.offsetHeight;
                head.setPointerCapture(e.pointerId);
            });
            head.addEventListener('pointermove', e => {
                if (!dragging) return;
                const dy = startY - e.clientY;
                if (!moved && Math.abs(dy) < 5) return;
                if (!moved) { moved = true; sheet.classList.add('dragging'); sheet.classList.remove('collapsed'); }
                const min = head.offsetHeight, max = window.innerHeight * 0.75;
                sheet.style.height = Math.min(max, Math.max(min, startH + dy)) + 'px';
            });
            const end = () => {
                if (!dragging) return;
                dragging = false;
                sheet.classList.remove('dragging');
                if (moved) {
                    suppressClick = true;
                    if (sheet.offsetHeight < head.offsetHeight + 60) { sheet.classList.add('collapsed'); sheet.style.height = ''; }
                }
            };
            head.addEventListener('pointerup', end);
            head.addEventListener('pointercancel', end);
            head.addEventListener('click', () => {
                if (suppressClick) { suppressClick = false; return; }
                sheet.classList.toggle('collapsed');
                sheet.style.height = '';
            });
        })();
    </script>
</body>
</html>
