name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # write: the build job commits thumbnails for newly added demos.
  contents: write
  pages: write
  id-token: write

# Only one deployment at a time; let in-progress runs finish rather than
# canceling them mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Thumbnails run here, not in a separate workflow: a commit pushed with
      # GITHUB_TOKEN never triggers another workflow run, so a separate job's
      # images would not be deployed until some later push. Generating them
      # before Flatten ships them in this same deploy (and can't loop).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Generate thumbnails for demos that have none
        run: npm run thumbs

      - name: Commit new thumbnails
        run: |
          git add demos/thumbs
          if git diff --cached --quiet; then
            echo "No new thumbnails."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add demo thumbnails [skip ci]"
          # The demo generator also pushes to main, so rebase and retry.
          # --autostash: node_modules/ is tracked, so `npm ci` leaves
          # unstaged changes that would otherwise block the rebase.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push thumbnail commit; they are still deployed in this run."

      - name: Flatten demos/ to the published root
        run: ./scripts/flatten-demos.sh

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
